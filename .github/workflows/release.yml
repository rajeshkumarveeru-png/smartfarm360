name: Release image

# A version tag (v0.15.0) builds the production image, scans it, and publishes it to the GitHub container registry,
# where staging and production pull it (docs/ops/staging.md). The tag must be on a commit that passed CI.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the production image
        run: docker build -f deploy/Dockerfile -t ${{ steps.name.outputs.image }} .
      # The same gate as CI: no critical finding that has a fix (SaaS operations design, O13)
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.name.outputs.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ${{ steps.name.outputs.image }}
