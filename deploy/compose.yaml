# Reference production set-up (SaaS operations design, sections 3–5): the app and Caddy on one server, with a managed
# PostgreSQL 18 elsewhere. Values come from deploy/.env (copy deploy/env.example; readable only by the service user).
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
name: smartfarm360

services:
  app:
    image: ${SMARTFARM_IMAGE:?set SMARTFARM_IMAGE, for example ghcr.io/owner/smartfarm360:0.14.0}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - exports:/app/exports
    expose:
      - "8080"
    ports:
      # Metrics and probes only on the server itself, for the monitoring agent
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8091 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "10" }

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, for example app.smartfarm360.in}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  exports:
  caddy-data:
  caddy-config:
