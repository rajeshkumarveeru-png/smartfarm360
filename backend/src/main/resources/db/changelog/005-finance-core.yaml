                ('MACHINE_HIRE', 'Machine and tractor hire', 'EXPENSE', '5600'),
                ('OTHER_EXPENSE', 'Other expenses', 'EXPENSE', '5600'),
                ('BANK_CHARGES', 'Bank charges', 'EXPENSE', '5950'),
                ('CROP_SALE', 'Crop sales', 'INCOME', '4000'),
                ('MILK_SALE', 'Milk sales', 'INCOME', '4000'),
                ('EGG_SALE', 'Egg sales', 'INCOME', '4000'),
