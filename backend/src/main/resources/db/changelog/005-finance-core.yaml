databaseChangeLog:
  # Phase 3 finance core. See docs/finance/posting-rules.md (approved 2026-10-20). Forward-only.
  - changeSet:
      id: 031-finance-schema
      author: smartfarm360
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- System ledger accounts (section 2 of the posting rules). Shared by all tenants; never edited.
              CREATE TABLE sf_ledger_accounts (
                code VARCHAR(10) PRIMARY KEY,
                account_type VARCHAR(12) NOT NULL CHECK (account_type IN ('ASSET', 'CONTRA_ASSET', 'LIABILITY', 'EQUITY', 'INCOME', 'EXPENSE')),
                normal_side VARCHAR(6) NOT NULL CHECK (normal_side IN ('DEBIT', 'CREDIT')),
                name VARCHAR(80) NOT NULL
              );

              CREATE TABLE sf_finance_categories (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT REFERENCES sf_tenants (id),
                code VARCHAR(40),
                name VARCHAR(80),
                default_name VARCHAR(80),
                kind VARCHAR(10) NOT NULL CHECK (kind IN ('EXPENSE', 'INCOME', 'ASSET')),
                account_code VARCHAR(10) NOT NULL REFERENCES sf_ledger_accounts (code),
                active BOOLEAN NOT NULL DEFAULT TRUE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT ck_sf_category_scope CHECK ((tenant_id IS NULL AND code IS NOT NULL) OR (tenant_id IS NOT NULL AND name IS NOT NULL))
              );
              CREATE UNIQUE INDEX uq_sf_category_system_code ON sf_finance_categories (code) WHERE tenant_id IS NULL;
              CREATE UNIQUE INDEX uq_sf_category_tenant_name ON sf_finance_categories (tenant_id, lower(name)) WHERE tenant_id IS NOT NULL;

              CREATE TABLE sf_financial_accounts (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                name VARCHAR(80) NOT NULL,
                kind VARCHAR(10) NOT NULL CHECK (kind IN ('CASH', 'BANK', 'UPI')),
                account_code VARCHAR(10) NOT NULL REFERENCES sf_ledger_accounts (code),
                active BOOLEAN NOT NULL DEFAULT TRUE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_fin_account_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT ck_sf_fin_account_code CHECK ((kind = 'CASH' AND account_code = '1000') OR (kind <> 'CASH' AND account_code = '1010'))
              );
              CREATE UNIQUE INDEX uq_sf_fin_account_name ON sf_financial_accounts (tenant_id, lower(name));

              CREATE TABLE sf_parties (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                name VARCHAR(140) NOT NULL,
                phone VARCHAR(30),
                village VARCHAR(120),
                notes VARCHAR(300),
                is_customer BOOLEAN NOT NULL DEFAULT FALSE,
                is_supplier BOOLEAN NOT NULL DEFAULT FALSE,
                is_lender BOOLEAN NOT NULL DEFAULT FALSE,
                legacy_supplier_id BIGINT UNIQUE REFERENCES sf_suppliers (id),
                active BOOLEAN NOT NULL DEFAULT TRUE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_party_tenant_id UNIQUE (tenant_id, id)
              );
              CREATE INDEX ix_sf_party_tenant_name ON sf_parties (tenant_id, lower(name));

              -- Activities that costs and revenue can be assigned to. Every tenant has one OVERHEAD object.
              CREATE TABLE sf_cost_objects (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                kind VARCHAR(20) NOT NULL CHECK (kind IN ('OVERHEAD', 'CROP_CYCLE')),
                name VARCHAR(140) NOT NULL,
                crop_cycle_id BIGINT,
                farm_id BIGINT,
                active BOOLEAN NOT NULL DEFAULT TRUE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_cost_object_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_cost_object_cycle UNIQUE (tenant_id, crop_cycle_id),
                CONSTRAINT fk_sf_cost_object_cycle FOREIGN KEY (tenant_id, crop_cycle_id) REFERENCES sf_cultivation_cycles (tenant_id, id),
                CONSTRAINT fk_sf_cost_object_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT ck_sf_cost_object_cycle CHECK ((kind = 'CROP_CYCLE') = (crop_cycle_id IS NOT NULL))
              );
              CREATE UNIQUE INDEX uq_sf_cost_object_overhead ON sf_cost_objects (tenant_id) WHERE kind = 'OVERHEAD';

              CREATE TABLE sf_loans (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                lender_party_id BIGINT NOT NULL,
                name VARCHAR(140) NOT NULL,
                start_date DATE NOT NULL,
                notes VARCHAR(300),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_loan_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_loan_lender FOREIGN KEY (tenant_id, lender_party_id) REFERENCES sf_parties (tenant_id, id)
              );

              CREATE TABLE sf_finance_documents (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                doc_type VARCHAR(20) NOT NULL CHECK (doc_type IN ('BILL', 'SALE', 'PAYMENT', 'RECEIPT', 'TRANSFER', 'OWNER_IN', 'OWNER_OUT',
                  'LOAN_RECEIVED', 'LOAN_REPAYMENT', 'SETTLEMENT', 'WRITE_OFF', 'OPENING_BALANCE', 'DEPRECIATION')),
                status VARCHAR(12) NOT NULL CHECK (status IN ('DRAFT', 'POSTED', 'REVERSED', 'CANCELLED')),
                number VARCHAR(40),
                doc_date DATE NOT NULL,
                due_date DATE,
                party_id BIGINT,
                farm_id BIGINT,
                financial_account_id BIGINT,
                to_financial_account_id BIGINT,
                loan_id BIGINT,
                total_amount NUMERIC(14, 2) NOT NULL CHECK (total_amount > 0),
                principal_amount NUMERIC(14, 2) CHECK (principal_amount >= 0),
                interest_amount NUMERIC(14, 2) CHECK (interest_amount >= 0),
                notes VARCHAR(500),
                reference_no VARCHAR(100),
                needs_review BOOLEAN NOT NULL DEFAULT FALSE,
                reversal_date DATE,
                reversed_at TIMESTAMP WITH TIME ZONE,
                reversed_by BIGINT REFERENCES sf_users (id),
                idempotency_key VARCHAR(100),
                request_hash VARCHAR(64),
                legacy_source VARCHAR(40),
                legacy_id BIGINT,
                legacy_created_by VARCHAR(254),
                created_by BIGINT REFERENCES sf_users (id),
                posted_at TIMESTAMP WITH TIME ZONE,
                posted_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_doc_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_doc_number UNIQUE (tenant_id, doc_type, number),
                CONSTRAINT uq_sf_doc_idempotency UNIQUE (tenant_id, idempotency_key),
                CONSTRAINT uq_sf_doc_legacy UNIQUE (legacy_source, legacy_id),
                CONSTRAINT ck_sf_doc_number_when_posted CHECK (status IN ('DRAFT', 'CANCELLED') OR number IS NOT NULL),
                CONSTRAINT fk_sf_doc_party FOREIGN KEY (tenant_id, party_id) REFERENCES sf_parties (tenant_id, id),
                CONSTRAINT fk_sf_doc_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT fk_sf_doc_fin_account FOREIGN KEY (tenant_id, financial_account_id) REFERENCES sf_financial_accounts (tenant_id, id),
                CONSTRAINT fk_sf_doc_to_fin_account FOREIGN KEY (tenant_id, to_financial_account_id) REFERENCES sf_financial_accounts (tenant_id, id),
                CONSTRAINT fk_sf_doc_loan FOREIGN KEY (tenant_id, loan_id) REFERENCES sf_loans (tenant_id, id)
              );
              CREATE INDEX ix_sf_doc_tenant_date ON sf_finance_documents (tenant_id, doc_date DESC, id DESC);
              CREATE INDEX ix_sf_doc_tenant_party ON sf_finance_documents (tenant_id, party_id);

              CREATE TABLE sf_finance_document_lines (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                document_id BIGINT NOT NULL,
                line_no INTEGER NOT NULL,
                category_id BIGINT REFERENCES sf_finance_categories (id),
                account_code VARCHAR(10) NOT NULL REFERENCES sf_ledger_accounts (code),
                side VARCHAR(6) CHECK (side IN ('DEBIT', 'CREDIT')),
                description VARCHAR(240),
                quantity NUMERIC(18, 4),
                unit VARCHAR(20),
                rate NUMERIC(18, 4),
                amount NUMERIC(14, 2) NOT NULL CHECK (amount > 0),
                cost_object_id BIGINT,
                farm_id BIGINT,
                party_id BIGINT,
                financial_account_id BIGINT,
                loan_id BIGINT,
                CONSTRAINT uq_sf_doc_line_no UNIQUE (document_id, line_no),
                CONSTRAINT fk_sf_doc_line_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT fk_sf_doc_line_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id),
                CONSTRAINT fk_sf_doc_line_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT fk_sf_doc_line_party FOREIGN KEY (tenant_id, party_id) REFERENCES sf_parties (tenant_id, id),
                CONSTRAINT fk_sf_doc_line_fin_account FOREIGN KEY (tenant_id, financial_account_id) REFERENCES sf_financial_accounts (tenant_id, id),
                CONSTRAINT fk_sf_doc_line_loan FOREIGN KEY (tenant_id, loan_id) REFERENCES sf_loans (tenant_id, id)
              );

              -- Matches payments, receipts, settlements and write-offs to the bills and sales they settle.
              CREATE TABLE sf_payment_allocations (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                source_document_id BIGINT NOT NULL,
                target_document_id BIGINT NOT NULL,
                amount NUMERIC(14, 2) NOT NULL CHECK (amount > 0),
                allocation_date DATE NOT NULL,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                removed_at TIMESTAMP WITH TIME ZONE,
                removed_by BIGINT REFERENCES sf_users (id),
                CONSTRAINT fk_sf_alloc_source FOREIGN KEY (tenant_id, source_document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT fk_sf_alloc_target FOREIGN KEY (tenant_id, target_document_id) REFERENCES sf_finance_documents (tenant_id, id)
              );
              CREATE INDEX ix_sf_alloc_source ON sf_payment_allocations (source_document_id);
              CREATE INDEX ix_sf_alloc_target ON sf_payment_allocations (target_document_id);

              CREATE TABLE sf_journal_entries (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                document_id BIGINT NOT NULL,
                entry_date DATE NOT NULL,
                kind VARCHAR(10) NOT NULL CHECK (kind IN ('POSTING', 'REVERSAL')),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_entry_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_entry_doc_kind UNIQUE (document_id, kind),
                CONSTRAINT fk_sf_entry_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id)
              );
              CREATE INDEX ix_sf_entry_tenant_date ON sf_journal_entries (tenant_id, entry_date);

              CREATE TABLE sf_journal_lines (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                entry_id BIGINT NOT NULL,
                account_code VARCHAR(10) NOT NULL REFERENCES sf_ledger_accounts (code),
                debit NUMERIC(14, 2) NOT NULL DEFAULT 0,
                credit NUMERIC(14, 2) NOT NULL DEFAULT 0,
                category_id BIGINT REFERENCES sf_finance_categories (id),
                financial_account_id BIGINT,
                party_id BIGINT,
                cost_object_id BIGINT,
                farm_id BIGINT,
                loan_id BIGINT,
                CONSTRAINT ck_sf_journal_one_side CHECK (debit >= 0 AND credit >= 0 AND ((debit = 0) <> (credit = 0))),
                CONSTRAINT fk_sf_journal_entry FOREIGN KEY (tenant_id, entry_id) REFERENCES sf_journal_entries (tenant_id, id),
                CONSTRAINT fk_sf_journal_fin_account FOREIGN KEY (tenant_id, financial_account_id) REFERENCES sf_financial_accounts (tenant_id, id),
                CONSTRAINT fk_sf_journal_party FOREIGN KEY (tenant_id, party_id) REFERENCES sf_parties (tenant_id, id),
                CONSTRAINT fk_sf_journal_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id),
                CONSTRAINT fk_sf_journal_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT fk_sf_journal_loan FOREIGN KEY (tenant_id, loan_id) REFERENCES sf_loans (tenant_id, id)
              );
              CREATE INDEX ix_sf_journal_line_entry ON sf_journal_lines (entry_id);
              CREATE INDEX ix_sf_journal_line_tenant_account ON sf_journal_lines (tenant_id, account_code);
              CREATE INDEX ix_sf_journal_line_tenant_party ON sf_journal_lines (tenant_id, party_id) WHERE party_id IS NOT NULL;

              -- Gap-free numbering per tenant, record type and fiscal year
              CREATE TABLE sf_document_sequences (
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                doc_type VARCHAR(20) NOT NULL,
                fiscal_year INTEGER NOT NULL,
                next_value INTEGER NOT NULL,
                PRIMARY KEY (tenant_id, doc_type, fiscal_year)
              );

              ALTER TABLE sf_tenant_settings ADD COLUMN fiscal_year_start_month SMALLINT NOT NULL DEFAULT 4 CHECK (fiscal_year_start_month BETWEEN 1 AND 12);
              ALTER TABLE sf_tenant_settings ADD COLUMN lock_date DATE;
      rollback:
        - sql:
            sql: >
              ALTER TABLE sf_tenant_settings DROP COLUMN lock_date; ALTER TABLE sf_tenant_settings DROP COLUMN fiscal_year_start_month;
              DROP TABLE sf_document_sequences; DROP TABLE sf_journal_lines; DROP TABLE sf_journal_entries; DROP TABLE sf_payment_allocations;
              DROP TABLE sf_finance_document_lines; DROP TABLE sf_finance_documents; DROP TABLE sf_loans; DROP TABLE sf_cost_objects;
              DROP TABLE sf_parties; DROP TABLE sf_financial_accounts; DROP TABLE sf_finance_categories; DROP TABLE sf_ledger_accounts;

  - changeSet:
      id: 032-finance-journal-guards
      author: smartfarm360
      comment: The journal is append-only and every entry must balance at commit time.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION sf_journal_append_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                RAISE EXCEPTION 'SmartFarm360 journal is append-only (% on %)', TG_OP, TG_TABLE_NAME;
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE TRIGGER trg_sf_journal_entries_append_only BEFORE UPDATE OR DELETE ON sf_journal_entries
                FOR EACH ROW EXECUTE FUNCTION sf_journal_append_only()
        - sql:
            splitStatements: false
            sql: |
              CREATE TRIGGER trg_sf_journal_lines_append_only BEFORE UPDATE OR DELETE ON sf_journal_lines
                FOR EACH ROW EXECUTE FUNCTION sf_journal_append_only()
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION sf_journal_check_balance() RETURNS trigger LANGUAGE plpgsql AS $$
              DECLARE difference NUMERIC;
              BEGIN
                SELECT COALESCE(SUM(debit), 0) - COALESCE(SUM(credit), 0) INTO difference
                FROM sf_journal_lines WHERE entry_id = NEW.entry_id;
                IF difference <> 0 THEN
                  RAISE EXCEPTION 'Journal entry % does not balance (difference %)', NEW.entry_id, difference;
                END IF;
                RETURN NULL;
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE CONSTRAINT TRIGGER trg_sf_journal_balanced AFTER INSERT ON sf_journal_lines
                DEFERRABLE INITIALLY DEFERRED FOR EACH ROW EXECUTE FUNCTION sf_journal_check_balance()
      rollback:
        - sql:
            sql: >
              DROP TRIGGER trg_sf_journal_balanced ON sf_journal_lines; DROP FUNCTION sf_journal_check_balance();
              DROP TRIGGER trg_sf_journal_lines_append_only ON sf_journal_lines; DROP TRIGGER trg_sf_journal_entries_append_only ON sf_journal_entries;
              DROP FUNCTION sf_journal_append_only();

  - changeSet:
      id: 033-finance-seed
      author: smartfarm360
      comment: Ledger accounts, system categories and finance permissions. Must match LedgerAccount, FinanceCategoryCode and Permission.
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO sf_ledger_accounts (code, account_type, normal_side, name) VALUES
                ('1000', 'ASSET', 'DEBIT', 'Cash in hand'),
                ('1010', 'ASSET', 'DEBIT', 'Bank and UPI accounts'),
