  - changeSet:
      id: 034-finance-legacy-migration
      author: smartfarm360
      comment: >
        Moves Phase 1 money records into documents and journal entries (section 9 of the posting rules) and verifies
        counts and totals. Nothing is deleted; sf_finance_entries becomes read-only.
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- Defaults every tenant needs: overhead cost object, a cash account, cost objects for crop cycles
              INSERT INTO sf_cost_objects (tenant_id, kind, name) SELECT id, 'OVERHEAD', 'Farm overhead' FROM sf_tenants;
              INSERT INTO sf_cost_objects (tenant_id, kind, name, crop_cycle_id, farm_id)
                SELECT tenant_id, 'CROP_CYCLE', name, id, farm_id FROM sf_cultivation_cycles;
              INSERT INTO sf_financial_accounts (tenant_id, name, kind, account_code) SELECT id, 'Cash in hand', 'CASH', '1000' FROM sf_tenants;
              INSERT INTO sf_financial_accounts (tenant_id, name, kind, account_code)
                SELECT DISTINCT tenant_id, 'Cash (migrated)', 'CASH', '1000' FROM (
                  SELECT tenant_id FROM sf_finance_entries WHERE payment_status = 'PAID'
                  UNION SELECT tenant_id FROM sf_purchases WHERE paid_amount > 0) t;

              -- Suppliers become parties; an "Unknown (migrated)" party holds unpaid legacy entries
              INSERT INTO sf_parties (tenant_id, name, phone, village, notes, is_supplier, legacy_supplier_id, active, created_at)
                SELECT tenant_id, name, phone, village, notes, TRUE, id, active, created_at FROM sf_suppliers;
              INSERT INTO sf_parties (tenant_id, name, is_customer, is_supplier, notes)
                SELECT DISTINCT tenant_id, 'Unknown (migrated)', TRUE, TRUE, 'Created when Phase 1 unpaid entries were migrated'
                FROM sf_finance_entries WHERE payment_status IN ('UNPAID', 'PARTIAL');

              -- Free-text categories: reuse a system category with the same name, otherwise create a tenant category
              INSERT INTO sf_finance_categories (tenant_id, name, kind, account_code)
                SELECT DISTINCT e.tenant_id, e.category, CASE e.entry_type WHEN 'INCOME' THEN 'INCOME' ELSE 'EXPENSE' END,
                       CASE e.entry_type WHEN 'INCOME' THEN '4100' ELSE '5600' END
                FROM sf_finance_entries e
                WHERE NOT EXISTS (SELECT 1 FROM sf_finance_categories c WHERE c.tenant_id IS NULL
                                  AND c.kind = CASE e.entry_type WHEN 'INCOME' THEN 'INCOME' ELSE 'EXPENSE' END
                                  AND (lower(c.default_name) = lower(e.category) OR lower(c.code) = lower(e.category)));

              -- Legacy finance entries -> posted bills and sales
              INSERT INTO sf_finance_documents (tenant_id, doc_type, status, number, doc_date, party_id, farm_id, financial_account_id,
                    total_amount, notes, reference_no, needs_review, legacy_source, legacy_id, legacy_created_by, posted_at, created_at)
                SELECT e.tenant_id, CASE e.entry_type WHEN 'INCOME' THEN 'SALE' ELSE 'BILL' END, 'POSTED', 'MIG-' || e.id, e.occurred_on,
                       CASE WHEN e.payment_status = 'PAID' THEN NULL ELSE (SELECT p.id FROM sf_parties p WHERE p.tenant_id = e.tenant_id AND p.name = 'Unknown (migrated)' AND p.legacy_supplier_id IS NULL) END,
                       e.farm_id,
                       CASE WHEN e.payment_status = 'PAID' THEN (SELECT f.id FROM sf_financial_accounts f WHERE f.tenant_id = e.tenant_id AND f.name = 'Cash (migrated)') END,
                       e.amount, e.description, e.reference_no, e.payment_status = 'PARTIAL', 'sf_finance_entries', e.id, e.created_by, e.created_at, e.created_at
                FROM sf_finance_entries e;

              INSERT INTO sf_finance_document_lines (tenant_id, document_id, line_no, category_id, account_code, description, amount, cost_object_id, farm_id)
                SELECT d.tenant_id, d.id, 1, c.id, c.account_code, e.description, e.amount,
                       (SELECT o.id FROM sf_cost_objects o WHERE o.tenant_id = d.tenant_id AND o.kind = 'OVERHEAD'), e.farm_id
                FROM sf_finance_documents d
                JOIN sf_finance_entries e ON d.legacy_source = 'sf_finance_entries' AND d.legacy_id = e.id
                JOIN LATERAL (
                  SELECT c.id, c.account_code FROM sf_finance_categories c
                  WHERE c.kind = CASE e.entry_type WHEN 'INCOME' THEN 'INCOME' ELSE 'EXPENSE' END
                    AND ((c.tenant_id IS NULL AND (lower(c.default_name) = lower(e.category) OR lower(c.code) = lower(e.category)))
                         OR (c.tenant_id = e.tenant_id AND lower(c.name) = lower(e.category)))
                  ORDER BY c.tenant_id NULLS FIRST LIMIT 1) c ON TRUE;

              -- Legacy purchases (money side) -> posted bills to stock, plus payments for the paid part
              INSERT INTO sf_finance_documents (tenant_id, doc_type, status, number, doc_date, party_id, total_amount, notes,
                    legacy_source, legacy_id, legacy_created_by, posted_at, created_at)
                SELECT p.tenant_id, 'BILL', 'POSTED', 'MIG-P-' || p.id, p.purchase_date,
                       (SELECT pa.id FROM sf_parties pa WHERE pa.legacy_supplier_id = p.supplier_id),
                       p.total_amount, p.notes, 'sf_purchases', p.id, p.created_by, p.created_at, p.created_at
                FROM sf_purchases p WHERE p.total_amount > 0;
              INSERT INTO sf_finance_document_lines (tenant_id, document_id, line_no, account_code, description, quantity, unit, rate, amount)
                SELECT d.tenant_id, d.id, 1, '1200', i.name, p.quantity, i.unit, p.unit_cost, p.total_amount
                FROM sf_finance_documents d
                JOIN sf_purchases p ON d.legacy_source = 'sf_purchases' AND d.legacy_id = p.id
                JOIN sf_inventory_items i ON i.id = p.item_id;
              INSERT INTO sf_finance_documents (tenant_id, doc_type, status, number, doc_date, party_id, financial_account_id, total_amount,
                    legacy_source, legacy_id, legacy_created_by, posted_at, created_at)
                SELECT p.tenant_id, 'PAYMENT', 'POSTED', 'MIG-PP-' || p.id, p.purchase_date,
                       (SELECT pa.id FROM sf_parties pa WHERE pa.legacy_supplier_id = p.supplier_id),
                       (SELECT f.id FROM sf_financial_accounts f WHERE f.tenant_id = p.tenant_id AND f.name = 'Cash (migrated)'),
                       p.paid_amount, 'sf_purchases.paid_amount', p.id, p.created_by, p.created_at, p.created_at
                FROM sf_purchases p WHERE p.paid_amount > 0;
              INSERT INTO sf_payment_allocations (tenant_id, source_document_id, target_document_id, amount, allocation_date)
                SELECT pay.tenant_id, pay.id, bill.id, pay.total_amount, pay.doc_date
                FROM sf_finance_documents pay
                JOIN sf_finance_documents bill ON bill.legacy_source = 'sf_purchases' AND bill.legacy_id = pay.legacy_id
                WHERE pay.legacy_source = 'sf_purchases.paid_amount';

              -- Journal for every migrated document (posting rules P1, P2, P3, P4, P5)
              INSERT INTO sf_journal_entries (tenant_id, document_id, entry_date, kind)
                SELECT tenant_id, id, doc_date, 'POSTING' FROM sf_finance_documents WHERE legacy_source IS NOT NULL;
              -- Bills/sales: one line per document line on the expense/income/stock account
              INSERT INTO sf_journal_lines (tenant_id, entry_id, account_code, debit, credit, category_id, cost_object_id, farm_id)
                SELECT d.tenant_id, j.id, l.account_code,
                       CASE WHEN d.doc_type = 'BILL' THEN l.amount ELSE 0 END,
                       CASE WHEN d.doc_type = 'SALE' THEN l.amount ELSE 0 END,
                       l.category_id, l.cost_object_id, l.farm_id
                FROM sf_finance_documents d JOIN sf_journal_entries j ON j.document_id = d.id
                JOIN sf_finance_document_lines l ON l.document_id = d.id
                WHERE d.legacy_source IN ('sf_finance_entries', 'sf_purchases');
              -- Bills/sales: the balancing line (party control account, or cash when paid without a party)
              INSERT INTO sf_journal_lines (tenant_id, entry_id, account_code, debit, credit, financial_account_id, party_id, farm_id)
                SELECT d.tenant_id, j.id,
                       CASE WHEN d.party_id IS NULL THEN '1000' WHEN d.doc_type = 'BILL' THEN '2000' ELSE '1100' END,
                       CASE WHEN d.doc_type = 'SALE' THEN d.total_amount ELSE 0 END,
                       CASE WHEN d.doc_type = 'BILL' THEN d.total_amount ELSE 0 END,
                       CASE WHEN d.party_id IS NULL THEN d.financial_account_id END, d.party_id, d.farm_id
                FROM sf_finance_documents d JOIN sf_journal_entries j ON j.document_id = d.id
                WHERE d.legacy_source IN ('sf_finance_entries', 'sf_purchases');
              -- Payments for purchases: Dr payables (supplier) / Cr cash
              INSERT INTO sf_journal_lines (tenant_id, entry_id, account_code, debit, credit, party_id)
                SELECT d.tenant_id, j.id, '2000', d.total_amount, 0, d.party_id
                FROM sf_finance_documents d JOIN sf_journal_entries j ON j.document_id = d.id
                WHERE d.legacy_source = 'sf_purchases.paid_amount';
              INSERT INTO sf_journal_lines (tenant_id, entry_id, account_code, debit, credit, financial_account_id)
                SELECT d.tenant_id, j.id, '1000', 0, d.total_amount, d.financial_account_id
                FROM sf_finance_documents d JOIN sf_journal_entries j ON j.document_id = d.id
                WHERE d.legacy_source = 'sf_purchases.paid_amount';
        - sql:
            splitStatements: false
            comment: Verify the migration before it commits; any mismatch aborts the changeset.
            sql: |
              DO $$
              DECLARE problems TEXT := '';
              BEGIN
                IF (SELECT count(*) FROM sf_finance_entries) <> (SELECT count(*) FROM sf_finance_documents WHERE legacy_source = 'sf_finance_entries') THEN
                  problems := problems || 'entry count; ';
                END IF;
                IF (SELECT count(*) FROM sf_finance_entries) <> (SELECT count(*) FROM sf_finance_document_lines l
                     JOIN sf_finance_documents d ON d.id = l.document_id WHERE d.legacy_source = 'sf_finance_entries') THEN
                  problems := problems || 'entry lines (category not matched); ';
                END IF;
                IF EXISTS (SELECT 1 FROM (SELECT tenant_id, entry_type, payment_status, sum(amount) s FROM sf_finance_entries GROUP BY 1, 2, 3) a
                           FULL JOIN (SELECT d.tenant_id, CASE d.doc_type WHEN 'SALE' THEN 'INCOME' ELSE 'EXPENSE' END entry_type,
                                             e.payment_status, sum(d.total_amount) s
                                      FROM sf_finance_documents d JOIN sf_finance_entries e ON d.legacy_id = e.id AND d.legacy_source = 'sf_finance_entries'
                                      GROUP BY 1, 2, 3) b USING (tenant_id, entry_type, payment_status)
                           WHERE a.s IS DISTINCT FROM b.s) THEN
                  problems := problems || 'entry totals; ';
                END IF;
                IF (SELECT coalesce(sum(total_amount), 0) FROM sf_purchases) <> (SELECT coalesce(sum(total_amount), 0) FROM sf_finance_documents WHERE legacy_source = 'sf_purchases') THEN
                  problems := problems || 'purchase totals; ';
                END IF;
                IF (SELECT coalesce(sum(paid_amount), 0) FROM sf_purchases) <> (SELECT coalesce(sum(amount), 0) FROM sf_payment_allocations a
                     JOIN sf_finance_documents d ON d.id = a.source_document_id WHERE d.legacy_source = 'sf_purchases.paid_amount') THEN
                  problems := problems || 'purchase payments; ';
                END IF;
                IF EXISTS (SELECT 1 FROM sf_journal_lines GROUP BY entry_id HAVING sum(debit) <> sum(credit)) THEN
                  problems := problems || 'unbalanced journal; ';
                END IF;
                IF problems <> '' THEN
                  RAISE EXCEPTION 'Finance legacy migration verification failed: %', problems;
                END IF;
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION sf_legacy_read_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                RAISE EXCEPTION '% is read-only since Phase 3; use finance documents', TG_TABLE_NAME;
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE TRIGGER trg_sf_finance_entries_read_only BEFORE INSERT OR UPDATE OR DELETE ON sf_finance_entries
                FOR EACH ROW EXECUTE FUNCTION sf_legacy_read_only()
      rollback:
        - sql:
            sql: >
              DROP TRIGGER trg_sf_finance_entries_read_only ON sf_finance_entries; DROP FUNCTION sf_legacy_read_only();
