databaseChangeLog:
  - changeSet:
      id: 047-crop-action-plans
      author: smartfarm360
      comment: Farmer-managed recurring field action reminders for cultivation cycles.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE sf_crop_action_plan_items (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                cycle_id BIGINT NOT NULL,
                action_type VARCHAR(24) NOT NULL CHECK (action_type IN ('WEEDING','IRRIGATION','PESTICIDE','FERTILIZER','LAND_PREPARATION','OTHER')),
                description VARCHAR(300) NOT NULL,
                due_on DATE NOT NULL,
                completed_on DATE,
                next_item_id BIGINT,
                created_by BIGINT REFERENCES sf_users (id),
                completed_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_crop_action_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_crop_action_cycle FOREIGN KEY (tenant_id, cycle_id) REFERENCES sf_cultivation_cycles (tenant_id, id),
                CONSTRAINT fk_sf_crop_action_next FOREIGN KEY (tenant_id, next_item_id) REFERENCES sf_crop_action_plan_items (tenant_id, id)
              );
              CREATE INDEX ix_sf_crop_action_due ON sf_crop_action_plan_items (tenant_id, due_on) WHERE completed_on IS NULL;
      rollback:
        - sql:
            sql: DROP TABLE sf_crop_action_plan_items;
