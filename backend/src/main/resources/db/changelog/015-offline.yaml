databaseChangeLog:
  # Phase 13 mobile offline. See docs/mobile/mobile-offline.md (approved 2026-10-22). Forward-only.
  - changeSet:
      id: 053-idempotent-requests
      author: smartfarm360
      comment: The general idempotency store (N4) for the endpoints the phone uses offline.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE sf_idempotent_requests (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                user_id BIGINT NOT NULL REFERENCES sf_users (id),
                idempotency_key VARCHAR(100) NOT NULL,
                method VARCHAR(8) NOT NULL,
                path VARCHAR(300) NOT NULL,
                request_hash VARCHAR(64) NOT NULL,
                response_status INT,
                response_type VARCHAR(100),
                response_body TEXT,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                completed_at TIMESTAMP WITH TIME ZONE,
                CONSTRAINT uq_sf_idempotent_request UNIQUE (tenant_id, idempotency_key),
                CONSTRAINT ck_sf_idempotent_request_done CHECK ((response_status IS NULL) = (completed_at IS NULL))
              );
              CREATE INDEX ix_sf_idempotent_request_age ON sf_idempotent_requests (tenant_id, created_at);
      rollback:
        - sql:
            sql: DROP TABLE sf_idempotent_requests;
