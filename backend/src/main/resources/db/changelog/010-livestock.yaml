databaseChangeLog:
  # Phase 8 livestock and dairy. See docs/livestock/livestock-and-dairy.md (approved 2026-10-21). Forward-only.
  - changeSet:
      id: 043-livestock-schema
      author: smartfarm360
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- Animal groups are cost objects (I2)
              ALTER TABLE sf_cost_objects DROP CONSTRAINT sf_cost_objects_kind_check;
              ALTER TABLE sf_cost_objects ADD CONSTRAINT ck_sf_cost_object_kind CHECK (kind IN ('OVERHEAD', 'CROP_CYCLE', 'ANIMAL_GROUP'));

              CREATE TABLE sf_animal_groups (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                cost_object_id BIGINT NOT NULL,
                purpose VARCHAR(10) NOT NULL CHECK (purpose IN ('MILKING', 'DRY', 'HEIFER', 'CALF', 'BULL', 'OTHER')),
                notes VARCHAR(300),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_animal_group_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_animal_group_cost_object UNIQUE (tenant_id, cost_object_id),
                CONSTRAINT fk_sf_animal_group_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id)
              );

              -- Animals (I1): individuals; bought ones link to the asset register (I3)
              CREATE TABLE sf_animals (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                tag VARCHAR(40) NOT NULL,
                name VARCHAR(80),
                species VARCHAR(10) NOT NULL CHECK (species IN ('COW', 'BUFFALO')),
                breed VARCHAR(80),
                sex VARCHAR(6) NOT NULL CHECK (sex IN ('FEMALE', 'MALE')),
                birth_date DATE,
                birth_date_estimated BOOLEAN NOT NULL DEFAULT FALSE,
                origin VARCHAR(10) NOT NULL CHECK (origin IN ('BORN', 'BOUGHT', 'RECEIVED')),
                arrived_on DATE NOT NULL,
                dam_id BIGINT,
                sire VARCHAR(120),
                farm_id BIGINT,
                asset_id BIGINT,
                status VARCHAR(8) NOT NULL DEFAULT 'ACTIVE' CHECK (status IN ('ACTIVE', 'SOLD', 'DIED', 'CULLED')),
                exit_date DATE,
                exit_cause VARCHAR(300),
                exit_document_id BIGINT,
                notes VARCHAR(500),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_animal_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_animal_asset UNIQUE (tenant_id, asset_id),
                CONSTRAINT fk_sf_animal_dam FOREIGN KEY (tenant_id, dam_id) REFERENCES sf_animals (tenant_id, id),
                CONSTRAINT fk_sf_animal_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT fk_sf_animal_asset FOREIGN KEY (tenant_id, asset_id) REFERENCES sf_assets (tenant_id, id),
                CONSTRAINT fk_sf_animal_exit_doc FOREIGN KEY (tenant_id, exit_document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT ck_sf_animal_exit CHECK ((status = 'ACTIVE') = (exit_date IS NULL))
              );
              CREATE UNIQUE INDEX uq_sf_animal_tag ON sf_animals (tenant_id, lower(tag));

              -- Dated group membership: a cost or a litre belongs to the group the animal was in that day (I2)
              CREATE TABLE sf_animal_group_moves (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                animal_id BIGINT NOT NULL,
                group_id BIGINT NOT NULL,
                from_date DATE NOT NULL,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_group_move_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_group_move_day UNIQUE (tenant_id, animal_id, from_date),
                CONSTRAINT fk_sf_group_move_animal FOREIGN KEY (tenant_id, animal_id) REFERENCES sf_animals (tenant_id, id),
                CONSTRAINT fk_sf_group_move_group FOREIGN KEY (tenant_id, group_id) REFERENCES sf_animal_groups (tenant_id, id)
              );

              -- Milk per session and group (I5), optional per-animal yields, and the day's produce records (I6)
              CREATE TABLE sf_milk_sessions (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                milk_date DATE NOT NULL,
                session VARCHAR(8) NOT NULL CHECK (session IN ('MORNING', 'EVENING')),
                group_id BIGINT NOT NULL,
                litres NUMERIC(10, 2) NOT NULL CHECK (litres >= 0),
                fat NUMERIC(4, 2) CHECK (fat >= 0 AND fat <= 15),
                snf NUMERIC(4, 2) CHECK (snf >= 0 AND snf <= 15),
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_milk_session_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_milk_session UNIQUE (tenant_id, milk_date, session, group_id),
                CONSTRAINT fk_sf_milk_session_group FOREIGN KEY (tenant_id, group_id) REFERENCES sf_animal_groups (tenant_id, id)
              );

              CREATE TABLE sf_milk_yields (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                session_id BIGINT NOT NULL,
                animal_id BIGINT NOT NULL,
                litres NUMERIC(8, 2) NOT NULL CHECK (litres >= 0),
                CONSTRAINT uq_sf_milk_yield_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_milk_yield UNIQUE (tenant_id, session_id, animal_id),
                CONSTRAINT fk_sf_milk_yield_session FOREIGN KEY (tenant_id, session_id) REFERENCES sf_milk_sessions (tenant_id, id) ON DELETE CASCADE,
                CONSTRAINT fk_sf_milk_yield_animal FOREIGN KEY (tenant_id, animal_id) REFERENCES sf_animals (tenant_id, id)
              );

              CREATE TABLE sf_milk_postings (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                milk_date DATE NOT NULL,
                group_id BIGINT NOT NULL,
                document_id BIGINT NOT NULL,
                litres NUMERIC(10, 2) NOT NULL CHECK (litres > 0),
                CONSTRAINT uq_sf_milk_posting_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_milk_posting_doc UNIQUE (tenant_id, document_id),
                CONSTRAINT fk_sf_milk_posting_group FOREIGN KEY (tenant_id, group_id) REFERENCES sf_animal_groups (tenant_id, id),
                CONSTRAINT fk_sf_milk_posting_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id)
              );
              CREATE INDEX ix_sf_milk_posting_day ON sf_milk_postings (tenant_id, milk_date, group_id);

              -- Health and breeding events (I9, I10, I11); an event is for one animal or a whole group
              CREATE TABLE sf_animal_events (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                animal_id BIGINT,
                group_id BIGINT,
                kind VARCHAR(16) NOT NULL CHECK (kind IN ('TREATMENT', 'VACCINATION', 'DEWORMING', 'HEALTH_OTHER', 'HEAT', 'INSEMINATION',
                  'PREGNANCY_CHECK', 'CALVING', 'ABORTION', 'DRY_OFF', 'INSURANCE')),
                event_date DATE NOT NULL,
                description VARCHAR(300),
                result VARCHAR(10) CHECK (result IN ('POSITIVE', 'NEGATIVE', 'LIVE', 'STILLBORN')),
                service VARCHAR(8) CHECK (service IN ('AI', 'NATURAL')),
                bull VARCHAR(120),
                done_by VARCHAR(120),
                withdrawal_until DATE,
                next_due DATE,
                check_due_from DATE,
                expected_calving DATE,
                dry_off_due DATE,
                document_id BIGINT,
                stock_document_id BIGINT,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_animal_event_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_animal_event_animal FOREIGN KEY (tenant_id, animal_id) REFERENCES sf_animals (tenant_id, id),
                CONSTRAINT fk_sf_animal_event_group FOREIGN KEY (tenant_id, group_id) REFERENCES sf_animal_groups (tenant_id, id),
                CONSTRAINT fk_sf_animal_event_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT fk_sf_animal_event_stock_doc FOREIGN KEY (tenant_id, stock_document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT ck_sf_animal_event_target CHECK (animal_id IS NOT NULL OR group_id IS NOT NULL)
              );
              CREATE INDEX ix_sf_animal_event_animal ON sf_animal_events (tenant_id, animal_id, event_date);

              CREATE TABLE sf_lactations (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                animal_id BIGINT NOT NULL,
                number INT NOT NULL CHECK (number > 0),
                calving_date DATE NOT NULL,
                calving_event_id BIGINT,
                dry_off_date DATE,
                CONSTRAINT uq_sf_lactation_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_lactation_number UNIQUE (tenant_id, animal_id, number),
                CONSTRAINT fk_sf_lactation_animal FOREIGN KEY (tenant_id, animal_id) REFERENCES sf_animals (tenant_id, id),
                CONSTRAINT fk_sf_lactation_event FOREIGN KEY (tenant_id, calving_event_id) REFERENCES sf_animal_events (tenant_id, id),
                CONSTRAINT ck_sf_lactation_dates CHECK (dry_off_date IS NULL OR dry_off_date >= calving_date)
              );

              -- The tenant's Milk produce item, created when the module is first used (I6)
              CREATE TABLE sf_livestock_settings (
                tenant_id BIGINT PRIMARY KEY REFERENCES sf_tenants (id),
                milk_item_id BIGINT NOT NULL,
                CONSTRAINT fk_sf_livestock_milk_item FOREIGN KEY (tenant_id, milk_item_id) REFERENCES sf_stock_items (tenant_id, id)
              );
      rollback:
        - sql:
            sql: >
              DROP TABLE sf_livestock_settings; DROP TABLE sf_lactations; DROP TABLE sf_animal_events; DROP TABLE sf_milk_postings;
              DROP TABLE sf_milk_yields; DROP TABLE sf_milk_sessions; DROP TABLE sf_animal_group_moves; DROP TABLE sf_animals;
              DROP TABLE sf_animal_groups;
              ALTER TABLE sf_cost_objects DROP CONSTRAINT ck_sf_cost_object_kind;
              ALTER TABLE sf_cost_objects ADD CONSTRAINT sf_cost_objects_kind_check CHECK (kind IN ('OVERHEAD', 'CROP_CYCLE'));

  - changeSet:
      id: 044-livestock-seed
      author: smartfarm360
      comment: Permissions and role grants of section 10 (I16). The module stays off for existing farm businesses.
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO sf_permissions (code, description) VALUES
                ('LIVESTOCK_READ', 'View animals, milk, health and breeding records'),
                ('LIVESTOCK_WRITE', 'Record animals, milk, health and breeding events');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN ('LIVESTOCK_READ', 'LIVESTOCK_WRITE')
                WHERE r.tenant_id IS NULL AND r.code IN ('TENANT_OWNER', 'FARM_ADMIN', 'FARM_MANAGER', 'FIELD_SUPERVISOR', 'WORKER');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code = 'LIVESTOCK_READ'
                WHERE r.tenant_id IS NULL AND r.code IN ('ACCOUNTANT', 'VIEWER');
      rollback:
        - sql:
            sql: >
              DELETE FROM sf_tenant_modules WHERE module_code = 'DAIRY';
              DELETE FROM sf_role_permissions WHERE permission_code IN ('LIVESTOCK_READ', 'LIVESTOCK_WRITE');
              DELETE FROM sf_permissions WHERE code IN ('LIVESTOCK_READ', 'LIVESTOCK_WRITE');
