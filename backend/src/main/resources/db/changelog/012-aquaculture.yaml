databaseChangeLog:
  # Phase 10 aquaculture. See docs/aquaculture/aquaculture.md (approved 2026-10-21). Forward-only.
  - changeSet:
      id: 047-aquaculture-schema
      author: smartfarm360
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- Culture cycles are cost objects (K2)
              ALTER TABLE sf_cost_objects DROP CONSTRAINT ck_sf_cost_object_kind;
              ALTER TABLE sf_cost_objects ADD CONSTRAINT ck_sf_cost_object_kind CHECK (kind IN ('OVERHEAD', 'CROP_CYCLE', 'ANIMAL_GROUP', 'POND_CYCLE'));

              -- Ponds (K1): records under a farm, not cost objects
              CREATE TABLE sf_ponds (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                farm_id BIGINT NOT NULL,
                parcel_id BIGINT,
                name VARCHAR(120) NOT NULL,
                kind VARCHAR(10) NOT NULL CHECK (kind IN ('EARTHEN', 'LINED', 'TANK', 'CAGE')),
                water_area NUMERIC(12, 4) NOT NULL CHECK (water_area > 0),
                area_unit VARCHAR(10) NOT NULL CHECK (area_unit IN ('ACRE', 'HECTARE', 'CENT', 'SQFT')),
                area_acres NUMERIC(14, 4) NOT NULL CHECK (area_acres > 0),
                depth_m NUMERIC(6, 2) CHECK (depth_m > 0),
                active BOOLEAN NOT NULL DEFAULT TRUE,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_pond_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_pond_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT fk_sf_pond_parcel FOREIGN KEY (tenant_id, parcel_id) REFERENCES sf_land_parcels (tenant_id, id)
              );
              CREATE UNIQUE INDEX uq_sf_pond_name ON sf_ponds (tenant_id, lower(name));

              CREATE TABLE sf_pond_cycles (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                pond_id BIGINT NOT NULL,
                cost_object_id BIGINT NOT NULL,
                started_on DATE NOT NULL,
                planned_harvest DATE,
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_pond_cycle_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_pond_cycle_cost_object UNIQUE (tenant_id, cost_object_id),
                CONSTRAINT fk_sf_pond_cycle_pond FOREIGN KEY (tenant_id, pond_id) REFERENCES sf_ponds (tenant_id, id),
                CONSTRAINT fk_sf_pond_cycle_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id)
              );
              CREATE INDEX ix_sf_pond_cycle_pond ON sf_pond_cycles (tenant_id, pond_id);

              -- Stocking (K3, K4, K11): species, number and kg, with the seed bill
              CREATE TABLE sf_pond_stockings (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                cycle_id BIGINT NOT NULL,
                stocked_on DATE NOT NULL,
                species VARCHAR(16) NOT NULL,
                other_name VARCHAR(60),
                fish_count INT NOT NULL CHECK (fish_count > 0),
                kg NUMERIC(12, 3) NOT NULL CHECK (kg > 0),
                hatchery VARCHAR(120),
                document_id BIGINT,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_pond_stocking_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_pond_stocking_cycle FOREIGN KEY (tenant_id, cycle_id) REFERENCES sf_pond_cycles (tenant_id, id),
                CONSTRAINT fk_sf_pond_stocking_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT ck_sf_pond_stocking_species CHECK (species IN ('ROHU', 'CATLA', 'MRIGAL', 'COMMON_CARP', 'GRASS_CARP', 'SILVER_CARP', 'TILAPIA',
                  'PANGASIUS', 'MURREL', 'VANNAMEI', 'TIGER_SHRIMP', 'SCAMPI', 'OTHER')),
                CONSTRAINT ck_sf_pond_stocking_other CHECK ((species = 'OTHER') = (other_name IS NOT NULL))
              );

              -- The daily pond record (K5): feed lines as one stock use, deaths seen
              CREATE TABLE sf_pond_days (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                cycle_id BIGINT NOT NULL,
                day DATE NOT NULL,
                notes VARCHAR(300),
                feed_document_id BIGINT,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_pond_day_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_pond_day UNIQUE (tenant_id, cycle_id, day),
                CONSTRAINT fk_sf_pond_day_cycle FOREIGN KEY (tenant_id, cycle_id) REFERENCES sf_pond_cycles (tenant_id, id),
                CONSTRAINT fk_sf_pond_day_feed_doc FOREIGN KEY (tenant_id, feed_document_id) REFERENCES sf_finance_documents (tenant_id, id)
              );
              CREATE TABLE sf_pond_day_feeds (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                day_id BIGINT NOT NULL,
                item_id BIGINT NOT NULL,
                kg NUMERIC(12, 3) NOT NULL CHECK (kg > 0),
                CONSTRAINT uq_sf_pond_day_feed_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_pond_day_feed_day FOREIGN KEY (tenant_id, day_id) REFERENCES sf_pond_days (tenant_id, id) ON DELETE CASCADE,
                CONSTRAINT fk_sf_pond_day_feed_item FOREIGN KEY (tenant_id, item_id) REFERENCES sf_stock_items (tenant_id, id)
              );
              CREATE TABLE sf_pond_deaths (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                day_id BIGINT NOT NULL,
                species VARCHAR(16) NOT NULL,
                other_name VARCHAR(60),
                fish_count INT NOT NULL CHECK (fish_count > 0),
                cause VARCHAR(120),
                CONSTRAINT uq_sf_pond_death_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_pond_death_day FOREIGN KEY (tenant_id, day_id) REFERENCES sf_pond_days (tenant_id, id) ON DELETE CASCADE
              );

              -- Weight samples (K6); no species means a mixed sample
              CREATE TABLE sf_pond_samples (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                cycle_id BIGINT NOT NULL,
                sampled_on DATE NOT NULL,
                species VARCHAR(16),
                other_name VARCHAR(60),
                fish_weighed INT NOT NULL CHECK (fish_weighed > 0),
                kg NUMERIC(10, 3) NOT NULL CHECK (kg > 0),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_pond_sample_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_pond_sample_cycle FOREIGN KEY (tenant_id, cycle_id) REFERENCES sf_pond_cycles (tenant_id, id)
              );

              -- Water quality (K7): readings per pond and the farmer's own limits
              CREATE TABLE sf_water_readings (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                pond_id BIGINT NOT NULL,
                taken_at TIMESTAMP WITH TIME ZONE NOT NULL,
                dissolved_oxygen NUMERIC(6, 2) CHECK (dissolved_oxygen >= 0),
                ph NUMERIC(4, 2) CHECK (ph BETWEEN 0 AND 14),
                temperature NUMERIC(5, 2),
                ammonia NUMERIC(7, 3) CHECK (ammonia >= 0),
                transparency NUMERIC(6, 1) CHECK (transparency >= 0),
                salinity NUMERIC(6, 2) CHECK (salinity >= 0),
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_water_reading_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_water_reading_pond FOREIGN KEY (tenant_id, pond_id) REFERENCES sf_ponds (tenant_id, id)
              );
              CREATE INDEX ix_sf_water_reading_pond ON sf_water_readings (tenant_id, pond_id, taken_at);
              CREATE TABLE sf_water_limits (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                pond_id BIGINT,
                parameter VARCHAR(16) NOT NULL CHECK (parameter IN ('DISSOLVED_OXYGEN', 'PH', 'TEMPERATURE', 'AMMONIA', 'TRANSPARENCY', 'SALINITY')),
                lowest NUMERIC(8, 3),
                highest NUMERIC(8, 3),
                CONSTRAINT uq_sf_water_limit_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_water_limit_pond FOREIGN KEY (tenant_id, pond_id) REFERENCES sf_ponds (tenant_id, id),
                CONSTRAINT ck_sf_water_limit_range CHECK (lowest IS NOT NULL OR highest IS NOT NULL),
                CONSTRAINT ck_sf_water_limit_order CHECK (lowest IS NULL OR highest IS NULL OR lowest <= highest)
              );
              CREATE UNIQUE INDEX uq_sf_water_limit ON sf_water_limits (tenant_id, coalesce(pond_id, 0), parameter);

              -- Harvests (K8): partial or final, by species and grade, sold at the pond bank
              CREATE TABLE sf_pond_harvests (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                cycle_id BIGINT NOT NULL,
                harvested_on DATE NOT NULL,
                kind VARCHAR(8) NOT NULL CHECK (kind IN ('PARTIAL', 'FINAL')),
                sale_document_id BIGINT,
                charges_document_id BIGINT,
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_pond_harvest_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_pond_harvest_cycle FOREIGN KEY (tenant_id, cycle_id) REFERENCES sf_pond_cycles (tenant_id, id),
                CONSTRAINT fk_sf_pond_harvest_sale FOREIGN KEY (tenant_id, sale_document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT fk_sf_pond_harvest_charges FOREIGN KEY (tenant_id, charges_document_id) REFERENCES sf_finance_documents (tenant_id, id)
              );
              CREATE TABLE sf_pond_harvest_lines (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                harvest_id BIGINT NOT NULL,
                species VARCHAR(16) NOT NULL,
                other_name VARCHAR(60),
                grade VARCHAR(60),
                kg NUMERIC(12, 3) NOT NULL CHECK (kg > 0),
                fish_count INT CHECK (fish_count > 0),
                use VARCHAR(6) NOT NULL CHECK (use IN ('SOLD', 'HOME', 'GIVEN')),
                rate NUMERIC(12, 2) CHECK (rate > 0),
                amount NUMERIC(14, 2) CHECK (amount > 0),
                CONSTRAINT uq_sf_pond_harvest_line_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_pond_harvest_line_harvest FOREIGN KEY (tenant_id, harvest_id) REFERENCES sf_pond_harvests (tenant_id, id) ON DELETE CASCADE,
                CONSTRAINT ck_sf_pond_harvest_line_sold CHECK ((use = 'SOLD') = (rate IS NOT NULL AND amount IS NOT NULL))
              );
      rollback:
        - sql:
            sql: >
              DROP TABLE sf_pond_harvest_lines; DROP TABLE sf_pond_harvests; DROP TABLE sf_water_limits; DROP TABLE sf_water_readings;
              DROP TABLE sf_pond_samples; DROP TABLE sf_pond_deaths; DROP TABLE sf_pond_day_feeds; DROP TABLE sf_pond_days;
              DROP TABLE sf_pond_stockings; DROP TABLE sf_pond_cycles; DROP TABLE sf_ponds;
              ALTER TABLE sf_cost_objects DROP CONSTRAINT ck_sf_cost_object_kind;
              ALTER TABLE sf_cost_objects ADD CONSTRAINT ck_sf_cost_object_kind CHECK (kind IN ('OVERHEAD', 'CROP_CYCLE', 'ANIMAL_GROUP'));

  - changeSet:
      id: 048-aquaculture-seed
      author: smartfarm360
      comment: The Fish and shrimp seed category (K4) and the aquaculture permissions (K12). The module stays off.
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO sf_finance_categories (code, default_name, kind, account_code) VALUES ('FISH_SEED', 'Fish and shrimp seed', 'EXPENSE', '5000');
              INSERT INTO sf_permissions (code, description) VALUES
                ('AQUACULTURE_READ', 'View ponds, culture cycles, water quality and harvests'),
                ('AQUACULTURE_WRITE', 'Record ponds, stocking, feed, samples, water readings and harvests');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN ('AQUACULTURE_READ', 'AQUACULTURE_WRITE')
                WHERE r.tenant_id IS NULL AND r.code IN ('TENANT_OWNER', 'FARM_ADMIN', 'FARM_MANAGER', 'FIELD_SUPERVISOR', 'WORKER');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code = 'AQUACULTURE_READ'
                WHERE r.tenant_id IS NULL AND r.code IN ('ACCOUNTANT', 'VIEWER');
      rollback:
        - sql:
            sql: >
              DELETE FROM sf_tenant_modules WHERE module_code = 'AQUACULTURE';
              DELETE FROM sf_role_permissions WHERE permission_code IN ('AQUACULTURE_READ', 'AQUACULTURE_WRITE');
              DELETE FROM sf_permissions WHERE code IN ('AQUACULTURE_READ', 'AQUACULTURE_WRITE');
              DELETE FROM sf_finance_categories WHERE code = 'FISH_SEED' AND tenant_id IS NULL;
