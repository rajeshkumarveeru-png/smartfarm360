databaseChangeLog:
  # Phase 11 organic resources and internal transfers. See docs/organic/organic-resources.md (approved 2026-10-21). Forward-only.
  - changeSet:
      id: 049-organic-schema
      author: smartfarm360
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- Organic batches are cost objects (L1)
              ALTER TABLE sf_cost_objects DROP CONSTRAINT ck_sf_cost_object_kind;
              ALTER TABLE sf_cost_objects ADD CONSTRAINT ck_sf_cost_object_kind CHECK (kind IN ('OVERHEAD', 'CROP_CYCLE', 'ANIMAL_GROUP', 'POND_CYCLE', 'ORGANIC_BATCH'));

              -- Internal transfers (L4, P17): a stock record that may move cost on its own account
              ALTER TABLE sf_finance_documents DROP CONSTRAINT ck_sf_doc_type;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT ck_sf_doc_type CHECK (doc_type IN ('BILL', 'SALE', 'PAYMENT', 'RECEIPT',
                'TRANSFER', 'OWNER_IN', 'OWNER_OUT', 'LOAN_RECEIVED', 'LOAN_REPAYMENT', 'SETTLEMENT', 'WRITE_OFF', 'OPENING_BALANCE',
                'DEPRECIATION', 'STOCK_ISSUE', 'STOCK_TRANSFER', 'WASTAGE', 'STOCK_COUNT', 'PRODUCE_RECEIPT', 'PURCHASE_RETURN', 'SALE_RETURN',
                'ALLOCATION', 'ADVANCE', 'ADVANCE_REPAYMENT', 'PAY_RUN', 'WAGE_PAYMENT', 'ASSET_DISPOSAL', 'INTERNAL_TRANSFER'));
              -- A transfer at nil value has a zero total, like other stock records
              ALTER TABLE sf_finance_documents DROP CONSTRAINT ck_sf_doc_total;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT ck_sf_doc_total CHECK (total_amount > 0
                OR (total_amount = 0 AND doc_type IN ('BILL', 'SALE', 'OPENING_BALANCE', 'STOCK_ISSUE', 'STOCK_TRANSFER', 'WASTAGE',
                    'STOCK_COUNT', 'PRODUCE_RECEIPT', 'PURCHASE_RETURN', 'SALE_RETURN', 'INTERNAL_TRANSFER')));
              INSERT INTO sf_ledger_accounts (code, account_type, normal_side, name) VALUES ('5650', 'EXPENSE', 'DEBIT', 'Own farm inputs');

              CREATE TABLE sf_internal_transfers (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                document_id BIGINT NOT NULL,
                item_id BIGINT NOT NULL,
                base_quantity NUMERIC(18, 4) NOT NULL CHECK (base_quantity > 0),
                source_cost_object_id BIGINT,
                target_cost_object_id BIGINT NOT NULL,
                cost_method VARCHAR(12) NOT NULL CHECK (cost_method IN ('NIL', 'AVERAGE_COST')),
                unit_cost NUMERIC(18, 6),
                cost_moved NUMERIC(14, 2) NOT NULL DEFAULT 0 CHECK (cost_moved >= 0),
                CONSTRAINT uq_sf_internal_transfer_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_internal_transfer_doc UNIQUE (tenant_id, document_id),
                CONSTRAINT fk_sf_internal_transfer_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT fk_sf_internal_transfer_item FOREIGN KEY (tenant_id, item_id) REFERENCES sf_stock_items (tenant_id, id),
                CONSTRAINT fk_sf_internal_transfer_source FOREIGN KEY (tenant_id, source_cost_object_id) REFERENCES sf_cost_objects (tenant_id, id),
                CONSTRAINT fk_sf_internal_transfer_target FOREIGN KEY (tenant_id, target_cost_object_id) REFERENCES sf_cost_objects (tenant_id, id),
                CONSTRAINT ck_sf_internal_transfer_ends CHECK (source_cost_object_id IS NULL OR source_cost_object_id <> target_cost_object_id),
                CONSTRAINT ck_sf_internal_transfer_cost CHECK (cost_method = 'NIL' AND cost_moved = 0 OR cost_method = 'AVERAGE_COST' AND source_cost_object_id IS NOT NULL)
              );
              CREATE INDEX ix_sf_internal_transfer_source ON sf_internal_transfers (tenant_id, source_cost_object_id, item_id);

              -- Organic batches (L1) and their log (L6)
              CREATE TABLE sf_organic_batches (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                cost_object_id BIGINT NOT NULL,
                kind VARCHAR(14) NOT NULL CHECK (kind IN ('COMPOST', 'VERMICOMPOST', 'LIQUID', 'OTHER')),
                farm_id BIGINT NOT NULL,
                started_on DATE NOT NULL,
                ready_by DATE,
                finished_on DATE,
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_organic_batch_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_organic_batch_cost_object UNIQUE (tenant_id, cost_object_id),
                CONSTRAINT fk_sf_organic_batch_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id),
                CONSTRAINT fk_sf_organic_batch_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT ck_sf_organic_batch_dates CHECK ((ready_by IS NULL OR ready_by >= started_on) AND (finished_on IS NULL OR finished_on >= started_on))
              );
              CREATE TABLE sf_organic_logs (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                batch_id BIGINT NOT NULL,
                log_date DATE NOT NULL,
                kind VARCHAR(8) NOT NULL CHECK (kind IN ('TURNED', 'WATERED', 'ADDED', 'CHECKED', 'WORMS', 'OTHER')),
                kg NUMERIC(12, 3) CHECK (kg > 0),
                temperature NUMERIC(5, 1),
                moisture VARCHAR(6) CHECK (moisture IN ('DRY', 'RIGHT', 'WET')),
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_organic_log_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_organic_log_batch FOREIGN KEY (tenant_id, batch_id) REFERENCES sf_organic_batches (tenant_id, id)
              );
              CREATE INDEX ix_sf_organic_log_batch ON sf_organic_logs (tenant_id, batch_id, log_date);
      rollback:
        - sql:
            sql: >
              DROP TABLE sf_organic_logs; DROP TABLE sf_organic_batches; DROP TABLE sf_internal_transfers;
              DELETE FROM sf_ledger_accounts WHERE code = '5650';
              ALTER TABLE sf_finance_documents DROP CONSTRAINT ck_sf_doc_total;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT ck_sf_doc_total CHECK (total_amount > 0
                OR (total_amount = 0 AND doc_type IN ('BILL', 'SALE', 'OPENING_BALANCE', 'STOCK_ISSUE', 'STOCK_TRANSFER', 'WASTAGE',
                    'STOCK_COUNT', 'PRODUCE_RECEIPT', 'PURCHASE_RETURN', 'SALE_RETURN')));
              ALTER TABLE sf_finance_documents DROP CONSTRAINT ck_sf_doc_type;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT ck_sf_doc_type CHECK (doc_type IN ('BILL', 'SALE', 'PAYMENT', 'RECEIPT',
                'TRANSFER', 'OWNER_IN', 'OWNER_OUT', 'LOAN_RECEIVED', 'LOAN_REPAYMENT', 'SETTLEMENT', 'WRITE_OFF', 'OPENING_BALANCE',
                'DEPRECIATION', 'STOCK_ISSUE', 'STOCK_TRANSFER', 'WASTAGE', 'STOCK_COUNT', 'PRODUCE_RECEIPT', 'PURCHASE_RETURN', 'SALE_RETURN',
                'ALLOCATION', 'ADVANCE', 'ADVANCE_REPAYMENT', 'PAY_RUN', 'WAGE_PAYMENT', 'ASSET_DISPOSAL'));
              ALTER TABLE sf_cost_objects DROP CONSTRAINT ck_sf_cost_object_kind;
              ALTER TABLE sf_cost_objects ADD CONSTRAINT ck_sf_cost_object_kind CHECK (kind IN ('OVERHEAD', 'CROP_CYCLE', 'ANIMAL_GROUP', 'POND_CYCLE'));

  - changeSet:
      id: 050-organic-seed
      author: smartfarm360
      comment: The organic permissions and their role grants (L11). The module stays off.
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO sf_permissions (code, description) VALUES
                ('ORGANIC_READ', 'View compost and organic manure batches'),
                ('ORGANIC_WRITE', 'Record compost and organic manure batches, their log and output');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN ('ORGANIC_READ', 'ORGANIC_WRITE')
                WHERE r.tenant_id IS NULL AND r.code IN ('TENANT_OWNER', 'FARM_ADMIN', 'FARM_MANAGER', 'FIELD_SUPERVISOR', 'WORKER');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code = 'ORGANIC_READ'
                WHERE r.tenant_id IS NULL AND r.code IN ('ACCOUNTANT', 'VIEWER');
      rollback:
        - sql:
            sql: >
              DELETE FROM sf_tenant_modules WHERE module_code = 'ORGANIC';
              DELETE FROM sf_role_permissions WHERE permission_code IN ('ORGANIC_READ', 'ORGANIC_WRITE');
              DELETE FROM sf_permissions WHERE code IN ('ORGANIC_READ', 'ORGANIC_WRITE');
