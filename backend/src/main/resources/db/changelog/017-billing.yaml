databaseChangeLog:
  # Phase 15 billing and payments. See docs/platform/billing.md (approved 2026-10-27). Forward-only.
  - changeSet:
      id: 058-billing-schema
      author: smartfarm360
      comment: >-
        Paid plans and prices, subscriptions and their events, billing details, gateway events, payments, GST invoices,
        credit notes and their gapless counters (P1–P15). Payments, invoices and credit notes are the platform's own
        records of what it sold: they carry customer_tenant_id without a foreign key, so they are kept 8 years after a
        farm business is deleted (P6, ADR 0013), and they get their own Row-Level Security policy.
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE sf_plans ADD COLUMN paid BOOLEAN NOT NULL DEFAULT FALSE;
              ALTER TABLE sf_plans ADD COLUMN sort_order INT NOT NULL DEFAULT 0;

              CREATE TABLE sf_plan_prices (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                plan_code VARCHAR(30) NOT NULL REFERENCES sf_plans (code),
                period VARCHAR(10) NOT NULL CHECK (period IN ('MONTHLY', 'YEARLY')),
                amount NUMERIC(14, 2) NOT NULL CHECK (amount > 0),
                valid_from DATE NOT NULL,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_plan_price UNIQUE (plan_code, period, valid_from)
              );

              CREATE TABLE sf_tax_rates (
                code VARCHAR(20) NOT NULL,
                component VARCHAR(10) NOT NULL CHECK (component IN ('CGST', 'SGST', 'IGST')),
                rate NUMERIC(5, 2) NOT NULL CHECK (rate >= 0 AND rate < 100),
                valid_from DATE NOT NULL,
                PRIMARY KEY (code, component, valid_from)
              );

              CREATE TABLE sf_subscriptions (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                plan_code VARCHAR(30) NOT NULL REFERENCES sf_plans (code),
                period VARCHAR(10) CHECK (period IN ('MONTHLY', 'YEARLY')),
                state VARCHAR(10) NOT NULL CHECK (state IN ('TRIAL', 'ACTIVE', 'PAST_DUE', 'LAPSED', 'CANCELLED', 'ENDED')),
                fallback_plan_code VARCHAR(30) NOT NULL REFERENCES sf_plans (code),
                trial_ends_at TIMESTAMP WITH TIME ZONE,
                trial_reminder_7_at TIMESTAMP WITH TIME ZONE,
                trial_reminder_1_at TIMESTAMP WITH TIME ZONE,
                current_period_start TIMESTAMP WITH TIME ZONE,
                paid_until TIMESTAMP WITH TIME ZONE,
                grace_ends_at TIMESTAMP WITH TIME ZONE,
                grace_reminder_at TIMESTAMP WITH TIME ZONE,
                gateway VARCHAR(20),
                gateway_subscription_id VARCHAR(80),
                gateway_amount NUMERIC(14, 2),
                checkout_gateway_subscription_id VARCHAR(80),
                checkout_plan_code VARCHAR(30) REFERENCES sf_plans (code),
                checkout_period VARCHAR(10) CHECK (checkout_period IN ('MONTHLY', 'YEARLY')),
                checkout_started_at TIMESTAMP WITH TIME ZONE,
                pending_plan_code VARCHAR(30) REFERENCES sf_plans (code),
                pending_period VARCHAR(10) CHECK (pending_period IN ('MONTHLY', 'YEARLY')),
                upgrade_reference VARCHAR(80),
                upgrade_plan_code VARCHAR(30) REFERENCES sf_plans (code),
                upgrade_amount NUMERIC(14, 2),
                comp_plan_code VARCHAR(30) REFERENCES sf_plans (code),
                comp_until TIMESTAMP WITH TIME ZONE,
                comp_reason VARCHAR(300),
                last_event_at TIMESTAMP WITH TIME ZONE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_subscription_tenant_only UNIQUE (tenant_id),
                CONSTRAINT uq_sf_subscription_tenant UNIQUE (tenant_id, id),
                CONSTRAINT ck_sf_subscription_comp CHECK ((comp_plan_code IS NULL) = (comp_until IS NULL))
              );
              CREATE UNIQUE INDEX ux_sf_subscription_gateway ON sf_subscriptions (gateway, gateway_subscription_id) WHERE gateway_subscription_id IS NOT NULL;
              CREATE UNIQUE INDEX ux_sf_subscription_checkout ON sf_subscriptions (gateway, checkout_gateway_subscription_id) WHERE checkout_gateway_subscription_id IS NOT NULL;
              CREATE UNIQUE INDEX ux_sf_subscription_upgrade ON sf_subscriptions (upgrade_reference) WHERE upgrade_reference IS NOT NULL;

              CREATE TABLE sf_subscription_events (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL,
                subscription_id BIGINT NOT NULL,
                from_state VARCHAR(10),
                to_state VARCHAR(10) NOT NULL,
                plan_code VARCHAR(30) NOT NULL,
                reason VARCHAR(300),
                actor_user_id BIGINT REFERENCES sf_users (id),
                gateway_event_id VARCHAR(80),
                occurred_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_subscription_event_tenant UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_subscription_event_subscription FOREIGN KEY (tenant_id, subscription_id) REFERENCES sf_subscriptions (tenant_id, id)
              );
              CREATE INDEX ix_sf_subscription_event ON sf_subscription_events (tenant_id, subscription_id, occurred_at);

              CREATE TABLE sf_billing_profiles (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                legal_name VARCHAR(140) NOT NULL,
                address_line1 VARCHAR(200) NOT NULL,
                address_line2 VARCHAR(200),
                city VARCHAR(80) NOT NULL,
                pincode VARCHAR(6) NOT NULL CHECK (pincode ~ '^[1-9][0-9]{5}$'),
                state_code VARCHAR(2) NOT NULL CHECK (state_code ~ '^[0-9]{2}$'),
                gstin VARCHAR(15),
                email VARCHAR(254) NOT NULL,
                updated_by BIGINT NOT NULL REFERENCES sf_users (id),
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_billing_profile_tenant_only UNIQUE (tenant_id),
                CONSTRAINT uq_sf_billing_profile_tenant UNIQUE (tenant_id, id),
                CONSTRAINT ck_sf_billing_profile_gstin CHECK (gstin IS NULL OR substr(gstin, 1, 2) = state_code)
              );

              -- One trial per user, kept when the farm business is deleted (P3)
              CREATE TABLE sf_trials_used (
                user_id BIGINT PRIMARY KEY REFERENCES sf_users (id),
                first_tenant_id BIGINT NOT NULL,
                used_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
              );

              -- The gateway's plan for each charged amount, created when first needed
              CREATE TABLE sf_gateway_plans (
                gateway VARCHAR(20) NOT NULL,
                plan_code VARCHAR(30) NOT NULL REFERENCES sf_plans (code),
                period VARCHAR(10) NOT NULL CHECK (period IN ('MONTHLY', 'YEARLY')),
                amount NUMERIC(14, 2) NOT NULL,
                gateway_plan_id VARCHAR(80) NOT NULL,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                PRIMARY KEY (gateway, plan_code, period, amount)
              );

              -- Every webhook delivery, stored once by its event id (P4)
              CREATE TABLE sf_gateway_events (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                gateway VARCHAR(20) NOT NULL,
                event_id VARCHAR(80) NOT NULL,
                event_type VARCHAR(60) NOT NULL,
                customer_tenant_id BIGINT,
                payload JSONB NOT NULL,
                received_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                processed_at TIMESTAMP WITH TIME ZONE,
                outcome VARCHAR(20) NOT NULL CHECK (outcome IN ('APPLIED', 'IGNORED', 'UNMATCHED', 'FAILED')),
                error VARCHAR(300),
                CONSTRAINT uq_sf_gateway_event UNIQUE (gateway, event_id)
              );
              CREATE INDEX ix_sf_gateway_event_outcome ON sf_gateway_events (outcome, received_at DESC);

              CREATE TABLE sf_payments (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                customer_tenant_id BIGINT NOT NULL,
                gateway VARCHAR(20) NOT NULL,
                gateway_payment_id VARCHAR(80) NOT NULL,
                gateway_subscription_id VARCHAR(80),
                kind VARCHAR(10) NOT NULL CHECK (kind IN ('RENEWAL', 'UPGRADE')),
                amount NUMERIC(14, 2) NOT NULL CHECK (amount > 0),
                refunded_amount NUMERIC(14, 2) NOT NULL DEFAULT 0 CHECK (refunded_amount >= 0 AND refunded_amount <= amount),
                method VARCHAR(30),
                captured_at TIMESTAMP WITH TIME ZONE NOT NULL,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_payment_gateway UNIQUE (gateway, gateway_payment_id)
              );
              CREATE INDEX ix_sf_payment_customer ON sf_payments (customer_tenant_id, captured_at DESC);

              -- Gapless numbers per series and financial year (P6): taken in the same transaction as the document
              CREATE TABLE sf_document_counters (
                series VARCHAR(10) NOT NULL,
                financial_year VARCHAR(7) NOT NULL,
                next_number BIGINT NOT NULL CHECK (next_number > 0),
                PRIMARY KEY (series, financial_year)
              );

              CREATE TABLE sf_invoices (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                customer_tenant_id BIGINT NOT NULL,
                number VARCHAR(30) NOT NULL UNIQUE,
                financial_year VARCHAR(7) NOT NULL,
                invoice_date DATE NOT NULL,
                issued_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                payment_id BIGINT NOT NULL UNIQUE REFERENCES sf_payments (id),
                seller_name VARCHAR(140) NOT NULL,
                seller_gstin VARCHAR(15) NOT NULL,
                seller_address VARCHAR(400) NOT NULL,
                seller_state_code VARCHAR(2) NOT NULL,
                buyer_name VARCHAR(140) NOT NULL,
                buyer_address VARCHAR(500) NOT NULL,
                buyer_state_code VARCHAR(2) NOT NULL,
                buyer_gstin VARCHAR(15),
                buyer_email VARCHAR(254) NOT NULL,
                business_name VARCHAR(140) NOT NULL,
                sac VARCHAR(8) NOT NULL,
                taxable_amount NUMERIC(14, 2) NOT NULL CHECK (taxable_amount >= 0),
                cgst NUMERIC(14, 2) NOT NULL DEFAULT 0,
                sgst NUMERIC(14, 2) NOT NULL DEFAULT 0,
                igst NUMERIC(14, 2) NOT NULL DEFAULT 0,
                total NUMERIC(14, 2) NOT NULL CHECK (total > 0),
                cgst_rate NUMERIC(5, 2) NOT NULL DEFAULT 0,
                sgst_rate NUMERIC(5, 2) NOT NULL DEFAULT 0,
                igst_rate NUMERIC(5, 2) NOT NULL DEFAULT 0,
                irn VARCHAR(64),
                irn_qr TEXT,
                booked_document_id BIGINT,
                booked_at TIMESTAMP WITH TIME ZONE,
                CONSTRAINT ck_sf_invoice_total CHECK (total = taxable_amount + cgst + sgst + igst)
              );
              CREATE INDEX ix_sf_invoice_customer ON sf_invoices (customer_tenant_id, issued_at DESC);

              CREATE TABLE sf_invoice_lines (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                customer_tenant_id BIGINT NOT NULL,
                invoice_id BIGINT NOT NULL REFERENCES sf_invoices (id),
                line_no INT NOT NULL,
                description VARCHAR(240) NOT NULL,
                plan_code VARCHAR(30) NOT NULL,
                period VARCHAR(10) NOT NULL,
                period_start DATE NOT NULL,
                period_end DATE NOT NULL,
                taxable_amount NUMERIC(14, 2) NOT NULL,
                CONSTRAINT uq_sf_invoice_line UNIQUE (invoice_id, line_no)
              );

              CREATE TABLE sf_credit_notes (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                customer_tenant_id BIGINT NOT NULL,
                number VARCHAR(30) NOT NULL UNIQUE,
                financial_year VARCHAR(7) NOT NULL,
                note_date DATE NOT NULL,
                issued_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                invoice_id BIGINT NOT NULL REFERENCES sf_invoices (id),
                reason VARCHAR(300) NOT NULL,
                taxable_amount NUMERIC(14, 2) NOT NULL CHECK (taxable_amount >= 0),
                cgst NUMERIC(14, 2) NOT NULL DEFAULT 0,
                sgst NUMERIC(14, 2) NOT NULL DEFAULT 0,
                igst NUMERIC(14, 2) NOT NULL DEFAULT 0,
                total NUMERIC(14, 2) NOT NULL CHECK (total > 0),
                gateway_refund_id VARCHAR(80),
                issued_by BIGINT REFERENCES sf_users (id),
                CONSTRAINT ck_sf_credit_note_total CHECK (total = taxable_amount + cgst + sgst + igst)
              );
              CREATE INDEX ix_sf_credit_note_invoice ON sf_credit_notes (invoice_id);
        - sql:
            splitStatements: false
            sql: |
              -- Issued invoices and credit notes are never changed, except recording that the owner booked an invoice
              CREATE FUNCTION sf_billing_document_immutable() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                IF TG_OP = 'UPDATE' AND TG_TABLE_NAME = 'sf_invoices'
                   AND (to_jsonb(NEW) - 'booked_document_id' - 'booked_at') = (to_jsonb(OLD) - 'booked_document_id' - 'booked_at') THEN
                  RETURN NEW;
                END IF;
                RAISE EXCEPTION 'issued billing documents are immutable (% on %); issue a credit note instead', TG_OP, TG_TABLE_NAME;
              END;
              $$
        - sql:
            splitStatements: true
            sql: |
              CREATE TRIGGER trg_sf_invoices_immutable BEFORE UPDATE OR DELETE ON sf_invoices FOR EACH ROW EXECUTE FUNCTION sf_billing_document_immutable();
              CREATE TRIGGER trg_sf_invoice_lines_immutable BEFORE UPDATE OR DELETE ON sf_invoice_lines FOR EACH ROW EXECUTE FUNCTION sf_billing_document_immutable();
              CREATE TRIGGER trg_sf_credit_notes_immutable BEFORE UPDATE OR DELETE ON sf_credit_notes FOR EACH ROW EXECUTE FUNCTION sf_billing_document_immutable();

              CREATE TABLE sf_billing_reconciliations (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                ran_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                window_from TIMESTAMP WITH TIME ZONE NOT NULL,
                window_to TIMESTAMP WITH TIME ZONE NOT NULL,
                ok BOOLEAN NOT NULL,
                differences JSONB NOT NULL DEFAULT '[]'::jsonb,
                error VARCHAR(300)
              );

              -- Tenant-owned billing tables get the standard policy (ADR 0011)
              ALTER TABLE sf_subscriptions ENABLE ROW LEVEL SECURITY;
              ALTER TABLE sf_subscriptions FORCE ROW LEVEL SECURITY;
              CREATE POLICY sf_tenant_isolation ON sf_subscriptions
                USING ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()))
                WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()));
              ALTER TABLE sf_subscription_events ENABLE ROW LEVEL SECURITY;
              ALTER TABLE sf_subscription_events FORCE ROW LEVEL SECURITY;
              CREATE POLICY sf_tenant_isolation ON sf_subscription_events
                USING ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()))
                WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()));
              ALTER TABLE sf_billing_profiles ENABLE ROW LEVEL SECURITY;
              ALTER TABLE sf_billing_profiles FORCE ROW LEVEL SECURITY;
              CREATE POLICY sf_tenant_isolation ON sf_billing_profiles
                USING ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()))
                WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()));

              -- The platform's billing documents: a farm business's request sees only its own (ADR 0011, amended)
              ALTER TABLE sf_payments ENABLE ROW LEVEL SECURITY;
              ALTER TABLE sf_payments FORCE ROW LEVEL SECURITY;
              CREATE POLICY sf_customer_isolation ON sf_payments
                USING ((SELECT sf_rls_tenant()) IS NULL OR customer_tenant_id = (SELECT sf_rls_tenant()))
                WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR customer_tenant_id = (SELECT sf_rls_tenant()));
              ALTER TABLE sf_invoices ENABLE ROW LEVEL SECURITY;
              ALTER TABLE sf_invoices FORCE ROW LEVEL SECURITY;
              CREATE POLICY sf_customer_isolation ON sf_invoices
                USING ((SELECT sf_rls_tenant()) IS NULL OR customer_tenant_id = (SELECT sf_rls_tenant()))
                WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR customer_tenant_id = (SELECT sf_rls_tenant()));
              ALTER TABLE sf_invoice_lines ENABLE ROW LEVEL SECURITY;
              ALTER TABLE sf_invoice_lines FORCE ROW LEVEL SECURITY;
              CREATE POLICY sf_customer_isolation ON sf_invoice_lines
                USING ((SELECT sf_rls_tenant()) IS NULL OR customer_tenant_id = (SELECT sf_rls_tenant()))
                WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR customer_tenant_id = (SELECT sf_rls_tenant()));
              ALTER TABLE sf_credit_notes ENABLE ROW LEVEL SECURITY;
              ALTER TABLE sf_credit_notes FORCE ROW LEVEL SECURITY;
              CREATE POLICY sf_customer_isolation ON sf_credit_notes
                USING ((SELECT sf_rls_tenant()) IS NULL OR customer_tenant_id = (SELECT sf_rls_tenant()))
                WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR customer_tenant_id = (SELECT sf_rls_tenant()));
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DROP TABLE sf_billing_reconciliations;
              DROP TABLE sf_credit_notes; DROP TABLE sf_invoice_lines; DROP TABLE sf_invoices;
              DROP FUNCTION sf_billing_document_immutable();
              DROP TABLE sf_document_counters; DROP TABLE sf_payments; DROP TABLE sf_gateway_events; DROP TABLE sf_gateway_plans;
              DROP TABLE sf_trials_used; DROP TABLE sf_billing_profiles; DROP TABLE sf_subscription_events; DROP TABLE sf_subscriptions;
              DROP TABLE sf_tax_rates; DROP TABLE sf_plan_prices;
              ALTER TABLE sf_plans DROP COLUMN sort_order; ALTER TABLE sf_plans DROP COLUMN paid;

  - changeSet:
      id: 059-billing-seed
      author: smartfarm360
      comment: >-
        The plans (P1, P2): FREE gets smaller limits for farm businesses created from now on, and every existing farm
        business moves to FREE_LEGACY with the limits it had, so nobody loses anything. Example prices, replaced by the
        product owner's from the platform console. GST on software as a service (P6). Billing permissions.
      changes:
        - sql:
            splitStatements: true
            sql: |
              UPDATE sf_plans SET sort_order = 1 WHERE code = 'FREE';
              INSERT INTO sf_plans (code, name, paid, sort_order) VALUES
                ('FREE_LEGACY', 'Free (early farm businesses)', FALSE, 0),
                ('GROWER', 'Grower', TRUE, 2),
                ('ESTATE', 'Estate', TRUE, 3);
              INSERT INTO sf_plan_limits (plan_code, limit_code, limit_value)
                SELECT 'FREE_LEGACY', limit_code, limit_value FROM sf_plan_limits WHERE plan_code = 'FREE';
              UPDATE sf_plan_limits SET limit_value = 5 WHERE plan_code = 'FREE' AND limit_code = 'MEMBERS';
              UPDATE sf_plan_limits SET limit_value = 3 WHERE plan_code = 'FREE' AND limit_code = 'FARMS';
              INSERT INTO sf_plan_limits (plan_code, limit_code, limit_value) VALUES
                ('GROWER', 'TENANTS_PER_USER', 3), ('GROWER', 'MEMBERS', 25), ('GROWER', 'FARMS', 20),
                ('GROWER', 'STORAGE_MB', 10240), ('GROWER', 'EXPORTS_PER_DAY', 3),
                ('ESTATE', 'TENANTS_PER_USER', 3), ('ESTATE', 'MEMBERS', 100),
                ('ESTATE', 'STORAGE_MB', 102400), ('ESTATE', 'EXPORTS_PER_DAY', 10);
              UPDATE sf_tenants SET plan_code = 'FREE_LEGACY' WHERE plan_code = 'FREE';
              ALTER TABLE sf_tenants ALTER COLUMN plan_code SET DEFAULT 'FREE';

              INSERT INTO sf_plan_prices (plan_code, period, amount, valid_from) VALUES
                ('GROWER', 'MONTHLY', 499.00, DATE '2026-01-01'), ('GROWER', 'YEARLY', 4990.00, DATE '2026-01-01'),
                ('ESTATE', 'MONTHLY', 1999.00, DATE '2026-01-01'), ('ESTATE', 'YEARLY', 19990.00, DATE '2026-01-01');
              INSERT INTO sf_tax_rates (code, component, rate, valid_from) VALUES
                ('GST_SAAS', 'CGST', 9.00, DATE '2017-07-01'), ('GST_SAAS', 'SGST', 9.00, DATE '2017-07-01'),
                ('GST_SAAS', 'IGST', 18.00, DATE '2017-07-01');

              INSERT INTO sf_permissions (code, description) VALUES
                ('BILLING_VIEW', 'View the plan, invoices and payments'),
                ('BILLING_MANAGE', 'Choose the plan, pay, change billing details and cancel');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN ('BILLING_VIEW', 'BILLING_MANAGE')
                WHERE r.tenant_id IS NULL AND r.code = 'TENANT_OWNER';
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code = 'BILLING_VIEW'
                WHERE r.tenant_id IS NULL AND r.code = 'ACCOUNTANT';

              INSERT INTO sf_finance_categories (code, default_name, kind, account_code) VALUES
                ('SOFTWARE', 'Software and subscriptions', 'EXPENSE', '5600');
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DELETE FROM sf_finance_categories WHERE code = 'SOFTWARE';
              DELETE FROM sf_role_permissions WHERE permission_code IN ('BILLING_VIEW', 'BILLING_MANAGE');
              DELETE FROM sf_permissions WHERE code IN ('BILLING_VIEW', 'BILLING_MANAGE');
              DELETE FROM sf_tax_rates; DELETE FROM sf_plan_prices;
              UPDATE sf_tenants SET plan_code = 'FREE' WHERE plan_code IN ('FREE_LEGACY', 'GROWER', 'ESTATE');
              UPDATE sf_plan_limits SET limit_value = 25 WHERE plan_code = 'FREE' AND limit_code = 'MEMBERS';
              UPDATE sf_plan_limits SET limit_value = 20 WHERE plan_code = 'FREE' AND limit_code = 'FARMS';
              DELETE FROM sf_plan_limits WHERE plan_code IN ('FREE_LEGACY', 'GROWER', 'ESTATE');
              DELETE FROM sf_plans WHERE code IN ('FREE_LEGACY', 'GROWER', 'ESTATE');
