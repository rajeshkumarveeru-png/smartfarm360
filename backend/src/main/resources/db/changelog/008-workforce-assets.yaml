databaseChangeLog:
  # Phase 6 workforce and assets. See docs/workforce/workforce-and-assets.md (approved 2026-10-20). Forward-only.
  - changeSet:
      id: 040-workforce-assets-schema
      author: smartfarm360
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- Workers are parties (G1)
              ALTER TABLE sf_parties ADD COLUMN is_worker BOOLEAN NOT NULL DEFAULT FALSE;

              CREATE TABLE sf_workers (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                party_id BIGINT NOT NULL,
                pay_type VARCHAR(10) NOT NULL CHECK (pay_type IN ('DAILY', 'MONTHLY', 'PIECE')),
                joined_on DATE NOT NULL,
                left_on DATE,
                usual_work VARCHAR(120),
                notes VARCHAR(500),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_worker_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_worker_party UNIQUE (tenant_id, party_id),
                CONSTRAINT fk_sf_worker_party FOREIGN KEY (tenant_id, party_id) REFERENCES sf_parties (tenant_id, id),
                CONSTRAINT ck_sf_worker_left CHECK (left_on IS NULL OR left_on >= joined_on)
              );

              -- Dated rates: per day, per month, or per unit of piece work (G2)
              CREATE TABLE sf_worker_rates (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                worker_id BIGINT NOT NULL,
                effective_from DATE NOT NULL,
                rate NUMERIC(12, 2) NOT NULL CHECK (rate >= 0),
                piece_unit VARCHAR(30),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_worker_rate_from UNIQUE (tenant_id, worker_id, effective_from),
                CONSTRAINT fk_sf_worker_rate_worker FOREIGN KEY (tenant_id, worker_id) REFERENCES sf_workers (tenant_id, id)
              );

              -- One entry per worker per day, with the activity worked on (G3)
              CREATE TABLE sf_attendance (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                worker_id BIGINT NOT NULL,
                work_date DATE NOT NULL,
                status VARCHAR(12) NOT NULL CHECK (status IN ('PRESENT', 'HALF_DAY', 'ABSENT', 'PAID_LEAVE', 'UNPAID_LEAVE')),
                hours NUMERIC(5, 2) CHECK (hours >= 0 AND hours <= 24),
                cost_object_id BIGINT,
                notes VARCHAR(300),
                updated_by BIGINT REFERENCES sf_users (id),
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_attendance_day UNIQUE (tenant_id, worker_id, work_date),
                CONSTRAINT fk_sf_attendance_worker FOREIGN KEY (tenant_id, worker_id) REFERENCES sf_workers (tenant_id, id),
                CONSTRAINT fk_sf_attendance_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id)
              );
              CREATE INDEX ix_sf_attendance_date ON sf_attendance (tenant_id, work_date);

              CREATE TABLE sf_piece_work (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                worker_id BIGINT NOT NULL,
                work_date DATE NOT NULL,
                quantity NUMERIC(14, 3) NOT NULL CHECK (quantity > 0),
                unit VARCHAR(30) NOT NULL,
                rate NUMERIC(12, 4) NOT NULL CHECK (rate >= 0),
                cost_object_id BIGINT,
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT fk_sf_piece_worker FOREIGN KEY (tenant_id, worker_id) REFERENCES sf_workers (tenant_id, id),
                CONSTRAINT fk_sf_piece_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id)
              );

              -- Assets register (G8-G13)
              CREATE TABLE sf_assets (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                name VARCHAR(140) NOT NULL,
                kind VARCHAR(20) NOT NULL CHECK (kind IN ('EQUIPMENT', 'VEHICLE', 'IRRIGATION', 'STRUCTURE', 'BREEDING_ANIMAL', 'OTHER')),
                farm_id BIGINT,
                serial_no VARCHAR(80),
                source_line_id BIGINT NOT NULL,
                cost NUMERIC(14, 2) NOT NULL CHECK (cost > 0),
                salvage_value NUMERIC(14, 2) NOT NULL DEFAULT 0 CHECK (salvage_value >= 0),
                useful_life_months INTEGER CHECK (useful_life_months > 0 AND useful_life_months <= 1200),
                in_use_from DATE NOT NULL,
                depreciation_before NUMERIC(14, 2) NOT NULL DEFAULT 0 CHECK (depreciation_before >= 0),
                cost_object_id BIGINT,
                disposal_document_id BIGINT,
                disposal_kind VARCHAR(10) CHECK (disposal_kind IN ('SOLD', 'SCRAPPED')),
                notes VARCHAR(500),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_asset_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_asset_source_line UNIQUE (source_line_id),
                CONSTRAINT ck_sf_asset_salvage CHECK (salvage_value + depreciation_before <= cost),
                CONSTRAINT fk_sf_asset_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT fk_sf_asset_line FOREIGN KEY (tenant_id, source_line_id) REFERENCES sf_finance_document_lines (tenant_id, id),
                CONSTRAINT fk_sf_asset_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id),
                CONSTRAINT fk_sf_asset_disposal FOREIGN KEY (tenant_id, disposal_document_id) REFERENCES sf_finance_documents (tenant_id, id)
              );

              -- Depreciation taken per asset and month by a depreciation run (G9)
              CREATE TABLE sf_asset_depreciation (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                asset_id BIGINT NOT NULL,
                document_id BIGINT NOT NULL,
                month DATE NOT NULL CHECK (extract(day FROM month) = 1),
                amount NUMERIC(14, 2) NOT NULL CHECK (amount > 0),
                CONSTRAINT fk_sf_asset_dep_asset FOREIGN KEY (tenant_id, asset_id) REFERENCES sf_assets (tenant_id, id),
                CONSTRAINT fk_sf_asset_dep_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id)
              );
              CREATE INDEX ix_sf_asset_dep_asset ON sf_asset_depreciation (tenant_id, asset_id, month);

              CREATE TABLE sf_asset_usage (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                asset_id BIGINT NOT NULL,
                use_date DATE NOT NULL,
                hours NUMERIC(8, 2) CHECK (hours >= 0),
                km NUMERIC(10, 1) CHECK (km >= 0),
                acres NUMERIC(10, 2) CHECK (acres >= 0),
                cost_object_id BIGINT,
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT ck_sf_asset_usage_any CHECK (hours IS NOT NULL OR km IS NOT NULL OR acres IS NOT NULL),
                CONSTRAINT fk_sf_asset_usage_asset FOREIGN KEY (tenant_id, asset_id) REFERENCES sf_assets (tenant_id, id),
                CONSTRAINT fk_sf_asset_usage_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id)
              );

              CREATE TABLE sf_maintenance_plans (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                asset_id BIGINT NOT NULL,
                name VARCHAR(120) NOT NULL,
                every_days INTEGER CHECK (every_days > 0),
                every_hours NUMERIC(8, 2) CHECK (every_hours > 0),
                last_done_on DATE,
                last_done_hours NUMERIC(10, 2),
                active BOOLEAN NOT NULL DEFAULT TRUE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_maint_plan_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT ck_sf_maint_plan_interval CHECK (every_days IS NOT NULL OR every_hours IS NOT NULL),
                CONSTRAINT fk_sf_maint_plan_asset FOREIGN KEY (tenant_id, asset_id) REFERENCES sf_assets (tenant_id, id)
              );

              CREATE TABLE sf_maintenance_logs (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                asset_id BIGINT NOT NULL,
                plan_id BIGINT,
                done_on DATE NOT NULL,
                hours_reading NUMERIC(10, 2),
                description VARCHAR(500) NOT NULL,
                document_id BIGINT,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT fk_sf_maint_log_asset FOREIGN KEY (tenant_id, asset_id) REFERENCES sf_assets (tenant_id, id),
                CONSTRAINT fk_sf_maint_log_plan FOREIGN KEY (tenant_id, plan_id) REFERENCES sf_maintenance_plans (tenant_id, id),
                CONSTRAINT fk_sf_maint_log_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id)
              );

              -- Finance records for payroll and assets; running costs can name an asset (G12)
              ALTER TABLE sf_finance_documents DROP CONSTRAINT ck_sf_doc_type;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT ck_sf_doc_type CHECK (doc_type IN ('BILL', 'SALE', 'PAYMENT', 'RECEIPT',
                'TRANSFER', 'OWNER_IN', 'OWNER_OUT', 'LOAN_RECEIVED', 'LOAN_REPAYMENT', 'SETTLEMENT', 'WRITE_OFF', 'OPENING_BALANCE',
                'DEPRECIATION', 'STOCK_ISSUE', 'STOCK_TRANSFER', 'WASTAGE', 'STOCK_COUNT', 'PRODUCE_RECEIPT', 'PURCHASE_RETURN', 'SALE_RETURN',
                'ALLOCATION', 'ADVANCE', 'ADVANCE_REPAYMENT', 'PAY_RUN', 'WAGE_PAYMENT', 'ASSET_DISPOSAL'));
              ALTER TABLE sf_finance_documents DROP CONSTRAINT ck_sf_doc_period;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT ck_sf_doc_period CHECK ((doc_type IN ('ALLOCATION', 'PAY_RUN')) = (period_from IS NOT NULL AND period_to IS NOT NULL)
                AND (period_to IS NULL OR period_to >= period_from));
              ALTER TABLE sf_finance_documents ADD COLUMN asset_id BIGINT;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT fk_sf_doc_asset FOREIGN KEY (tenant_id, asset_id) REFERENCES sf_assets (tenant_id, id);
              ALTER TABLE sf_finance_document_lines ADD COLUMN asset_id BIGINT;
              ALTER TABLE sf_finance_document_lines ADD CONSTRAINT fk_sf_doc_line_asset FOREIGN KEY (tenant_id, asset_id) REFERENCES sf_assets (tenant_id, id);

              -- Pay runs: one line per worker and period; a worker is in at most one posted run for any day (G4)
              CREATE TABLE sf_pay_run_workers (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                document_id BIGINT NOT NULL,
                worker_id BIGINT NOT NULL,
                period_from DATE NOT NULL,
                period_to DATE NOT NULL,
                days NUMERIC(6, 1) NOT NULL DEFAULT 0,
                time_pay NUMERIC(14, 2) NOT NULL DEFAULT 0,
                piece_pay NUMERIC(14, 2) NOT NULL DEFAULT 0,
                extra_pay NUMERIC(14, 2) NOT NULL DEFAULT 0,
                gross NUMERIC(14, 2) NOT NULL CHECK (gross >= 0),
                CONSTRAINT fk_sf_pay_run_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT fk_sf_pay_run_worker FOREIGN KEY (tenant_id, worker_id) REFERENCES sf_workers (tenant_id, id)
              );
              CREATE INDEX ix_sf_pay_run_worker ON sf_pay_run_workers (tenant_id, worker_id, period_from);
      rollback:
        - sql:
            sql: >
              DROP TABLE sf_pay_run_workers;
              ALTER TABLE sf_finance_document_lines DROP CONSTRAINT fk_sf_doc_line_asset, DROP COLUMN asset_id;
              ALTER TABLE sf_finance_documents DROP CONSTRAINT fk_sf_doc_asset, DROP COLUMN asset_id;
              DROP TABLE sf_maintenance_logs; DROP TABLE sf_maintenance_plans; DROP TABLE sf_asset_usage; DROP TABLE sf_asset_depreciation;
              DROP TABLE sf_assets; DROP TABLE sf_piece_work; DROP TABLE sf_attendance; DROP TABLE sf_worker_rates; DROP TABLE sf_workers;
              ALTER TABLE sf_parties DROP COLUMN is_worker;

  - changeSet:
      id: 041-workforce-assets-seed
      author: smartfarm360
      comment: Permissions and role grants of section 10; Workforce and Assets switched on for every farm business (G14).
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO sf_permissions (code, description) VALUES
                ('WORKFORCE_READ', 'View workers, attendance and wages'),
                ('WORKFORCE_WRITE', 'Manage workers and record attendance and piece work'),
                ('PAYROLL_MANAGE', 'Record advances, pay runs and wage payments'),
                ('ASSETS_READ', 'View the asset register, use and maintenance'),
                ('ASSETS_WRITE', 'Register assets and record their use and maintenance');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN ('WORKFORCE_READ', 'WORKFORCE_WRITE', 'PAYROLL_MANAGE', 'ASSETS_READ', 'ASSETS_WRITE')
                WHERE r.tenant_id IS NULL AND r.code IN ('TENANT_OWNER', 'FARM_ADMIN', 'FARM_MANAGER');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN ('WORKFORCE_READ', 'PAYROLL_MANAGE', 'ASSETS_READ')
                WHERE r.tenant_id IS NULL AND r.code = 'ACCOUNTANT';
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN ('WORKFORCE_READ', 'WORKFORCE_WRITE', 'ASSETS_READ', 'ASSETS_WRITE')
                WHERE r.tenant_id IS NULL AND r.code = 'FIELD_SUPERVISOR';
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN ('WORKFORCE_READ', 'ASSETS_READ')
                WHERE r.tenant_id IS NULL AND r.code = 'VIEWER';
              INSERT INTO sf_tenant_modules (tenant_id, module_code, enabled)
                SELECT t.id, m.code, TRUE FROM sf_tenants t CROSS JOIN (VALUES ('WORKFORCE'), ('ASSETS')) m(code)
                ON CONFLICT (tenant_id, module_code) DO UPDATE SET enabled = TRUE;
      rollback:
        - sql:
            sql: >
              DELETE FROM sf_tenant_modules WHERE module_code IN ('WORKFORCE', 'ASSETS');
              DELETE FROM sf_role_permissions WHERE permission_code IN ('WORKFORCE_READ', 'WORKFORCE_WRITE', 'PAYROLL_MANAGE', 'ASSETS_READ', 'ASSETS_WRITE');
              DELETE FROM sf_permissions WHERE code IN ('WORKFORCE_READ', 'WORKFORCE_WRITE', 'PAYROLL_MANAGE', 'ASSETS_READ', 'ASSETS_WRITE');
