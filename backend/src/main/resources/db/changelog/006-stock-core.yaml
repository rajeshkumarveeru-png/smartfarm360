databaseChangeLog:
  # Phase 4 stock core. See docs/inventory/stock-movements.md (approved 2026-10-20). Forward-only.
  - changeSet:
      id: 035-stock-schema
      author: smartfarm360
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- System unit catalog. factor converts to the dimension's reference unit (kg, litre, piece, metre, sq m).
              CREATE TABLE sf_units (
                code VARCHAR(20) PRIMARY KEY,
                dimension VARCHAR(10) NOT NULL CHECK (dimension IN ('MASS', 'VOLUME', 'COUNT', 'LENGTH', 'AREA')),
                factor NUMERIC(24, 10) NOT NULL CHECK (factor > 0),
                sort_order INTEGER NOT NULL
              );

              CREATE TABLE sf_stock_locations (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                name VARCHAR(80) NOT NULL,
                farm_id BIGINT,
                is_default BOOLEAN NOT NULL DEFAULT FALSE,
                active BOOLEAN NOT NULL DEFAULT TRUE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_location_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_location_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT ck_sf_location_default_active CHECK (NOT is_default OR active)
              );
              CREATE UNIQUE INDEX uq_sf_location_name ON sf_stock_locations (tenant_id, lower(name));
              CREATE UNIQUE INDEX uq_sf_location_default ON sf_stock_locations (tenant_id) WHERE is_default;

              CREATE TABLE sf_stock_items (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                name VARCHAR(140) NOT NULL,
                kind VARCHAR(10) NOT NULL CHECK (kind IN ('INPUT', 'PRODUCE', 'RESALE')),
                base_unit_code VARCHAR(20) NOT NULL REFERENCES sf_units (code),
                custom_unit_name VARCHAR(30),
                expense_category_id BIGINT REFERENCES sf_finance_categories (id),
                sale_category_id BIGINT REFERENCES sf_finance_categories (id),
                reorder_level NUMERIC(18, 4) NOT NULL DEFAULT 0 CHECK (reorder_level >= 0),
                track_lots BOOLEAN NOT NULL DEFAULT FALSE,
                on_hand_quantity NUMERIC(18, 4) NOT NULL DEFAULT 0 CHECK (on_hand_quantity >= 0),
                on_hand_value NUMERIC(14, 2) NOT NULL DEFAULT 0 CHECK (on_hand_value >= 0),
                notes VARCHAR(300),
                needs_review BOOLEAN NOT NULL DEFAULT FALSE,
                active BOOLEAN NOT NULL DEFAULT TRUE,
                legacy_item_id BIGINT UNIQUE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_stock_item_tenant_id UNIQUE (tenant_id, id),
                -- Stock with no quantity has no value: the last unit out takes the remaining value.
                CONSTRAINT ck_sf_stock_item_value CHECK (on_hand_quantity > 0 OR on_hand_value = 0),
                CONSTRAINT ck_sf_stock_item_custom_unit CHECK (custom_unit_name IS NULL OR base_unit_code = 'piece')
              );
              CREATE UNIQUE INDEX uq_sf_stock_item_name ON sf_stock_items (tenant_id, lower(name));

              -- Pack units: "bag = 45 kg". factor is in the item's base unit.
              CREATE TABLE sf_item_units (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                item_id BIGINT NOT NULL,
                name VARCHAR(30) NOT NULL,
                factor NUMERIC(18, 6) NOT NULL CHECK (factor > 0),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT fk_sf_item_unit_item FOREIGN KEY (tenant_id, item_id) REFERENCES sf_stock_items (tenant_id, id)
              );
              CREATE UNIQUE INDEX uq_sf_item_unit_name ON sf_item_units (item_id, lower(name));

              CREATE TABLE sf_stock_lots (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                item_id BIGINT NOT NULL,
                lot_no VARCHAR(60) NOT NULL,
                expiry_date DATE,
                received_on DATE NOT NULL,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_lot_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_lot_no UNIQUE (tenant_id, item_id, lot_no),
                CONSTRAINT fk_sf_lot_item FOREIGN KEY (tenant_id, item_id) REFERENCES sf_stock_items (tenant_id, id)
              );

              -- Finance records gain the stock record types; stock records without value (transfers, farm produce) total 0.
              ALTER TABLE sf_finance_documents DROP CONSTRAINT sf_finance_documents_doc_type_check;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT ck_sf_doc_type CHECK (doc_type IN ('BILL', 'SALE', 'PAYMENT', 'RECEIPT',
                'TRANSFER', 'OWNER_IN', 'OWNER_OUT', 'LOAN_RECEIVED', 'LOAN_REPAYMENT', 'SETTLEMENT', 'WRITE_OFF', 'OPENING_BALANCE',
                'DEPRECIATION', 'STOCK_ISSUE', 'STOCK_TRANSFER', 'WASTAGE', 'STOCK_COUNT', 'PRODUCE_RECEIPT', 'PURCHASE_RETURN', 'SALE_RETURN'));
              ALTER TABLE sf_finance_documents DROP CONSTRAINT sf_finance_documents_total_amount_check;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT ck_sf_doc_total CHECK (total_amount > 0
                OR (total_amount = 0 AND doc_type IN ('BILL', 'SALE', 'OPENING_BALANCE', 'STOCK_ISSUE', 'STOCK_TRANSFER', 'WASTAGE',
                    'STOCK_COUNT', 'PRODUCE_RECEIPT', 'PURCHASE_RETURN', 'SALE_RETURN')));
              ALTER TABLE sf_finance_documents ADD COLUMN original_document_id BIGINT;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT fk_sf_doc_original FOREIGN KEY (tenant_id, original_document_id)
                REFERENCES sf_finance_documents (tenant_id, id);

              -- Bill, sale, return and opening lines can be stock items. Item lines may carry no money (farm produce).
              ALTER TABLE sf_finance_document_lines DROP CONSTRAINT sf_finance_document_lines_amount_check;
              ALTER TABLE sf_finance_document_lines ADD COLUMN item_id BIGINT;
              ALTER TABLE sf_finance_document_lines ADD COLUMN location_id BIGINT;
              ALTER TABLE sf_finance_document_lines ADD COLUMN lot_no VARCHAR(60);
              ALTER TABLE sf_finance_document_lines ADD COLUMN lot_expiry DATE;
              ALTER TABLE sf_finance_document_lines ADD COLUMN base_quantity NUMERIC(18, 4);
              ALTER TABLE sf_finance_document_lines ADD CONSTRAINT ck_sf_doc_line_amount CHECK (amount > 0 OR (amount = 0 AND item_id IS NOT NULL));
              ALTER TABLE sf_finance_document_lines ADD CONSTRAINT ck_sf_doc_line_item_qty CHECK (item_id IS NULL OR base_quantity > 0);
              ALTER TABLE sf_finance_document_lines ADD CONSTRAINT uq_sf_doc_line_tenant_id UNIQUE (tenant_id, id);
              ALTER TABLE sf_finance_document_lines ADD CONSTRAINT fk_sf_doc_line_item FOREIGN KEY (tenant_id, item_id) REFERENCES sf_stock_items (tenant_id, id);
              ALTER TABLE sf_finance_document_lines ADD CONSTRAINT fk_sf_doc_line_location FOREIGN KEY (tenant_id, location_id) REFERENCES sf_stock_locations (tenant_id, id);

              -- Every change in stock. Append-only; reversals add opposite movements.
              CREATE TABLE sf_stock_movements (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                document_id BIGINT NOT NULL,
                document_line_id BIGINT,
                item_id BIGINT NOT NULL,
                location_id BIGINT NOT NULL,
                lot_id BIGINT,
                movement_type VARCHAR(20) NOT NULL CHECK (movement_type IN ('PURCHASE', 'SALE', 'ISSUE', 'TRANSFER_OUT', 'TRANSFER_IN',
                  'WASTAGE', 'COUNT_GAIN', 'COUNT_LOSS', 'PRODUCE', 'SUPPLIER_RETURN', 'CUSTOMER_RETURN', 'OPENING')),
                quantity NUMERIC(18, 4) NOT NULL CHECK (quantity <> 0),
                value NUMERIC(14, 2) NOT NULL,
                unit_cost NUMERIC(18, 4) NOT NULL CHECK (unit_cost >= 0),
                movement_date DATE NOT NULL,
                cost_object_id BIGINT,
                reverses_movement_id BIGINT REFERENCES sf_stock_movements (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT ck_sf_movement_value_sign CHECK ((quantity > 0 AND value >= 0) OR (quantity < 0 AND value <= 0)),
                CONSTRAINT fk_sf_movement_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT fk_sf_movement_line FOREIGN KEY (tenant_id, document_line_id) REFERENCES sf_finance_document_lines (tenant_id, id),
                CONSTRAINT fk_sf_movement_item FOREIGN KEY (tenant_id, item_id) REFERENCES sf_stock_items (tenant_id, id),
                CONSTRAINT fk_sf_movement_location FOREIGN KEY (tenant_id, location_id) REFERENCES sf_stock_locations (tenant_id, id),
                CONSTRAINT fk_sf_movement_lot FOREIGN KEY (tenant_id, lot_id) REFERENCES sf_stock_lots (tenant_id, id),
                CONSTRAINT fk_sf_movement_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id)
              );
              CREATE INDEX ix_sf_movement_item ON sf_stock_movements (tenant_id, item_id, id);
              CREATE INDEX ix_sf_movement_doc ON sf_stock_movements (document_id);
              CREATE INDEX ix_sf_movement_date ON sf_stock_movements (tenant_id, movement_date);

              -- Quantity on hand per item, location and lot (value is item-wide: one average per item, E2).
              CREATE TABLE sf_stock_balances (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                item_id BIGINT NOT NULL,
                location_id BIGINT NOT NULL,
                lot_id BIGINT,
                quantity NUMERIC(18, 4) NOT NULL CHECK (quantity >= 0),
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT fk_sf_balance_item FOREIGN KEY (tenant_id, item_id) REFERENCES sf_stock_items (tenant_id, id),
                CONSTRAINT fk_sf_balance_location FOREIGN KEY (tenant_id, location_id) REFERENCES sf_stock_locations (tenant_id, id),
                CONSTRAINT fk_sf_balance_lot FOREIGN KEY (tenant_id, lot_id) REFERENCES sf_stock_lots (tenant_id, id)
              );
              CREATE UNIQUE INDEX uq_sf_balance_key ON sf_stock_balances (tenant_id, item_id, location_id, coalesce(lot_id, 0));
      rollback:
        - sql:
            sql: >
              DROP TABLE sf_stock_balances; DROP TABLE sf_stock_movements;
              ALTER TABLE sf_finance_document_lines DROP CONSTRAINT fk_sf_doc_line_location, DROP CONSTRAINT fk_sf_doc_line_item,
                DROP CONSTRAINT uq_sf_doc_line_tenant_id, DROP CONSTRAINT ck_sf_doc_line_item_qty, DROP CONSTRAINT ck_sf_doc_line_amount,
                DROP COLUMN base_quantity, DROP COLUMN lot_expiry, DROP COLUMN lot_no, DROP COLUMN location_id, DROP COLUMN item_id,
                ADD CONSTRAINT sf_finance_document_lines_amount_check CHECK (amount > 0);
              ALTER TABLE sf_finance_documents DROP CONSTRAINT fk_sf_doc_original, DROP COLUMN original_document_id,
                DROP CONSTRAINT ck_sf_doc_total, ADD CONSTRAINT sf_finance_documents_total_amount_check CHECK (total_amount > 0),
                DROP CONSTRAINT ck_sf_doc_type, ADD CONSTRAINT sf_finance_documents_doc_type_check CHECK (doc_type IN ('BILL', 'SALE',
                'PAYMENT', 'RECEIPT', 'TRANSFER', 'OWNER_IN', 'OWNER_OUT', 'LOAN_RECEIVED', 'LOAN_REPAYMENT', 'SETTLEMENT', 'WRITE_OFF',
                'OPENING_BALANCE', 'DEPRECIATION'));
              DROP TABLE sf_stock_lots; DROP TABLE sf_item_units; DROP TABLE sf_stock_items; DROP TABLE sf_stock_locations; DROP TABLE sf_units;

  - changeSet:
      id: 036-stock-guards-and-seed
      author: smartfarm360
      comment: Movements are append-only; the unit catalog must match UnitCatalog; every tenant gets a default location.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION sf_stock_movements_append_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                RAISE EXCEPTION 'stock movements are append-only; record a reversal instead';
              END;
              $$
        - sql:
            splitStatements: true
            sql: |
              CREATE TRIGGER trg_sf_stock_movements_append_only BEFORE UPDATE OR DELETE ON sf_stock_movements
                FOR EACH ROW EXECUTE FUNCTION sf_stock_movements_append_only();

              INSERT INTO sf_units (code, dimension, factor, sort_order) VALUES
                ('kg', 'MASS', 1, 10),
                ('g', 'MASS', 0.001, 11),
                ('quintal', 'MASS', 100, 12),
                ('tonne', 'MASS', 1000, 13),
                ('litre', 'VOLUME', 1, 20),
                ('ml', 'VOLUME', 0.001, 21),
                ('piece', 'COUNT', 1, 30),
                ('dozen', 'COUNT', 12, 31),
                ('metre', 'LENGTH', 1, 40),
                ('sq_m', 'AREA', 1, 50),
                ('sq_ft', 'AREA', 0.09290304, 51),
                ('cent', 'AREA', 40.468564224, 52),
                ('acre', 'AREA', 4046.8564224, 53),
                ('hectare', 'AREA', 10000, 54);

              INSERT INTO sf_stock_locations (tenant_id, name, is_default) SELECT id, 'Main store', TRUE FROM sf_tenants;
      rollback:
        - sql:
            sql: >
              DELETE FROM sf_stock_locations; DELETE FROM sf_units;
              DROP TRIGGER trg_sf_stock_movements_append_only ON sf_stock_movements; DROP FUNCTION sf_stock_movements_append_only();

  - changeSet:
      id: 037-stock-legacy-migration
      author: smartfarm360
      comment: >
        Moves Phase 1 stock items and purchases into stock items and movements (stock movement design, section 10) and
        verifies quantities, values and the Stock (1200) ledger balance. Nothing is deleted; the Phase 1 stock tables
        become read-only.
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- Items: free-text units matched to the catalog; anything else becomes a custom count unit to review
              INSERT INTO sf_stock_items (tenant_id, name, kind, base_unit_code, custom_unit_name, reorder_level, active, needs_review,
                    notes, legacy_item_id, created_at)
                SELECT i.tenant_id,
                       -- names were unique only case-sensitively in Phase 1; a later "urea" next to "Urea" keeps its id
                       CASE WHEN row_number() OVER (PARTITION BY i.tenant_id, lower(i.name) ORDER BY i.id) > 1
                            THEN left(i.name, 120) || ' (' || i.id || ')' ELSE i.name END,
                       'INPUT', coalesce(u.code, 'piece'),
                       CASE WHEN u.code IS NULL THEN left(trim(i.unit), 30) END,
                       greatest(i.reorder_level, 0), i.active, u.code IS NULL,
                       left('Phase 1 category: ' || i.category, 300), i.id, i.created_at
                FROM sf_inventory_items i
                LEFT JOIN LATERAL (SELECT CASE lower(regexp_replace(trim(i.unit), '[.\s]', '', 'g'))
                    WHEN 'kg' THEN 'kg' WHEN 'kgs' THEN 'kg' WHEN 'kilo' THEN 'kg' WHEN 'kilogram' THEN 'kg' WHEN 'kilograms' THEN 'kg'
                    WHEN 'g' THEN 'g' WHEN 'gm' THEN 'g' WHEN 'gms' THEN 'g' WHEN 'gram' THEN 'g' WHEN 'grams' THEN 'g'
                    WHEN 'quintal' THEN 'quintal' WHEN 'quintals' THEN 'quintal' WHEN 'qtl' THEN 'quintal'
                    WHEN 'tonne' THEN 'tonne' WHEN 'tonnes' THEN 'tonne' WHEN 'ton' THEN 'tonne' WHEN 'tons' THEN 'tonne'
                    WHEN 'l' THEN 'litre' WHEN 'ltr' THEN 'litre' WHEN 'ltrs' THEN 'litre' WHEN 'litre' THEN 'litre' WHEN 'litres' THEN 'litre'
                    WHEN 'liter' THEN 'litre' WHEN 'liters' THEN 'litre' WHEN 'ml' THEN 'ml'
                    WHEN 'nos' THEN 'piece' WHEN 'no' THEN 'piece' WHEN 'pcs' THEN 'piece' WHEN 'pc' THEN 'piece' WHEN 'piece' THEN 'piece'
                    WHEN 'pieces' THEN 'piece' WHEN 'number' THEN 'piece' WHEN 'numbers' THEN 'piece'
                    WHEN 'dozen' THEN 'dozen' WHEN 'doz' THEN 'dozen' WHEN 'm' THEN 'metre' WHEN 'metre' THEN 'metre' WHEN 'meter' THEN 'metre'
                    END AS code) u ON TRUE;

              -- Purchase bills migrated in Phase 3 (034) and those the Phase 3 stock screen posted, paired with their purchase
              CREATE TEMPORARY TABLE tmp_sf_purchase_bill ON COMMIT DROP AS
                SELECT p.id AS purchase_id, d.id AS document_id, l.id AS line_id
                FROM sf_purchases p
                JOIN sf_finance_documents d ON d.legacy_source = 'sf_purchases' AND d.legacy_id = p.id
                JOIN sf_finance_document_lines l ON l.document_id = d.id AND l.account_code = '1200';
              INSERT INTO tmp_sf_purchase_bill (purchase_id, document_id, line_id)
                SELECT pp.purchase_id, bb.document_id, bb.line_id
                FROM (SELECT p.id AS purchase_id, p.tenant_id, pa.id AS party_id, p.purchase_date, i.name, p.quantity, p.unit_cost, p.total_amount,
                             row_number() OVER (PARTITION BY p.tenant_id, pa.id, p.purchase_date, i.name, p.quantity, p.unit_cost, p.total_amount ORDER BY p.id) AS n
                      FROM sf_purchases p JOIN sf_inventory_items i ON i.id = p.item_id
                      JOIN sf_parties pa ON pa.legacy_supplier_id = p.supplier_id
                      WHERE p.total_amount > 0 AND NOT EXISTS (SELECT 1 FROM sf_finance_documents d WHERE d.legacy_source = 'sf_purchases' AND d.legacy_id = p.id)) pp
                JOIN (SELECT d.id AS document_id, l.id AS line_id, d.tenant_id, d.party_id, d.doc_date, l.description, l.quantity, l.rate, l.amount,
                             row_number() OVER (PARTITION BY d.tenant_id, d.party_id, d.doc_date, l.description, l.quantity, l.rate, l.amount ORDER BY d.id) AS n
                      FROM sf_finance_documents d JOIN sf_finance_document_lines l ON l.document_id = d.id
                      WHERE d.doc_type = 'BILL' AND d.legacy_source IS NULL AND l.account_code = '1200' AND l.category_id IS NULL
                        AND (SELECT count(*) FROM sf_finance_document_lines x WHERE x.document_id = d.id) = 1) bb
                  ON bb.tenant_id = pp.tenant_id AND bb.party_id = pp.party_id AND bb.doc_date = pp.purchase_date AND bb.description = pp.name
                 AND bb.quantity = pp.quantity AND bb.rate = pp.unit_cost AND bb.amount = pp.total_amount AND bb.n = pp.n;

              -- The bill lines now name their stock item and location
              UPDATE sf_finance_document_lines l SET item_id = s.id, base_quantity = p.quantity,
                     location_id = (SELECT id FROM sf_stock_locations WHERE tenant_id = l.tenant_id AND is_default)
                FROM tmp_sf_purchase_bill b JOIN sf_purchases p ON p.id = b.purchase_id JOIN sf_stock_items s ON s.legacy_item_id = p.item_id
                WHERE l.id = b.line_id;

              -- One receipt movement per purchase with a bill
              INSERT INTO sf_stock_movements (tenant_id, document_id, document_line_id, item_id, location_id, movement_type, quantity, value,
                    unit_cost, movement_date, created_at)
                SELECT p.tenant_id, b.document_id, b.line_id, s.id, (SELECT id FROM sf_stock_locations WHERE tenant_id = p.tenant_id AND is_default),
                       'PURCHASE', p.quantity, p.total_amount, round(p.total_amount / p.quantity, 4), p.purchase_date, p.created_at
                FROM sf_purchases p JOIN tmp_sf_purchase_bill b ON b.purchase_id = p.id JOIN sf_stock_items s ON s.legacy_item_id = p.item_id
                ORDER BY p.purchase_date, p.id;

              -- What purchases do not explain: the starting quantity typed in Phase 1 (opening), or a shortfall (to review)
              CREATE TEMPORARY TABLE tmp_sf_stock_gap ON COMMIT DROP AS
                SELECT s.id AS item_id, s.tenant_id, i.quantity_on_hand AS final_qty,
                       round(i.quantity_on_hand * i.average_unit_cost, 2) AS final_value,
                       coalesce(m.qty, 0) AS bought_qty, coalesce(m.value, 0) AS bought_value,
                       i.quantity_on_hand - coalesce(m.qty, 0) AS gap_qty,
                       -- the starting quantity was typed when the item was created (never after its first purchase)
                       least(i.created_at::date, coalesce(m.first_date, i.created_at::date)) AS opening_date,
                       coalesce(m.last_date, i.created_at::date) AS gap_date
                FROM sf_stock_items s JOIN sf_inventory_items i ON i.id = s.legacy_item_id
                LEFT JOIN (SELECT item_id, sum(quantity) qty, sum(value) value, min(movement_date) first_date, max(movement_date) last_date
                           FROM sf_stock_movements GROUP BY item_id) m
                  ON m.item_id = s.id;

              -- Opening stock: one opening-balance record per tenant, Dr 1200 / Cr 3900 for its value
              INSERT INTO sf_finance_documents (tenant_id, doc_type, status, number, doc_date, total_amount, notes, needs_review,
                    legacy_source, legacy_id, posted_at)
                SELECT g.tenant_id, 'OPENING_BALANCE', 'POSTED', 'MIG-S-' || g.tenant_id, min(g.opening_date),
                       sum(greatest(g.final_value - g.bought_value, 0)),
                       'Opening stock from the Phase 1 stock screen (value reconstructed from the Phase 1 average cost)',
                       bool_or(g.final_value - g.bought_value < 0), 'stock-opening', g.tenant_id, now()
                FROM tmp_sf_stock_gap g WHERE g.gap_qty > 0 GROUP BY g.tenant_id;
              INSERT INTO sf_finance_document_lines (tenant_id, document_id, line_no, account_code, side, description, quantity, unit, amount,
                    item_id, location_id, base_quantity)
                SELECT g.tenant_id, d.id, row_number() OVER (PARTITION BY d.id ORDER BY g.item_id), '1200', 'DEBIT', s.name, g.gap_qty,
                       coalesce(s.custom_unit_name, s.base_unit_code), greatest(g.final_value - g.bought_value, 0), s.id,
                       (SELECT id FROM sf_stock_locations WHERE tenant_id = g.tenant_id AND is_default), g.gap_qty
                FROM tmp_sf_stock_gap g JOIN sf_stock_items s ON s.id = g.item_id
                JOIN sf_finance_documents d ON d.legacy_source = 'stock-opening' AND d.legacy_id = g.tenant_id
                WHERE g.gap_qty > 0;
              INSERT INTO sf_stock_movements (tenant_id, document_id, document_line_id, item_id, location_id, movement_type, quantity, value,
                    unit_cost, movement_date)
                SELECT l.tenant_id, l.document_id, l.id, l.item_id, l.location_id, 'OPENING', l.base_quantity, l.amount,
                       round(l.amount / l.base_quantity, 4), d.doc_date
                FROM sf_finance_document_lines l JOIN sf_finance_documents d ON d.id = l.document_id WHERE d.legacy_source = 'stock-opening';

              -- Shortfall (Phase 1 quantity lower than its purchases): a stock count record to review, Dr 5980 / Cr 1200 at average
              INSERT INTO sf_finance_documents (tenant_id, doc_type, status, number, doc_date, total_amount, notes, needs_review,
                    legacy_source, legacy_id, posted_at)
                SELECT g.tenant_id, 'STOCK_COUNT', 'POSTED', 'MIG-SC-' || g.tenant_id, max(g.gap_date),
                       sum(CASE WHEN g.final_qty = 0 THEN g.bought_value ELSE round(-g.gap_qty * g.bought_value / g.bought_qty, 2) END),
                       'Phase 1 quantity was lower than its purchases; review this stock loss', TRUE, 'stock-shortfall', g.tenant_id, now()
                FROM tmp_sf_stock_gap g WHERE g.gap_qty < 0 GROUP BY g.tenant_id;
              INSERT INTO sf_stock_movements (tenant_id, document_id, item_id, location_id, movement_type, quantity, value, unit_cost, movement_date)
                SELECT g.tenant_id, d.id, g.item_id, (SELECT id FROM sf_stock_locations WHERE tenant_id = g.tenant_id AND is_default),
                       'COUNT_LOSS', g.gap_qty,
                       -(CASE WHEN g.final_qty = 0 THEN g.bought_value ELSE round(-g.gap_qty * g.bought_value / g.bought_qty, 2) END),
                       round(g.bought_value / g.bought_qty, 4), d.doc_date
                FROM tmp_sf_stock_gap g JOIN sf_finance_documents d ON d.legacy_source = 'stock-shortfall' AND d.legacy_id = g.tenant_id
                WHERE g.gap_qty < 0;
              UPDATE sf_stock_items s SET needs_review = TRUE FROM tmp_sf_stock_gap g WHERE g.item_id = s.id AND g.gap_qty < 0;

              -- Journal for the opening and shortfall records
              INSERT INTO sf_journal_entries (tenant_id, document_id, entry_date, kind)
                SELECT tenant_id, id, doc_date, 'POSTING' FROM sf_finance_documents
                WHERE legacy_source IN ('stock-opening', 'stock-shortfall') AND total_amount > 0;
              INSERT INTO sf_journal_lines (tenant_id, entry_id, account_code, debit, credit, cost_object_id)
                SELECT d.tenant_id, j.id, x.account_code, x.debit, x.credit, x.cost_object_id
                FROM sf_finance_documents d JOIN sf_journal_entries j ON j.document_id = d.id
                CROSS JOIN LATERAL (VALUES
                    (CASE d.legacy_source WHEN 'stock-opening' THEN '1200' ELSE '5980' END, d.total_amount, 0::numeric,
                     CASE d.legacy_source WHEN 'stock-shortfall' THEN (SELECT o.id FROM sf_cost_objects o WHERE o.tenant_id = d.tenant_id AND o.kind = 'OVERHEAD') END),
                    (CASE d.legacy_source WHEN 'stock-opening' THEN '3900' ELSE '1200' END, 0::numeric, d.total_amount, NULL::bigint)
                  ) AS x(account_code, debit, credit, cost_object_id)
                WHERE d.legacy_source IN ('stock-opening', 'stock-shortfall');

              -- Projections: item totals and quantity per location
              UPDATE sf_stock_items s SET on_hand_quantity = m.qty, on_hand_value = m.value
                FROM (SELECT item_id, sum(quantity) qty, sum(value) value FROM sf_stock_movements GROUP BY item_id) m WHERE m.item_id = s.id;
              INSERT INTO sf_stock_balances (tenant_id, item_id, location_id, quantity)
                SELECT tenant_id, item_id, location_id, sum(quantity) FROM sf_stock_movements GROUP BY tenant_id, item_id, location_id;
        - sql:
            splitStatements: false
            comment: Verify the migration before it commits; any mismatch aborts the changeset.
            sql: |
              DO $$
              DECLARE problems TEXT := '';
              BEGIN
                IF (SELECT count(*) FROM sf_inventory_items) <> (SELECT count(*) FROM sf_stock_items WHERE legacy_item_id IS NOT NULL) THEN
                  problems := problems || 'item count; ';
                END IF;
                IF EXISTS (SELECT 1 FROM sf_stock_items s JOIN sf_inventory_items i ON i.id = s.legacy_item_id
                           WHERE s.on_hand_quantity <> i.quantity_on_hand) THEN
                  problems := problems || 'quantity on hand; ';
                END IF;
                IF EXISTS (SELECT 1 FROM sf_stock_items s LEFT JOIN (SELECT item_id, sum(quantity) q, sum(value) v FROM sf_stock_movements GROUP BY item_id) m
                             ON m.item_id = s.id WHERE s.on_hand_quantity <> coalesce(m.q, 0) OR s.on_hand_value <> coalesce(m.v, 0)) THEN
                  problems := problems || 'items differ from movements; ';
                END IF;
                IF EXISTS (SELECT 1 FROM sf_purchases p WHERE p.total_amount > 0
                           AND NOT EXISTS (SELECT 1 FROM tmp_sf_purchase_bill b WHERE b.purchase_id = p.id)) THEN
                  problems := problems || 'purchase without a bill; ';
                END IF;
                IF EXISTS (SELECT 1 FROM sf_tenants t
                           WHERE (SELECT coalesce(sum(debit - credit), 0) FROM sf_journal_lines WHERE tenant_id = t.id AND account_code = '1200')
                              <> (SELECT coalesce(sum(on_hand_value), 0) FROM sf_stock_items WHERE tenant_id = t.id)) THEN
                  problems := problems || 'Stock (1200) differs from stock value; ';
                END IF;
                IF EXISTS (SELECT 1 FROM sf_journal_lines GROUP BY entry_id HAVING sum(debit) <> sum(credit)) THEN
                  problems := problems || 'unbalanced journal; ';
                END IF;
                IF problems <> '' THEN
                  RAISE EXCEPTION 'Stock legacy migration verification failed: %', problems;
                END IF;
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION sf_legacy_stock_read_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                RAISE EXCEPTION '% is read-only since Phase 4; use stock items and movements', TG_TABLE_NAME;
              END;
              $$
        - sql:
            splitStatements: true
            sql: |
              CREATE TRIGGER trg_sf_inventory_items_read_only BEFORE INSERT OR UPDATE OR DELETE ON sf_inventory_items
                FOR EACH ROW EXECUTE FUNCTION sf_legacy_stock_read_only();
              CREATE TRIGGER trg_sf_purchases_read_only BEFORE INSERT OR UPDATE OR DELETE ON sf_purchases
                FOR EACH ROW EXECUTE FUNCTION sf_legacy_stock_read_only();
              CREATE TRIGGER trg_sf_suppliers_read_only BEFORE INSERT OR UPDATE OR DELETE ON sf_suppliers
                FOR EACH ROW EXECUTE FUNCTION sf_legacy_stock_read_only();
      rollback:
        - sql:
            sql: >
              DROP TRIGGER trg_sf_suppliers_read_only ON sf_suppliers; DROP TRIGGER trg_sf_purchases_read_only ON sf_purchases;
              DROP TRIGGER trg_sf_inventory_items_read_only ON sf_inventory_items; DROP FUNCTION sf_legacy_stock_read_only();
