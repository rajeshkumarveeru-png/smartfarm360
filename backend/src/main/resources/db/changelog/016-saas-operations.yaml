databaseChangeLog:
  # Phase 14 SaaS operations. See docs/platform/saas-operations.md (approved 2026-10-22). Forward-only.
  - changeSet:
      id: 054-saas-operations-schema
      author: smartfarm360
      comment: Plans and limits, suspension and deletion state, support grants, the platform audit log, exports, two-step sign-in, legal documents and consent, email verification, rate-limit counters, announcements and operations checks (O3–O12).
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE sf_plans (
                code VARCHAR(30) PRIMARY KEY,
                name VARCHAR(80) NOT NULL
              );
              CREATE TABLE sf_plan_limits (
                plan_code VARCHAR(30) NOT NULL REFERENCES sf_plans (code),
                limit_code VARCHAR(40) NOT NULL,
                limit_value INT NOT NULL CHECK (limit_value >= 0),
                PRIMARY KEY (plan_code, limit_code)
              );
              CREATE TABLE sf_tenant_limit_overrides (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                limit_code VARCHAR(40) NOT NULL,
                limit_value INT NOT NULL CHECK (limit_value >= 0),
                reason VARCHAR(300) NOT NULL,
                set_by BIGINT NOT NULL REFERENCES sf_users (id),
                set_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_tenant_limit_override UNIQUE (tenant_id, limit_code),
                CONSTRAINT uq_sf_tenant_limit_override_tenant UNIQUE (tenant_id, id)
              );

              ALTER TABLE sf_tenants ADD COLUMN suspended_reason VARCHAR(300);
              ALTER TABLE sf_tenants ADD COLUMN suspended_at TIMESTAMP WITH TIME ZONE;
              ALTER TABLE sf_tenants ADD COLUMN deletion_requested_at TIMESTAMP WITH TIME ZONE;
              ALTER TABLE sf_tenants ADD COLUMN deletion_requested_by BIGINT REFERENCES sf_users (id);
              ALTER TABLE sf_tenants ADD COLUMN deletion_scheduled_for TIMESTAMP WITH TIME ZONE;
              ALTER TABLE sf_tenants ADD CONSTRAINT ck_sf_tenant_deletion
                CHECK ((deletion_requested_at IS NULL) = (deletion_scheduled_for IS NULL));

              CREATE TABLE sf_support_grants (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                granted_by BIGINT NOT NULL REFERENCES sf_users (id),
                granted_to BIGINT REFERENCES sf_users (id),
                reason VARCHAR(300) NOT NULL,
                starts_at TIMESTAMP WITH TIME ZONE NOT NULL,
                ends_at TIMESTAMP WITH TIME ZONE NOT NULL,
                ended_at TIMESTAMP WITH TIME ZONE,
                ended_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_support_grant_tenant UNIQUE (tenant_id, id),
                CONSTRAINT ck_sf_support_grant_period CHECK (ends_at > starts_at AND ends_at <= starts_at + INTERVAL '72 hours')
              );
              CREATE INDEX ix_sf_support_grant_open ON sf_support_grants (tenant_id, ends_at) WHERE ended_at IS NULL;

              CREATE TABLE sf_platform_audit (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                actor_user_id BIGINT REFERENCES sf_users (id),
                action VARCHAR(60) NOT NULL,
                target_type VARCHAR(30) NOT NULL,
                target_id BIGINT,
                details JSONB NOT NULL DEFAULT '{}'::jsonb,
                occurred_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX ix_sf_platform_audit_time ON sf_platform_audit (occurred_at DESC);
              CREATE INDEX ix_sf_platform_audit_target ON sf_platform_audit (target_type, target_id);

              CREATE TABLE sf_tenant_exports (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                requested_by BIGINT NOT NULL REFERENCES sf_users (id),
                status VARCHAR(10) NOT NULL CHECK (status IN ('QUEUED', 'RUNNING', 'READY', 'FAILED', 'EXPIRED')),
                file_name VARCHAR(200),
                size_bytes BIGINT,
                error VARCHAR(300),
                requested_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                ready_at TIMESTAMP WITH TIME ZONE,
                expires_at TIMESTAMP WITH TIME ZONE,
                CONSTRAINT uq_sf_tenant_export_tenant UNIQUE (tenant_id, id)
              );
              CREATE INDEX ix_sf_tenant_export_day ON sf_tenant_exports (tenant_id, requested_at);

              CREATE TABLE sf_user_mfa (
                user_id BIGINT PRIMARY KEY REFERENCES sf_users (id),
                secret_enc VARCHAR(200) NOT NULL,
                enabled_at TIMESTAMP WITH TIME ZONE,
                last_step BIGINT,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE TABLE sf_user_recovery_codes (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                user_id BIGINT NOT NULL REFERENCES sf_users (id),
                code_hash VARCHAR(64) NOT NULL,
                used_at TIMESTAMP WITH TIME ZONE
              );
              CREATE INDEX ix_sf_user_recovery_code_user ON sf_user_recovery_codes (user_id);
              ALTER TABLE sf_refresh_tokens ADD COLUMN mfa BOOLEAN NOT NULL DEFAULT FALSE;

              CREATE TABLE sf_legal_documents (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                kind VARCHAR(10) NOT NULL CHECK (kind IN ('TERMS', 'PRIVACY')),
                version INT NOT NULL CHECK (version > 0),
                language VARCHAR(5) NOT NULL CHECK (language IN ('en', 'ta')),
                title VARCHAR(140) NOT NULL,
                body TEXT NOT NULL,
                changes VARCHAR(1000),
                published_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                published_by BIGINT NOT NULL REFERENCES sf_users (id),
                CONSTRAINT uq_sf_legal_document UNIQUE (kind, version, language)
              );
              CREATE TABLE sf_consents (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                user_id BIGINT NOT NULL REFERENCES sf_users (id),
                kind VARCHAR(10) NOT NULL CHECK (kind IN ('TERMS', 'PRIVACY', 'MARKETING')),
                version INT NOT NULL,
                accepted BOOLEAN NOT NULL DEFAULT TRUE,
                client VARCHAR(10) NOT NULL CHECK (client IN ('WEB', 'MOBILE', 'API')),
                recorded_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX ix_sf_consent_user ON sf_consents (user_id, kind, version);

              ALTER TABLE sf_users ADD COLUMN email_verified_at TIMESTAMP WITH TIME ZONE;
              ALTER TABLE sf_users ADD COLUMN anonymised_at TIMESTAMP WITH TIME ZONE;
              ALTER TABLE sf_users ADD COLUMN marketing_opt_in BOOLEAN NOT NULL DEFAULT FALSE;
              -- Accounts that already exist are treated as verified (O5)
              UPDATE sf_users SET email_verified_at = created_at;
              CREATE TABLE sf_email_verification_tokens (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                user_id BIGINT NOT NULL REFERENCES sf_users (id),
                token_hash VARCHAR(64) NOT NULL UNIQUE,
                expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
                used_at TIMESTAMP WITH TIME ZONE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE sf_rate_limit_counters (
                limit_key VARCHAR(300) NOT NULL,
                window_start TIMESTAMP WITH TIME ZONE NOT NULL,
                hits INT NOT NULL,
                expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
                PRIMARY KEY (limit_key, window_start)
              );
              CREATE INDEX ix_sf_rate_limit_expiry ON sf_rate_limit_counters (expires_at);

              CREATE TABLE sf_announcements (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                message_en VARCHAR(500) NOT NULL,
                message_ta VARCHAR(500) NOT NULL,
                starts_at TIMESTAMP WITH TIME ZONE NOT NULL,
                ends_at TIMESTAMP WITH TIME ZONE NOT NULL,
                maintenance BOOLEAN NOT NULL DEFAULT FALSE,
                created_by BIGINT NOT NULL REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                ended_at TIMESTAMP WITH TIME ZONE,
                CONSTRAINT ck_sf_announcement_period CHECK (ends_at > starts_at)
              );

              CREATE TABLE sf_ops_checks (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                kind VARCHAR(20) NOT NULL CHECK (kind IN ('BACKUP', 'RESTORE_TEST', 'ALERT_TEST', 'LOAD_TEST')),
                ok BOOLEAN NOT NULL,
                details VARCHAR(1000),
                duration_ms BIGINT,
                recorded_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX ix_sf_ops_check_kind ON sf_ops_checks (kind, recorded_at DESC);
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DROP TABLE sf_ops_checks; DROP TABLE sf_announcements; DROP TABLE sf_rate_limit_counters;
              DROP TABLE sf_email_verification_tokens;
              ALTER TABLE sf_users DROP COLUMN marketing_opt_in; ALTER TABLE sf_users DROP COLUMN anonymised_at; ALTER TABLE sf_users DROP COLUMN email_verified_at;
              DROP TABLE sf_consents; DROP TABLE sf_legal_documents;
              ALTER TABLE sf_refresh_tokens DROP COLUMN mfa;
              DROP TABLE sf_user_recovery_codes; DROP TABLE sf_user_mfa;
              DROP TABLE sf_tenant_exports; DROP TABLE sf_platform_audit; DROP TABLE sf_support_grants;
              ALTER TABLE sf_tenants DROP CONSTRAINT ck_sf_tenant_deletion;
              ALTER TABLE sf_tenants DROP COLUMN deletion_scheduled_for; ALTER TABLE sf_tenants DROP COLUMN deletion_requested_by;
              ALTER TABLE sf_tenants DROP COLUMN deletion_requested_at; ALTER TABLE sf_tenants DROP COLUMN suspended_at;
              ALTER TABLE sf_tenants DROP COLUMN suspended_reason;
              DROP TABLE sf_tenant_limit_overrides; DROP TABLE sf_plan_limits; DROP TABLE sf_plans;

  - changeSet:
      id: 055-saas-operations-seed
      author: smartfarm360
      comment: The FREE plan and its limits (O8).
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO sf_plans (code, name) VALUES ('FREE', 'Free');
              INSERT INTO sf_plan_limits (plan_code, limit_code, limit_value) VALUES
                ('FREE', 'TENANTS_PER_USER', 3),
                ('FREE', 'MEMBERS', 25),
                ('FREE', 'FARMS', 20),
                ('FREE', 'STORAGE_MB', 1024),
                ('FREE', 'EXPORTS_PER_DAY', 3);
              ALTER TABLE sf_tenants ADD CONSTRAINT fk_sf_tenant_plan FOREIGN KEY (plan_code) REFERENCES sf_plans (code);
      rollback:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE sf_tenants DROP CONSTRAINT fk_sf_tenant_plan;
              DELETE FROM sf_plan_limits; DELETE FROM sf_plans;

  - changeSet:
      id: 056-row-level-security
      author: smartfarm360
      comment: >-
        Row-Level Security on every table with a tenant_id (O13, ADR 0011). The application sets app.tenant_id on each
        connection it borrows: a tenant id inside a farm business's request, 'all' otherwise. FORCE applies the policies
        to the table owner too; superusers still bypass them. Corrected before its first run (2026-10-26): the session
        tenant is read once per query through a scalar subquery, not once per row, so the dashboard stays within budget.
      changes:
        - sql:
            splitStatements: false
            sql: |
              -- The session's farm business: NULL means unrestricted (no setting, or 'all'); anything not an id shows nothing
              CREATE FUNCTION sf_rls_tenant() RETURNS BIGINT LANGUAGE plpgsql STABLE AS $fn$
              DECLARE s TEXT := COALESCE(current_setting('app.tenant_id', true), '');
              BEGIN
                IF s = '' OR s = 'all' THEN RETURN NULL; END IF;
                IF s ~ '^[0-9]{1,18}$' THEN RETURN s::BIGINT; END IF;
                RETURN -1;
              END
              $fn$;
              DO $do$
              DECLARE t RECORD;
              BEGIN
                FOR t IN
                  SELECT c.table_name FROM information_schema.columns c
                  JOIN information_schema.tables x ON x.table_schema = c.table_schema AND x.table_name = c.table_name
                  WHERE c.table_schema = current_schema() AND c.column_name = 'tenant_id' AND x.table_type = 'BASE TABLE'
                    AND c.table_name LIKE 'sf\_%'
                LOOP
                  EXECUTE format('ALTER TABLE %I ENABLE ROW LEVEL SECURITY', t.table_name);
                  EXECUTE format('ALTER TABLE %I FORCE ROW LEVEL SECURITY', t.table_name);
                  EXECUTE format('CREATE POLICY sf_tenant_isolation ON %I USING ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant())) WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()))', t.table_name);
                END LOOP;
              END
              $do$;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DO $do$
              DECLARE t RECORD;
              BEGIN
                FOR t IN SELECT tablename FROM pg_policies WHERE policyname = 'sf_tenant_isolation' AND schemaname = current_schema()
                LOOP
                  EXECUTE format('DROP POLICY sf_tenant_isolation ON %I', t.tablename);
                  EXECUTE format('ALTER TABLE %I NO FORCE ROW LEVEL SECURITY', t.tablename);
                  EXECUTE format('ALTER TABLE %I DISABLE ROW LEVEL SECURITY', t.tablename);
                END LOOP;
              END
              $do$;
              DROP FUNCTION sf_rls_tenant();

  - changeSet:
      id: 057-guards-allow-tenant-deletion
      author: smartfarm360
      comment: >-
        The append-only and read-only guards let a farm business's deletion remove its rows (O10). Only DELETE, and only
        in a transaction where the deletion job set app.tenant_deletion = 'on' (transaction-local). Everything else is
        refused as before.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION sf_journal_append_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                IF TG_OP = 'DELETE' AND current_setting('app.tenant_deletion', true) = 'on' THEN RETURN OLD; END IF;
                RAISE EXCEPTION 'SmartFarm360 journal is append-only (% on %)', TG_OP, TG_TABLE_NAME;
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION sf_stock_movements_append_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                IF TG_OP = 'DELETE' AND current_setting('app.tenant_deletion', true) = 'on' THEN RETURN OLD; END IF;
                RAISE EXCEPTION 'stock movements are append-only; record a reversal instead';
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION sf_legacy_read_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                IF TG_OP = 'DELETE' AND current_setting('app.tenant_deletion', true) = 'on' THEN RETURN OLD; END IF;
                RAISE EXCEPTION '% is read-only since Phase 3; use finance documents', TG_TABLE_NAME;
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION sf_legacy_stock_read_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                IF TG_OP = 'DELETE' AND current_setting('app.tenant_deletion', true) = 'on' THEN RETURN OLD; END IF;
                RAISE EXCEPTION '% is read-only since Phase 4; use stock items and movements', TG_TABLE_NAME;
              END;
              $$
      rollback:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION sf_journal_append_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                RAISE EXCEPTION 'SmartFarm360 journal is append-only (% on %)', TG_OP, TG_TABLE_NAME;
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION sf_stock_movements_append_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                RAISE EXCEPTION 'stock movements are append-only; record a reversal instead';
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION sf_legacy_read_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                RAISE EXCEPTION '% is read-only since Phase 3; use finance documents', TG_TABLE_NAME;
              END;
              $$
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION sf_legacy_stock_read_only() RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                RAISE EXCEPTION '% is read-only since Phase 4; use stock items and movements', TG_TABLE_NAME;
              END;
              $$
