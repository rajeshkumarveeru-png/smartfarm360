databaseChangeLog:
  - changeSet:
      id: 060-recycle-bin
      author: smartfarm360
      comment: >-
        Recycle bin (bin and batch varieties design, B1-B9): deleting moves an item to the Bin (deleted_at, deleted_by);
        restore brings it back; delete forever erases it unless money or stock records still refer to it. First kinds:
        farms, fields, crop cycles, animal groups (poultry batches and herds) and work notes. DATA_PURGE for the owner.
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE sf_farms ADD COLUMN deleted_at TIMESTAMP WITH TIME ZONE, ADD COLUMN deleted_by BIGINT REFERENCES sf_users (id);
              ALTER TABLE sf_land_parcels ADD COLUMN deleted_at TIMESTAMP WITH TIME ZONE, ADD COLUMN deleted_by BIGINT REFERENCES sf_users (id);
              ALTER TABLE sf_cultivation_cycles ADD COLUMN deleted_at TIMESTAMP WITH TIME ZONE, ADD COLUMN deleted_by BIGINT REFERENCES sf_users (id);
              ALTER TABLE sf_animal_groups ADD COLUMN deleted_at TIMESTAMP WITH TIME ZONE, ADD COLUMN deleted_by BIGINT REFERENCES sf_users (id);
              ALTER TABLE sf_farm_activities ADD COLUMN deleted_at TIMESTAMP WITH TIME ZONE, ADD COLUMN deleted_by BIGINT REFERENCES sf_users (id);

              -- Farms and fields archived with the earlier Delete button are in the Bin from now on
              UPDATE sf_farms SET deleted_at = CURRENT_TIMESTAMP WHERE NOT active;
              UPDATE sf_land_parcels SET deleted_at = CURRENT_TIMESTAMP WHERE NOT active;

              INSERT INTO sf_permissions (code, description) VALUES
                ('DATA_PURGE', 'Delete items in the Bin forever');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code = 'DATA_PURGE'
                WHERE r.tenant_id IS NULL AND r.code = 'TENANT_OWNER';
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DELETE FROM sf_role_permissions WHERE permission_code = 'DATA_PURGE';
              DELETE FROM sf_permissions WHERE code = 'DATA_PURGE';
              ALTER TABLE sf_farm_activities DROP COLUMN deleted_by, DROP COLUMN deleted_at;
              ALTER TABLE sf_animal_groups DROP COLUMN deleted_by, DROP COLUMN deleted_at;
              ALTER TABLE sf_cultivation_cycles DROP COLUMN deleted_by, DROP COLUMN deleted_at;
              ALTER TABLE sf_land_parcels DROP COLUMN deleted_by, DROP COLUMN deleted_at;
              ALTER TABLE sf_farms DROP COLUMN deleted_by, DROP COLUMN deleted_at;

  - changeSet:
      id: 061-flock-lines
      author: smartfarm360
      comment: >-
        Batch varieties (bin and batch varieties design, V1-V8): a poultry batch or a goat and sheep herd has one or more
        lines, each a species and variety, and head movements name their line. Ducks, quail and turkeys join chickens.
        Every existing counted group becomes one line (its species, its strain as the variety) holding all its movements.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE sf_flock_lines (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                group_id BIGINT NOT NULL,
                species VARCHAR(10) NOT NULL CHECK (species IN ('CHICKEN', 'DUCK', 'QUAIL', 'TURKEY', 'GOAT', 'SHEEP')),
                variety VARCHAR(120),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_flock_line_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_flock_line_group FOREIGN KEY (tenant_id, group_id) REFERENCES sf_animal_groups (tenant_id, id) ON DELETE CASCADE
              );
              CREATE INDEX ix_sf_flock_line_group ON sf_flock_lines (tenant_id, group_id);
              ALTER TABLE sf_head_movements ADD COLUMN line_id BIGINT;
              ALTER TABLE sf_head_movements ADD CONSTRAINT fk_sf_head_move_line FOREIGN KEY (tenant_id, line_id) REFERENCES sf_flock_lines (tenant_id, id);

              INSERT INTO sf_flock_lines (tenant_id, group_id, species, variety)
                SELECT tenant_id, id, species, strain FROM sf_animal_groups WHERE species <> 'CATTLE' ORDER BY id;
              UPDATE sf_head_movements m SET line_id = l.id FROM sf_flock_lines l WHERE l.tenant_id = m.tenant_id AND l.group_id = m.group_id;

              ALTER TABLE sf_flock_lines ENABLE ROW LEVEL SECURITY;
              ALTER TABLE sf_flock_lines FORCE ROW LEVEL SECURITY;
              CREATE POLICY sf_tenant_isolation ON sf_flock_lines
                USING ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()))
                WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()));
      rollback:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE sf_head_movements DROP CONSTRAINT fk_sf_head_move_line;
              ALTER TABLE sf_head_movements DROP COLUMN line_id;
              DROP TABLE sf_flock_lines;
