databaseChangeLog:
  - changeSet:
      id: 062-batch-day-lines
      author: smartfarm360
      comment: >-
        The daily record by variety (bin and batch varieties design, V5): deaths, culls, eggs laid and the owner's rate
        for an egg that day, one row per variety of the batch. Eggs at these rates count in the batch's profit.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE sf_batch_day_lines (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                batch_day_id BIGINT NOT NULL,
                line_id BIGINT NOT NULL,
                deaths INT NOT NULL DEFAULT 0 CHECK (deaths >= 0),
                culls INT NOT NULL DEFAULT 0 CHECK (culls >= 0),
                eggs INT NOT NULL DEFAULT 0 CHECK (eggs >= 0),
                egg_rate NUMERIC(10, 2) CHECK (egg_rate >= 0),
                CONSTRAINT uq_sf_batch_day_line_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_batch_day_line UNIQUE (tenant_id, batch_day_id, line_id),
                CONSTRAINT fk_sf_batch_day_line_day FOREIGN KEY (tenant_id, batch_day_id) REFERENCES sf_batch_days (tenant_id, id) ON DELETE CASCADE,
                CONSTRAINT fk_sf_batch_day_line_line FOREIGN KEY (tenant_id, line_id) REFERENCES sf_flock_lines (tenant_id, id) ON DELETE CASCADE
              );
              ALTER TABLE sf_batch_day_lines ENABLE ROW LEVEL SECURITY;
              ALTER TABLE sf_batch_day_lines FORCE ROW LEVEL SECURITY;
              CREATE POLICY sf_tenant_isolation ON sf_batch_day_lines
                USING ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()))
                WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR tenant_id IS NULL OR tenant_id = (SELECT sf_rls_tenant()));
      rollback:
        - sql:
            sql: DROP TABLE sf_batch_day_lines;
