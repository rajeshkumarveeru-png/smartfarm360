databaseChangeLog:
  # Phase 2 platform foundation. Forward-only; see docs/adr/0006-database-migration-policy.md.
  - changeSet:
      id: 028-platform-schema
      author: smartfarm360
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- Users: platform role, language, lockout and password-change tracking
              ALTER TABLE sf_users ADD COLUMN platform_role VARCHAR(30);
              ALTER TABLE sf_users ADD CONSTRAINT ck_sf_user_platform_role CHECK (platform_role IN ('PLATFORM_ADMIN'));
              ALTER TABLE sf_users ADD COLUMN preferred_language VARCHAR(5) NOT NULL DEFAULT 'en';
              ALTER TABLE sf_users ADD CONSTRAINT ck_sf_user_language CHECK (preferred_language IN ('en', 'ta'));
              ALTER TABLE sf_users ADD COLUMN failed_login_attempts INTEGER NOT NULL DEFAULT 0;
              ALTER TABLE sf_users ADD COLUMN locked_until TIMESTAMP WITH TIME ZONE;
              ALTER TABLE sf_users ADD COLUMN password_changed_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP;
              ALTER TABLE sf_users ADD COLUMN updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP;

              -- Tenants: plan placeholder for future entitlements (no billing), language check
              ALTER TABLE sf_tenants ADD COLUMN plan_code VARCHAR(30) NOT NULL DEFAULT 'FREE';
              ALTER TABLE sf_tenants ADD COLUMN updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP;
              ALTER TABLE sf_tenants ADD CONSTRAINT ck_sf_tenant_language CHECK (preferred_language IN ('en', 'ta'));

              ALTER TABLE sf_tenant_memberships ADD COLUMN updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP;
              ALTER TABLE sf_tenant_memberships ADD CONSTRAINT uq_sf_membership_tenant_id UNIQUE (tenant_id, id);

              ALTER TABLE sf_farms ADD COLUMN updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP;
              ALTER TABLE sf_land_parcels ADD COLUMN updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP;
              ALTER TABLE sf_land_parcels ADD CONSTRAINT ck_sf_parcel_area_positive CHECK (area > 0);
              -- A parcel's farm must belong to the parcel's tenant
              ALTER TABLE sf_land_parcels ADD CONSTRAINT fk_sf_parcel_farm_tenant
                FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id);

              -- Permissions and roles. System roles have tenant_id NULL; tenant-defined roles are a future feature.
              CREATE TABLE sf_permissions (
                code VARCHAR(80) PRIMARY KEY,
                description VARCHAR(200) NOT NULL
              );
              CREATE TABLE sf_roles (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT REFERENCES sf_tenants (id),
                code VARCHAR(40) NOT NULL,
                name VARCHAR(120) NOT NULL,
                system_role BOOLEAN NOT NULL DEFAULT FALSE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_role_tenant_code UNIQUE NULLS NOT DISTINCT (tenant_id, code),
                CONSTRAINT ck_sf_role_system_global CHECK (NOT system_role OR tenant_id IS NULL)
              );
              CREATE TABLE sf_role_permissions (
                role_id BIGINT NOT NULL REFERENCES sf_roles (id),
                permission_code VARCHAR(80) NOT NULL REFERENCES sf_permissions (code),
                PRIMARY KEY (role_id, permission_code)
              );
              CREATE TABLE sf_membership_roles (
                membership_id BIGINT NOT NULL REFERENCES sf_tenant_memberships (id),
                role_id BIGINT NOT NULL REFERENCES sf_roles (id),
                PRIMARY KEY (membership_id, role_id)
              );
              CREATE INDEX ix_sf_membership_roles_role ON sf_membership_roles (role_id);

              -- Authentication tokens: only SHA-256 hashes are stored
              CREATE TABLE sf_refresh_tokens (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                user_id BIGINT NOT NULL REFERENCES sf_users (id),
                family_id UUID NOT NULL,
                token_hash VARCHAR(64) NOT NULL,
                issued_at TIMESTAMP WITH TIME ZONE NOT NULL,
                expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
                revoked_at TIMESTAMP WITH TIME ZONE,
                revoke_reason VARCHAR(30),
                replaced_by_id BIGINT REFERENCES sf_refresh_tokens (id),
                CONSTRAINT uq_sf_refresh_token_hash UNIQUE (token_hash)
              );
              CREATE INDEX ix_sf_refresh_token_user ON sf_refresh_tokens (user_id);
              CREATE INDEX ix_sf_refresh_token_family ON sf_refresh_tokens (family_id);

              CREATE TABLE sf_password_reset_tokens (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                user_id BIGINT NOT NULL REFERENCES sf_users (id),
                token_hash VARCHAR(64) NOT NULL,
                expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
                used_at TIMESTAMP WITH TIME ZONE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_reset_token_hash UNIQUE (token_hash)
              );
              CREATE INDEX ix_sf_reset_token_user ON sf_password_reset_tokens (user_id);

              -- Invitations to join a tenant
              CREATE TABLE sf_invitations (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                email VARCHAR(254) NOT NULL,
                token_hash VARCHAR(64) NOT NULL,
                invited_by_user_id BIGINT NOT NULL REFERENCES sf_users (id),
                accepted_by_user_id BIGINT REFERENCES sf_users (id),
                expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
                accepted_at TIMESTAMP WITH TIME ZONE,
                revoked_at TIMESTAMP WITH TIME ZONE,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_invitation_token_hash UNIQUE (token_hash),
                CONSTRAINT uq_sf_invitation_tenant_id UNIQUE (tenant_id, id)
              );
              CREATE INDEX ix_sf_invitation_tenant ON sf_invitations (tenant_id, created_at);
              CREATE TABLE sf_invitation_roles (
                invitation_id BIGINT NOT NULL REFERENCES sf_invitations (id),
                role_id BIGINT NOT NULL REFERENCES sf_roles (id),
                PRIMARY KEY (invitation_id, role_id)
              );

              -- Tenant settings and enabled modules
              CREATE TABLE sf_tenant_settings (
                tenant_id BIGINT PRIMARY KEY REFERENCES sf_tenants (id),
                timezone VARCHAR(60) NOT NULL DEFAULT 'Asia/Kolkata',
                currency_code VARCHAR(3) NOT NULL DEFAULT 'INR',
                area_unit VARCHAR(20) NOT NULL DEFAULT 'ACRE',
                weight_unit VARCHAR(20) NOT NULL DEFAULT 'KG',
                volume_unit VARCHAR(20) NOT NULL DEFAULT 'LITRE',
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT ck_sf_settings_area_unit CHECK (area_unit IN ('ACRE', 'HECTARE', 'CENT', 'SQFT')),
                CONSTRAINT ck_sf_settings_weight_unit CHECK (weight_unit IN ('KG', 'QUINTAL', 'TONNE')),
                CONSTRAINT ck_sf_settings_volume_unit CHECK (volume_unit IN ('LITRE')),
                CONSTRAINT ck_sf_settings_currency CHECK (currency_code IN ('INR'))
              );
              CREATE TABLE sf_tenant_modules (
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                module_code VARCHAR(30) NOT NULL,
                enabled BOOLEAN NOT NULL,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                PRIMARY KEY (tenant_id, module_code),
                CONSTRAINT ck_sf_tenant_module_code CHECK (module_code IN
                  ('CROP', 'DAIRY', 'POULTRY', 'GOAT_SHEEP', 'AQUACULTURE', 'ORGANIC', 'PROCESSING', 'WORKFORCE', 'ASSETS'))
              );

              -- Audit history (tenant_id NULL for platform-level events)
              CREATE TABLE sf_audit_history (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT REFERENCES sf_tenants (id),
                actor_user_id BIGINT REFERENCES sf_users (id),
                action VARCHAR(80) NOT NULL,
                entity_type VARCHAR(60) NOT NULL,
                entity_id VARCHAR(60),
                details JSONB NOT NULL DEFAULT '{}'::jsonb,
                correlation_id VARCHAR(64),
                occurred_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX ix_sf_audit_tenant_time ON sf_audit_history (tenant_id, occurred_at DESC);
      rollback:
        - sql:
            sql: |
              DROP TABLE sf_audit_history; DROP TABLE sf_tenant_modules; DROP TABLE sf_tenant_settings;
              DROP TABLE sf_invitation_roles; DROP TABLE sf_invitations; DROP TABLE sf_password_reset_tokens;
              DROP TABLE sf_refresh_tokens; DROP TABLE sf_membership_roles; DROP TABLE sf_role_permissions;
              DROP TABLE sf_roles; DROP TABLE sf_permissions;
              ALTER TABLE sf_land_parcels DROP CONSTRAINT fk_sf_parcel_farm_tenant;
              ALTER TABLE sf_land_parcels DROP CONSTRAINT ck_sf_parcel_area_positive;
              ALTER TABLE sf_land_parcels DROP COLUMN updated_at;
              ALTER TABLE sf_farms DROP COLUMN updated_at;
              ALTER TABLE sf_tenant_memberships DROP CONSTRAINT uq_sf_membership_tenant_id;
              ALTER TABLE sf_tenant_memberships DROP COLUMN updated_at;
              ALTER TABLE sf_tenants DROP CONSTRAINT ck_sf_tenant_language;
              ALTER TABLE sf_tenants DROP COLUMN updated_at; ALTER TABLE sf_tenants DROP COLUMN plan_code;
              ALTER TABLE sf_users DROP CONSTRAINT ck_sf_user_language; ALTER TABLE sf_users DROP CONSTRAINT ck_sf_user_platform_role;
              ALTER TABLE sf_users DROP COLUMN updated_at; ALTER TABLE sf_users DROP COLUMN password_changed_at;
              ALTER TABLE sf_users DROP COLUMN locked_until; ALTER TABLE sf_users DROP COLUMN failed_login_attempts;
              ALTER TABLE sf_users DROP COLUMN preferred_language; ALTER TABLE sf_users DROP COLUMN platform_role;

  - changeSet:
      id: 029-platform-seed-rbac
      author: smartfarm360
      comment: System permissions and roles. Must match com.smartfarm360.platform.rbac.Permission and RoleCode.
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO sf_permissions (code, description) VALUES
                ('TENANT_READ', 'View the farm business profile, settings and modules'),
                ('TENANT_MANAGE', 'Change the farm business profile, settings and modules'),
                ('MEMBERS_READ', 'View members and invitations'),
                ('MEMBERS_MANAGE', 'Invite, remove and change roles of members'),
                ('AUDIT_READ', 'View the audit history'),
                ('FARM_READ', 'View farms and land parcels'),
                ('FARM_WRITE', 'Create and change farms and land parcels'),
                ('CROP_READ', 'View crops, seasons, cultivation cycles, activities and harvests'),
                ('CROP_WRITE', 'Create and change crops, varieties, seasons and cultivation cycles'),
                ('CROP_ACTIVITY_WRITE', 'Record field activities and harvests'),
                ('FINANCE_READ', 'View income, expenses and financial summaries'),
                ('FINANCE_WRITE', 'Record income and expenses'),
                ('INVENTORY_READ', 'View suppliers, stock items and purchases'),
                ('INVENTORY_WRITE', 'Create suppliers and stock items and record purchases');

              INSERT INTO sf_roles (code, name, system_role) VALUES
                ('TENANT_OWNER', 'Owner', TRUE),
                ('FARM_ADMIN', 'Farm administrator', TRUE),
                ('FARM_MANAGER', 'Farm manager', TRUE),
                ('ACCOUNTANT', 'Accountant', TRUE),
                ('FIELD_SUPERVISOR', 'Field supervisor', TRUE),
                ('WORKER', 'Worker', TRUE),
                ('VIEWER', 'Read-only viewer', TRUE);

              INSERT INTO sf_role_permissions (role_id, permission_code)
              SELECT r.id, p.code FROM sf_roles r CROSS JOIN sf_permissions p
              WHERE r.tenant_id IS NULL AND r.code IN ('TENANT_OWNER', 'FARM_ADMIN');

              INSERT INTO sf_role_permissions (role_id, permission_code)
              SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN (
                'TENANT_READ', 'MEMBERS_READ', 'FARM_READ', 'FARM_WRITE', 'CROP_READ', 'CROP_WRITE', 'CROP_ACTIVITY_WRITE',
                'FINANCE_READ', 'FINANCE_WRITE', 'INVENTORY_READ', 'INVENTORY_WRITE')
              WHERE r.tenant_id IS NULL AND r.code = 'FARM_MANAGER';

              INSERT INTO sf_role_permissions (role_id, permission_code)
              SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN (
                'TENANT_READ', 'AUDIT_READ', 'FARM_READ', 'CROP_READ', 'FINANCE_READ', 'FINANCE_WRITE', 'INVENTORY_READ', 'INVENTORY_WRITE')
              WHERE r.tenant_id IS NULL AND r.code = 'ACCOUNTANT';

              INSERT INTO sf_role_permissions (role_id, permission_code)
              SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN (
                'TENANT_READ', 'FARM_READ', 'CROP_READ', 'CROP_WRITE', 'CROP_ACTIVITY_WRITE', 'INVENTORY_READ')
              WHERE r.tenant_id IS NULL AND r.code = 'FIELD_SUPERVISOR';

              INSERT INTO sf_role_permissions (role_id, permission_code)
              SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN (
                'TENANT_READ', 'FARM_READ', 'CROP_READ', 'CROP_ACTIVITY_WRITE')
              WHERE r.tenant_id IS NULL AND r.code = 'WORKER';

              INSERT INTO sf_role_permissions (role_id, permission_code)
              SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN (
                'TENANT_READ', 'FARM_READ', 'CROP_READ', 'FINANCE_READ', 'INVENTORY_READ')
              WHERE r.tenant_id IS NULL AND r.code = 'VIEWER';
      rollback:
        - sql:
            sql: DELETE FROM sf_role_permissions; DELETE FROM sf_roles WHERE tenant_id IS NULL; DELETE FROM sf_permissions;

  - changeSet:
      id: 030-platform-backfill
      author: smartfarm360
      comment: >
        Map legacy free-text membership roles to system roles (OWNER, ADMIN and FARM_MANAGER could write everything,
        which TENANT_OWNER, FARM_ADMIN and FARM_MANAGER preserve; anything else becomes read-only). The legacy
        sf_tenant_memberships.role column is kept (nullable) for one release and is no longer read.
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO sf_membership_roles (membership_id, role_id)
              SELECT m.id, r.id FROM sf_tenant_memberships m
              JOIN sf_roles r ON r.tenant_id IS NULL AND r.code = CASE upper(m.role)
                WHEN 'OWNER' THEN 'TENANT_OWNER'
                WHEN 'ADMIN' THEN 'FARM_ADMIN'
                WHEN 'FARM_MANAGER' THEN 'FARM_MANAGER'
                ELSE 'VIEWER' END;
              ALTER TABLE sf_tenant_memberships ALTER COLUMN role DROP NOT NULL;

              INSERT INTO sf_tenant_settings (tenant_id) SELECT id FROM sf_tenants;
              -- Existing tenants already used crop features, so keep the crop module on for them.
              INSERT INTO sf_tenant_modules (tenant_id, module_code, enabled) SELECT id, 'CROP', TRUE FROM sf_tenants;
      rollback:
        - sql:
            sql: >
              DELETE FROM sf_tenant_modules; DELETE FROM sf_tenant_settings; DELETE FROM sf_membership_roles;
              UPDATE sf_tenant_memberships SET role = 'VIEWER' WHERE role IS NULL;
              ALTER TABLE sf_tenant_memberships ALTER COLUMN role SET NOT NULL;
