databaseChangeLog:
  # Phase 5 crop management v2. See docs/crops/crop-management.md (approved 2026-10-20). Forward-only.
  - changeSet:
      id: 038-crop-v2-schema
      author: smartfarm360
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- Cycle stages (F1): Planned, Growing, Harvesting, Closed, Cancelled
              ALTER TABLE sf_cultivation_cycles ADD COLUMN actual_sowing_date DATE;
              ALTER TABLE sf_cultivation_cycles ADD COLUMN closed_on DATE;
              ALTER TABLE sf_cultivation_cycles ADD COLUMN expected_yield NUMERIC(18, 4) CHECK (expected_yield > 0);
              ALTER TABLE sf_cultivation_cycles ADD COLUMN harvest_count INTEGER NOT NULL DEFAULT 0;
              ALTER TABLE sf_cultivation_cycles ADD COLUMN updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP;
              UPDATE sf_cultivation_cycles SET closed_on = coalesce(expected_harvest_date, current_date) WHERE status = 'COMPLETED';
              UPDATE sf_cultivation_cycles SET status = CASE status WHEN 'IN_PROGRESS' THEN 'GROWING' WHEN 'COMPLETED' THEN 'CLOSED'
                WHEN 'CANCELLED' THEN 'CANCELLED' ELSE 'PLANNED' END;
              ALTER TABLE sf_cultivation_cycles ADD CONSTRAINT ck_sf_cycle_status
                CHECK (status IN ('PLANNED', 'GROWING', 'HARVESTING', 'CLOSED', 'CANCELLED'));
              ALTER TABLE sf_cultivation_cycles ADD CONSTRAINT ck_sf_cycle_closed CHECK ((status = 'CLOSED') = (closed_on IS NOT NULL));
              UPDATE sf_cultivation_cycles SET cultivated_area = NULL WHERE cultivated_area <= 0;
              ALTER TABLE sf_cultivation_cycles ADD CONSTRAINT ck_sf_cycle_area CHECK (cultivated_area IS NULL OR cultivated_area > 0);

              -- The stock item a crop's harvest goes into
              ALTER TABLE sf_crop_masters ADD COLUMN produce_item_id BIGINT;
              ALTER TABLE sf_crop_masters ADD CONSTRAINT fk_sf_crop_produce_item FOREIGN KEY (tenant_id, produce_item_id)
                REFERENCES sf_stock_items (tenant_id, id);

              -- Activities: the stock use and bill they created; Phase 1 rows keep cost as a memo (D7)
              ALTER TABLE sf_farm_activities ADD COLUMN stock_document_id BIGINT;
              ALTER TABLE sf_farm_activities ADD COLUMN bill_document_id BIGINT;
              ALTER TABLE sf_farm_activities ADD COLUMN workers INTEGER CHECK (workers >= 0);
              ALTER TABLE sf_farm_activities ADD COLUMN hours NUMERIC(8, 2) CHECK (hours >= 0);
              ALTER TABLE sf_farm_activities ADD COLUMN legacy_memo BOOLEAN NOT NULL DEFAULT FALSE;
              ALTER TABLE sf_farm_activities ADD COLUMN status VARCHAR(10) NOT NULL DEFAULT 'ACTIVE' CHECK (status IN ('ACTIVE', 'REVERSED'));
              ALTER TABLE sf_farm_activities ADD COLUMN idempotency_key VARCHAR(100);
              ALTER TABLE sf_farm_activities ADD COLUMN request_hash VARCHAR(64);
              ALTER TABLE sf_farm_activities ADD COLUMN created_by BIGINT REFERENCES sf_users (id);
              ALTER TABLE sf_farm_activities ADD COLUMN updated_at TIMESTAMP WITH TIME ZONE;
              ALTER TABLE sf_farm_activities ADD COLUMN updated_by BIGINT REFERENCES sf_users (id);
              ALTER TABLE sf_farm_activities ADD CONSTRAINT uq_sf_activity_tenant_id UNIQUE (tenant_id, id);
              ALTER TABLE sf_farm_activities ADD CONSTRAINT uq_sf_activity_idempotency UNIQUE (tenant_id, idempotency_key);
              ALTER TABLE sf_farm_activities ADD CONSTRAINT fk_sf_activity_stock_doc FOREIGN KEY (tenant_id, stock_document_id)
                REFERENCES sf_finance_documents (tenant_id, id);
              ALTER TABLE sf_farm_activities ADD CONSTRAINT fk_sf_activity_bill_doc FOREIGN KEY (tenant_id, bill_document_id)
                REFERENCES sf_finance_documents (tenant_id, id);
              UPDATE sf_farm_activities SET legacy_memo = TRUE;

              -- Harvests: the farm-produce record and lot they created; Phase 1 rows stay history only (F4)
              ALTER TABLE sf_harvest_records ADD COLUMN item_id BIGINT;
              ALTER TABLE sf_harvest_records ADD COLUMN base_quantity NUMERIC(18, 4);
              ALTER TABLE sf_harvest_records ADD COLUMN lot_id BIGINT;
              ALTER TABLE sf_harvest_records ADD COLUMN document_id BIGINT;
              ALTER TABLE sf_harvest_records ADD COLUMN grade VARCHAR(40);
              ALTER TABLE sf_harvest_records ADD COLUMN moisture_pct NUMERIC(5, 2) CHECK (moisture_pct >= 0 AND moisture_pct <= 100);
              ALTER TABLE sf_harvest_records ADD COLUMN legacy BOOLEAN NOT NULL DEFAULT FALSE;
              ALTER TABLE sf_harvest_records ADD COLUMN status VARCHAR(10) NOT NULL DEFAULT 'ACTIVE' CHECK (status IN ('ACTIVE', 'REVERSED'));
              ALTER TABLE sf_harvest_records ADD COLUMN idempotency_key VARCHAR(100);
              ALTER TABLE sf_harvest_records ADD COLUMN request_hash VARCHAR(64);
              ALTER TABLE sf_harvest_records ADD COLUMN created_by BIGINT REFERENCES sf_users (id);
              ALTER TABLE sf_harvest_records ADD CONSTRAINT uq_sf_harvest_idempotency UNIQUE (tenant_id, idempotency_key);
              ALTER TABLE sf_harvest_records ADD CONSTRAINT fk_sf_harvest_item FOREIGN KEY (tenant_id, item_id) REFERENCES sf_stock_items (tenant_id, id);
              ALTER TABLE sf_harvest_records ADD CONSTRAINT fk_sf_harvest_lot FOREIGN KEY (tenant_id, lot_id) REFERENCES sf_stock_lots (tenant_id, id);
              ALTER TABLE sf_harvest_records ADD CONSTRAINT fk_sf_harvest_doc FOREIGN KEY (tenant_id, document_id)
                REFERENCES sf_finance_documents (tenant_id, id);
              UPDATE sf_harvest_records SET legacy = TRUE;
              ALTER TABLE sf_harvest_records ADD CONSTRAINT ck_sf_harvest_stock CHECK (legacy OR (item_id IS NOT NULL AND base_quantity > 0 AND document_id IS NOT NULL));

              -- A lot produced by a harvest remembers its activity, so sales from it default to that cycle (F5)
              ALTER TABLE sf_stock_lots ADD COLUMN cost_object_id BIGINT;
              ALTER TABLE sf_stock_lots ADD CONSTRAINT fk_sf_lot_cost_object FOREIGN KEY (tenant_id, cost_object_id)
                REFERENCES sf_cost_objects (tenant_id, id);

              -- Cost objects carry what overhead allocation needs (F6): area in acres and the dates the activity ran
              ALTER TABLE sf_cost_objects ADD COLUMN area_acres NUMERIC(14, 4) CHECK (area_acres > 0);
              ALTER TABLE sf_cost_objects ADD COLUMN active_from DATE;
              ALTER TABLE sf_cost_objects ADD COLUMN active_to DATE;

              -- Pest, disease and other field observations (F9)
              CREATE TABLE sf_crop_observations (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                cycle_id BIGINT NOT NULL,
                observed_on DATE NOT NULL,
                kind VARCHAR(20) NOT NULL CHECK (kind IN ('PEST', 'DISEASE', 'NUTRIENT', 'WEED', 'WATER_STRESS', 'OTHER')),
                severity VARCHAR(10) NOT NULL CHECK (severity IN ('LOW', 'MEDIUM', 'HIGH')),
                field_part VARCHAR(120),
                notes VARCHAR(1000),
                action_taken VARCHAR(500),
                activity_id BIGINT,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE,
                CONSTRAINT fk_sf_observation_cycle FOREIGN KEY (tenant_id, cycle_id) REFERENCES sf_cultivation_cycles (tenant_id, id),
                CONSTRAINT fk_sf_observation_activity FOREIGN KEY (tenant_id, activity_id) REFERENCES sf_farm_activities (tenant_id, id)
              );
              CREATE INDEX ix_sf_observation_cycle ON sf_crop_observations (tenant_id, cycle_id, observed_on DESC);

              -- Farmer-entered weather (F10): one note per farm per day
              CREATE TABLE sf_weather_notes (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                farm_id BIGINT NOT NULL,
                note_date DATE NOT NULL,
                rainfall_mm NUMERIC(6, 1) CHECK (rainfall_mm >= 0),
                notes VARCHAR(500),
                created_by BIGINT REFERENCES sf_users (id),
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_weather_day UNIQUE (tenant_id, farm_id, note_date),
                CONSTRAINT fk_sf_weather_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT ck_sf_weather_content CHECK (rainfall_mm IS NOT NULL OR notes IS NOT NULL)
              );

              -- Overhead allocation records (P16)
              ALTER TABLE sf_finance_documents DROP CONSTRAINT ck_sf_doc_type;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT ck_sf_doc_type CHECK (doc_type IN ('BILL', 'SALE', 'PAYMENT', 'RECEIPT',
                'TRANSFER', 'OWNER_IN', 'OWNER_OUT', 'LOAN_RECEIVED', 'LOAN_REPAYMENT', 'SETTLEMENT', 'WRITE_OFF', 'OPENING_BALANCE',
                'DEPRECIATION', 'STOCK_ISSUE', 'STOCK_TRANSFER', 'WASTAGE', 'STOCK_COUNT', 'PRODUCE_RECEIPT', 'PURCHASE_RETURN', 'SALE_RETURN',
                'ALLOCATION'));
              ALTER TABLE sf_finance_documents ADD COLUMN period_from DATE;
              ALTER TABLE sf_finance_documents ADD COLUMN period_to DATE;
              ALTER TABLE sf_finance_documents ADD CONSTRAINT ck_sf_doc_period CHECK ((doc_type = 'ALLOCATION') = (period_from IS NOT NULL AND period_to IS NOT NULL)
                AND (period_to IS NULL OR period_to >= period_from));
      rollback:
        - sql:
            sql: >
              ALTER TABLE sf_finance_documents DROP CONSTRAINT ck_sf_doc_period, DROP COLUMN period_to, DROP COLUMN period_from;
              DROP TABLE sf_weather_notes; DROP TABLE sf_crop_observations;
              ALTER TABLE sf_cost_objects DROP COLUMN active_to, DROP COLUMN active_from, DROP COLUMN area_acres;
              ALTER TABLE sf_stock_lots DROP CONSTRAINT fk_sf_lot_cost_object, DROP COLUMN cost_object_id;

  - changeSet:
      id: 039-crop-v2-backfill
      author: smartfarm360
      comment: >
        Gives existing crop cycles' cost objects their area (in acres) and dates for overhead allocation, and verifies that
        Phase 1 crop records kept their counts and memo values. Nothing is posted or put into stock.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TEMPORARY TABLE tmp_sf_crop_before ON COMMIT DROP AS
                SELECT (SELECT count(*) FROM sf_farm_activities) AS activities, (SELECT coalesce(sum(cost), 0) FROM sf_farm_activities) AS activity_cost,
                       (SELECT count(*) FROM sf_harvest_records) AS harvests, (SELECT coalesce(sum(sale_value), 0) FROM sf_harvest_records) AS harvest_value,
                       (SELECT count(*) FROM sf_journal_lines) AS journal_lines, (SELECT count(*) FROM sf_stock_movements) AS movements;

              INSERT INTO sf_cost_objects (tenant_id, kind, name, crop_cycle_id, farm_id)
                SELECT c.tenant_id, 'CROP_CYCLE', c.name, c.id, c.farm_id FROM sf_cultivation_cycles c
                WHERE NOT EXISTS (SELECT 1 FROM sf_cost_objects o WHERE o.crop_cycle_id = c.id AND o.tenant_id = c.tenant_id);
              UPDATE sf_cost_objects o SET active_from = coalesce(c.actual_sowing_date, c.planned_sowing_date), active_to = c.closed_on,
                  active = c.status <> 'CANCELLED'
                FROM sf_cultivation_cycles c WHERE o.crop_cycle_id = c.id AND o.tenant_id = c.tenant_id;
              UPDATE sf_cost_objects o SET
                  area_acres = nullif(round(a.area * CASE a.unit WHEN 'HECTARE' THEN 2.4710538147 WHEN 'CENT' THEN 0.01 WHEN 'SQFT' THEN 1 / 43560.0 ELSE 1 END, 4), 0)
                FROM sf_cultivation_cycles c
                JOIN sf_land_parcels p ON p.id = c.land_parcel_id
                CROSS JOIN LATERAL (SELECT coalesce(c.cultivated_area, p.area) AS area,
                                           CASE WHEN c.cultivated_area IS NOT NULL THEN c.area_unit ELSE p.area_unit END AS unit) a
                WHERE o.crop_cycle_id = c.id AND o.tenant_id = c.tenant_id AND a.area > 0;
        - sql:
            splitStatements: false
            sql: |
              DO $$
              DECLARE b RECORD;
              BEGIN
                SELECT * INTO b FROM tmp_sf_crop_before;
                IF b.activities <> (SELECT count(*) FROM sf_farm_activities WHERE legacy_memo)
                   OR b.activity_cost <> (SELECT coalesce(sum(cost), 0) FROM sf_farm_activities)
                   OR b.harvests <> (SELECT count(*) FROM sf_harvest_records WHERE legacy)
                   OR b.harvest_value <> (SELECT coalesce(sum(sale_value), 0) FROM sf_harvest_records)
                   OR b.journal_lines <> (SELECT count(*) FROM sf_journal_lines)
                   OR b.movements <> (SELECT count(*) FROM sf_stock_movements)
                   OR EXISTS (SELECT 1 FROM sf_cost_objects WHERE kind = 'CROP_CYCLE' AND active_from IS NULL) THEN
                  RAISE EXCEPTION 'Crop v2 migration verification failed';
                END IF;
              END;
              $$
