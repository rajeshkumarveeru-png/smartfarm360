databaseChangeLog:
  - changeSet:
      id: 062-poultry-hatching
      author: smartfarm360
      comment: Incubation batches and hatch results; successful chicks are posted as BORN head movements.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE sf_poultry_hatches (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants(id),
                group_id BIGINT NOT NULL,
                line_id BIGINT NOT NULL,
                collected_on DATE NOT NULL,
                incubated_on DATE NOT NULL,
                expected_on DATE,
                eggs INT NOT NULL CHECK (eggs > 0),
                fertile INT CHECK (fertile >= 0),
                hatched INT CHECK (hatched >= 0),
                failed INT CHECK (failed >= 0),
                result_on DATE,
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users(id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_poultry_hatch_tenant_id UNIQUE (tenant_id,id),
                CONSTRAINT fk_sf_poultry_hatch_group FOREIGN KEY (tenant_id,group_id) REFERENCES sf_animal_groups(tenant_id,id),
                CONSTRAINT fk_sf_poultry_hatch_line FOREIGN KEY (tenant_id,line_id) REFERENCES sf_flock_lines(tenant_id,id),
                CONSTRAINT ck_sf_poultry_hatch_dates CHECK (incubated_on >= collected_on AND (expected_on IS NULL OR expected_on >= incubated_on)),
                CONSTRAINT ck_sf_poultry_hatch_result CHECK (
                  (result_on IS NULL AND fertile IS NULL AND hatched IS NULL AND failed IS NULL)
                  OR (result_on IS NOT NULL AND fertile IS NOT NULL AND hatched IS NOT NULL AND failed IS NOT NULL
                      AND fertile <= eggs AND hatched <= fertile AND failed <= eggs - hatched)
                )
              );
              CREATE INDEX ix_sf_poultry_hatch_group ON sf_poultry_hatches(tenant_id,group_id,incubated_on DESC);
              ALTER TABLE sf_poultry_hatches ENABLE ROW LEVEL SECURITY;
              ALTER TABLE sf_poultry_hatches FORCE ROW LEVEL SECURITY;
              CREATE POLICY sf_tenant_isolation ON sf_poultry_hatches
                USING ((SELECT sf_rls_tenant()) IS NULL OR tenant_id = (SELECT sf_rls_tenant()))
                WITH CHECK ((SELECT sf_rls_tenant()) IS NULL OR tenant_id = (SELECT sf_rls_tenant()));
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DROP TABLE sf_poultry_hatches;
