databaseChangeLog:
  # Phase 12 processing and trading. See docs/processing/processing-and-trading.md (approved 2026-10-21). Forward-only.
  - changeSet:
      id: 051-processing-schema
      author: smartfarm360
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- Processing batches are cost objects (M1)
              ALTER TABLE sf_cost_objects DROP CONSTRAINT ck_sf_cost_object_kind;
              ALTER TABLE sf_cost_objects ADD CONSTRAINT ck_sf_cost_object_kind CHECK (kind IN ('OVERHEAD', 'CROP_CYCLE', 'ANIMAL_GROUP', 'POND_CYCLE',
                'ORGANIC_BATCH', 'PROCESSING_BATCH'));

              CREATE TABLE sf_processing_batches (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                cost_object_id BIGINT NOT NULL,
                code VARCHAR(30) NOT NULL,
                kind VARCHAR(12) NOT NULL CHECK (kind IN ('GRADING', 'DRYING', 'MILLING', 'PRESSING', 'PACKING', 'OTHER')),
                farm_id BIGINT NOT NULL,
                main_item_id BIGINT NOT NULL,
                started_on DATE NOT NULL,
                expected_end DATE,
                finished_on DATE,
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_processing_batch_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_processing_batch_cost_object UNIQUE (tenant_id, cost_object_id),
                CONSTRAINT fk_sf_processing_batch_cost_object FOREIGN KEY (tenant_id, cost_object_id) REFERENCES sf_cost_objects (tenant_id, id),
                CONSTRAINT fk_sf_processing_batch_farm FOREIGN KEY (tenant_id, farm_id) REFERENCES sf_farms (tenant_id, id),
                CONSTRAINT fk_sf_processing_batch_item FOREIGN KEY (tenant_id, main_item_id) REFERENCES sf_stock_items (tenant_id, id),
                CONSTRAINT ck_sf_processing_batch_dates CHECK ((expected_end IS NULL OR expected_end >= started_on) AND (finished_on IS NULL OR finished_on >= started_on))
              );
              CREATE UNIQUE INDEX uq_sf_processing_batch_code ON sf_processing_batches (tenant_id, upper(code));

              -- The step log (M4): a record that does not move stock
              CREATE TABLE sf_processing_steps (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                batch_id BIGINT NOT NULL,
                step_date DATE NOT NULL,
                kind VARCHAR(10) NOT NULL CHECK (kind IN ('CLEANING', 'DRYING', 'GRADING', 'MILLING', 'PRESSING', 'PACKING', 'OTHER')),
                kg_in NUMERIC(12, 3) CHECK (kg_in > 0),
                kg_out NUMERIC(12, 3) CHECK (kg_out >= 0),
                moisture_before NUMERIC(5, 2) CHECK (moisture_before BETWEEN 0 AND 100),
                moisture_after NUMERIC(5, 2) CHECK (moisture_after BETWEEN 0 AND 100),
                grade VARCHAR(60),
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_processing_step_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_processing_step_batch FOREIGN KEY (tenant_id, batch_id) REFERENCES sf_processing_batches (tenant_id, id)
              );

              -- Output by role (M5): products and byproducts into stock, waste in kg only
              CREATE TABLE sf_processing_outputs (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                batch_id BIGINT NOT NULL,
                output_date DATE NOT NULL,
                role VARCHAR(10) NOT NULL CHECK (role IN ('MAIN', 'BYPRODUCT', 'WASTE')),
                item_id BIGINT,
                description VARCHAR(120),
                quantity NUMERIC(14, 4) NOT NULL CHECK (quantity > 0),
                kg NUMERIC(14, 3) CHECK (kg >= 0),
                grade VARCHAR(60),
                lot_no VARCHAR(60),
                document_id BIGINT,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_processing_output_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_processing_output_batch FOREIGN KEY (tenant_id, batch_id) REFERENCES sf_processing_batches (tenant_id, id),
                CONSTRAINT fk_sf_processing_output_item FOREIGN KEY (tenant_id, item_id) REFERENCES sf_stock_items (tenant_id, id),
                CONSTRAINT fk_sf_processing_output_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT ck_sf_processing_output_role CHECK ((role = 'WASTE') = (document_id IS NULL) AND (role = 'WASTE' OR item_id IS NOT NULL)
                  AND (role <> 'WASTE' OR description IS NOT NULL))
              );
              CREATE INDEX ix_sf_processing_output_batch ON sf_processing_outputs (tenant_id, batch_id);
      rollback:
        - sql:
            sql: >
              DROP TABLE sf_processing_outputs; DROP TABLE sf_processing_steps; DROP TABLE sf_processing_batches;
              ALTER TABLE sf_cost_objects DROP CONSTRAINT ck_sf_cost_object_kind;
              ALTER TABLE sf_cost_objects ADD CONSTRAINT ck_sf_cost_object_kind CHECK (kind IN ('OVERHEAD', 'CROP_CYCLE', 'ANIMAL_GROUP', 'POND_CYCLE', 'ORGANIC_BATCH'));

  - changeSet:
      id: 052-processing-seed
      author: smartfarm360
      comment: The processing permissions and their role grants (M12). The module stays off.
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO sf_permissions (code, description) VALUES
                ('PROCESSING_READ', 'View processing batches, their output and lot traces'),
                ('PROCESSING_WRITE', 'Record processing batches, steps and output');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code IN ('PROCESSING_READ', 'PROCESSING_WRITE')
                WHERE r.tenant_id IS NULL AND r.code IN ('TENANT_OWNER', 'FARM_ADMIN', 'FARM_MANAGER', 'FIELD_SUPERVISOR', 'WORKER');
              INSERT INTO sf_role_permissions (role_id, permission_code)
                SELECT r.id, p.code FROM sf_roles r JOIN sf_permissions p ON p.code = 'PROCESSING_READ'
                WHERE r.tenant_id IS NULL AND r.code IN ('ACCOUNTANT', 'VIEWER');
      rollback:
        - sql:
            sql: >
              DELETE FROM sf_tenant_modules WHERE module_code = 'PROCESSING';
              DELETE FROM sf_role_permissions WHERE permission_code IN ('PROCESSING_READ', 'PROCESSING_WRITE');
              DELETE FROM sf_permissions WHERE code IN ('PROCESSING_READ', 'PROCESSING_WRITE');
