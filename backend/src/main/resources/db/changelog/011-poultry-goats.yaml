databaseChangeLog:
  # Phase 9 poultry, goats and sheep. See docs/livestock/poultry-goats-sheep.md (approved 2026-10-21). Forward-only.
  - changeSet:
      id: 045-poultry-goats-schema
      author: smartfarm360
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- Counted groups (J1, J2): species, placement and closing on the Phase 8 animal groups
              ALTER TABLE sf_animal_groups ADD COLUMN species VARCHAR(10) NOT NULL DEFAULT 'CATTLE'
                CONSTRAINT ck_sf_animal_group_species CHECK (species IN ('CATTLE', 'CHICKEN', 'GOAT', 'SHEEP'));
              ALTER TABLE sf_animal_groups ADD COLUMN placed_on DATE;
              ALTER TABLE sf_animal_groups ADD COLUMN age_at_placement_days INT CHECK (age_at_placement_days >= 0);
              ALTER TABLE sf_animal_groups ADD COLUMN strain VARCHAR(80);
              ALTER TABLE sf_animal_groups ADD COLUMN closed_on DATE;
              ALTER TABLE sf_animal_groups ALTER COLUMN purpose TYPE VARCHAR(16);
              ALTER TABLE sf_animal_groups DROP CONSTRAINT sf_animal_groups_purpose_check;
              ALTER TABLE sf_animal_groups ADD CONSTRAINT ck_sf_animal_group_purpose CHECK (purpose IN ('MILKING', 'DRY', 'HEIFER', 'CALF', 'BULL', 'OTHER',
                'LAYER', 'BROILER', 'COUNTRY', 'BREEDING_HERD', 'FATTENING', 'MIXED'));
              ALTER TABLE sf_animal_groups ADD CONSTRAINT ck_sf_animal_group_purpose_species CHECK (
                (species = 'CATTLE' AND purpose IN ('MILKING', 'DRY', 'HEIFER', 'CALF', 'BULL', 'OTHER'))
                OR (species = 'CHICKEN' AND purpose IN ('LAYER', 'BROILER', 'COUNTRY'))
                OR (species IN ('GOAT', 'SHEEP') AND purpose IN ('BREEDING_HERD', 'FATTENING', 'MIXED')));

              -- Goats and sheep can be recorded individually (J1, J10)
              ALTER TABLE sf_animals DROP CONSTRAINT sf_animals_species_check;
              ALTER TABLE sf_animals ADD CONSTRAINT ck_sf_animal_species CHECK (species IN ('COW', 'BUFFALO', 'GOAT', 'SHEEP'));

              -- Herd-level kidding and lambing (J10)
              ALTER TABLE sf_animal_events DROP CONSTRAINT sf_animal_events_kind_check;
              ALTER TABLE sf_animal_events ADD CONSTRAINT ck_sf_animal_event_kind CHECK (kind IN ('TREATMENT', 'VACCINATION', 'DEWORMING', 'HEALTH_OTHER',
                'HEAT', 'INSEMINATION', 'PREGNANCY_CHECK', 'CALVING', 'ABORTION', 'DRY_OFF', 'INSURANCE', 'KIDDING'));
              ALTER TABLE sf_animal_events ADD COLUMN born_alive INT CHECK (born_alive >= 0);
              ALTER TABLE sf_animal_events ADD COLUMN born_dead INT CHECK (born_dead >= 0);

              -- The daily batch record (J4)
              CREATE TABLE sf_batch_days (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                group_id BIGINT NOT NULL,
                day DATE NOT NULL,
                deaths INT NOT NULL DEFAULT 0 CHECK (deaths >= 0),
                death_cause VARCHAR(120),
                culls INT NOT NULL DEFAULT 0 CHECK (culls >= 0),
                eggs_good INT NOT NULL DEFAULT 0 CHECK (eggs_good >= 0),
                eggs_cracked INT NOT NULL DEFAULT 0 CHECK (eggs_cracked >= 0),
                eggs_broken INT NOT NULL DEFAULT 0 CHECK (eggs_broken >= 0),
                feed_item_id BIGINT,
                feed_kg NUMERIC(12, 3) CHECK (feed_kg > 0),
                feed_document_id BIGINT,
                weight_birds INT CHECK (weight_birds > 0),
                weight_kg NUMERIC(10, 3) CHECK (weight_kg > 0),
                notes VARCHAR(300),
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_batch_day_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_batch_day UNIQUE (tenant_id, group_id, day),
                CONSTRAINT fk_sf_batch_day_group FOREIGN KEY (tenant_id, group_id) REFERENCES sf_animal_groups (tenant_id, id),
                CONSTRAINT fk_sf_batch_day_feed_item FOREIGN KEY (tenant_id, feed_item_id) REFERENCES sf_stock_items (tenant_id, id),
                CONSTRAINT fk_sf_batch_day_feed_doc FOREIGN KEY (tenant_id, feed_document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT ck_sf_batch_day_feed CHECK ((feed_item_id IS NULL) = (feed_kg IS NULL)),
                CONSTRAINT ck_sf_batch_day_weight CHECK ((weight_birds IS NULL) = (weight_kg IS NULL))
              );

              -- Head counts change only through dated movements (J7)
              CREATE TABLE sf_head_movements (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                group_id BIGINT NOT NULL,
                move_date DATE NOT NULL,
                kind VARCHAR(10) NOT NULL CHECK (kind IN ('PLACED', 'BOUGHT', 'BORN', 'MOVED_IN', 'MOVED_OUT', 'DIED', 'CULLED', 'SOLD', 'COUNT_GAIN', 'COUNT_LOSS')),
                heads INT NOT NULL CHECK (heads > 0),
                kg NUMERIC(12, 3) CHECK (kg > 0),
                cause VARCHAR(300),
                document_id BIGINT,
                batch_day_id BIGINT,
                pair_id BIGINT,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_head_move_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_head_move_group FOREIGN KEY (tenant_id, group_id) REFERENCES sf_animal_groups (tenant_id, id),
                CONSTRAINT fk_sf_head_move_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id),
                CONSTRAINT fk_sf_head_move_day FOREIGN KEY (tenant_id, batch_day_id) REFERENCES sf_batch_days (tenant_id, id) ON DELETE CASCADE,
                CONSTRAINT fk_sf_head_move_pair FOREIGN KEY (tenant_id, pair_id) REFERENCES sf_head_movements (tenant_id, id) ON DELETE CASCADE
              );
              CREATE INDEX ix_sf_head_move_group ON sf_head_movements (tenant_id, group_id, move_date);

              -- Eggs into stock once a day (J5), like milk (I6)
              CREATE TABLE sf_egg_postings (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                day DATE NOT NULL,
                group_id BIGINT NOT NULL,
                document_id BIGINT NOT NULL,
                eggs INT NOT NULL CHECK (eggs > 0),
                CONSTRAINT uq_sf_egg_posting_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT uq_sf_egg_posting_doc UNIQUE (tenant_id, document_id),
                CONSTRAINT fk_sf_egg_posting_group FOREIGN KEY (tenant_id, group_id) REFERENCES sf_animal_groups (tenant_id, id),
                CONSTRAINT fk_sf_egg_posting_doc FOREIGN KEY (tenant_id, document_id) REFERENCES sf_finance_documents (tenant_id, id)
              );
              CREATE INDEX ix_sf_egg_posting_day ON sf_egg_postings (tenant_id, day, group_id);

              -- A farmer's health plan for a batch or herd, copied from an earlier one (J9)
              CREATE TABLE sf_health_plan_items (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                tenant_id BIGINT NOT NULL REFERENCES sf_tenants (id),
                group_id BIGINT NOT NULL,
                kind VARCHAR(16) NOT NULL CHECK (kind IN ('TREATMENT', 'VACCINATION', 'DEWORMING', 'HEALTH_OTHER')),
                description VARCHAR(300) NOT NULL,
                due_on DATE NOT NULL,
                done_event_id BIGINT,
                created_by BIGINT REFERENCES sf_users (id),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_sf_health_plan_tenant_id UNIQUE (tenant_id, id),
                CONSTRAINT fk_sf_health_plan_group FOREIGN KEY (tenant_id, group_id) REFERENCES sf_animal_groups (tenant_id, id),
                CONSTRAINT fk_sf_health_plan_event FOREIGN KEY (tenant_id, done_event_id) REFERENCES sf_animal_events (tenant_id, id) ON DELETE SET NULL
              );

              ALTER TABLE sf_livestock_settings ADD COLUMN egg_item_id BIGINT;
              ALTER TABLE sf_livestock_settings ALTER COLUMN milk_item_id DROP NOT NULL;
              ALTER TABLE sf_livestock_settings ADD CONSTRAINT fk_sf_livestock_egg_item FOREIGN KEY (tenant_id, egg_item_id) REFERENCES sf_stock_items (tenant_id, id);
      rollback:
        - sql:
            sql: >
              ALTER TABLE sf_livestock_settings DROP CONSTRAINT fk_sf_livestock_egg_item, DROP COLUMN egg_item_id;
              DROP TABLE sf_health_plan_items; DROP TABLE sf_egg_postings; DROP TABLE sf_head_movements; DROP TABLE sf_batch_days;
              ALTER TABLE sf_animal_events DROP COLUMN born_dead, DROP COLUMN born_alive, DROP CONSTRAINT ck_sf_animal_event_kind;
              ALTER TABLE sf_animals DROP CONSTRAINT ck_sf_animal_species;
              ALTER TABLE sf_animal_groups DROP CONSTRAINT ck_sf_animal_group_purpose_species, DROP CONSTRAINT ck_sf_animal_group_purpose,
                DROP COLUMN closed_on, DROP COLUMN strain, DROP COLUMN age_at_placement_days, DROP COLUMN placed_on, DROP COLUMN species;

  - changeSet:
      id: 046-poultry-goats-seed
      author: smartfarm360
      comment: The tray unit and the Chicks and young stock category (J3, J5). Modules stay off (J11).
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO sf_units (code, dimension, factor, sort_order) VALUES ('tray', 'COUNT', 30, 32);
              INSERT INTO sf_finance_categories (code, default_name, kind, account_code) VALUES ('YOUNG_STOCK', 'Chicks and young stock', 'EXPENSE', '5000');
      rollback:
        - sql:
            sql: DELETE FROM sf_finance_categories WHERE code = 'YOUNG_STOCK' AND tenant_id IS NULL; DELETE FROM sf_units WHERE code = 'tray';
