# Production profile (SaaS operations design, section 3). Start with SPRING_PROFILES_ACTIVE=prod.
# ProductionSettingsCheck refuses to start when any setting below is unsafe or missing.

# Behind Caddy: trust X-Forwarded-* so rate limits and audit use the real client address.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# JSON logs on the console (the container collects them). No request bodies, tokens or email addresses are logged.
logging.structured.format.console=logstash
logging.level.root=INFO

# Metrics and probes on a separate port that the reverse proxy does not serve (O4).
management.server.port=${MANAGEMENT_PORT:8091}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false

# The OpenAPI UI is off in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# The built web app is served from the same address (O2).
app.web.static-dir=${APP_WEB_STATIC_DIR:/app/web}
