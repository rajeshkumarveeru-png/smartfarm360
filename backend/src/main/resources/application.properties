spring.application.name=smartfarm360
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartfarm360}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartfarm360}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartfarm360}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}

# Local bootstrap administrator. Disable this initializer in production:
# APP_BOOTSTRAP_ADMIN_ENABLED=false
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}
app.bootstrap-admin.tenant-name=${APP_BOOTSTRAP_ADMIN_TENANT_NAME:SmartFarm360 Admin}
app.bootstrap-admin.tenant-slug=${APP_BOOTSTRAP_ADMIN_TENANT_SLUG:smartfarm360-admin}
