spring.application.name=smartfarm360
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartfarm360}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartfarm360}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartfarm360}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Set to "framework" when running behind a reverse proxy so client IPs (used for rate limiting) are correct.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}

# Authentication (ADR 0003). APP_JWT_SECRET must be set (32+ bytes) in every shared or production environment.
app.auth.jwt-secret=${APP_JWT_SECRET:}
app.auth.issuer=smartfarm360
app.auth.access-token-ttl=${APP_ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${APP_REFRESH_TOKEN_TTL:30d}
app.auth.refresh-cookie-secure=${APP_REFRESH_COOKIE_SECURE:true}
app.auth.max-failed-logins=5
app.auth.lockout-duration=15m
app.auth.password-reset-ttl=30m
app.auth.invitation-ttl=7d
app.auth.public-web-url=${APP_PUBLIC_WEB_URL:http://localhost:5174}

# Email delivery is not configured yet; emails are only logged (recipient masked).
# APP_MAIL_DEV_LOG_LINKS=true also logs reset/invitation links: local development only.
app.mail.dev-log-links=${APP_MAIL_DEV_LOG_LINKS:false}

# Platform administrator bootstrap: off unless explicitly enabled with an email and password.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Health only; no details for anonymous callers.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# API documentation (OpenAPI at /v3/api-docs, UI at /swagger-ui.html). Disable in production with APP_API_DOCS_ENABLED=false.
springdoc.api-docs.enabled=${APP_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_API_DOCS_ENABLED:true}
springdoc.paths-to-match=/api/v1/**
