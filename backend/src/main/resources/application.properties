spring.application.name=smartfarm360
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartfarm360}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartfarm360}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartfarm360}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Set to "framework" when running behind a reverse proxy so client IPs (used for rate limiting) are correct.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}

# Authentication (ADR 0003). APP_JWT_SECRET must be set (32+ bytes) in every shared or production environment.
app.auth.jwt-secret=${APP_JWT_SECRET:}
app.auth.issuer=smartfarm360
app.auth.access-token-ttl=${APP_ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${APP_REFRESH_TOKEN_TTL:30d}
app.auth.refresh-cookie-secure=${APP_REFRESH_COOKIE_SECURE:true}
app.auth.max-failed-logins=5
app.auth.lockout-duration=15m
app.auth.password-reset-ttl=30m
app.auth.invitation-ttl=7d
app.auth.public-web-url=${APP_PUBLIC_WEB_URL:http://localhost:5174}

# Email delivery is not configured yet; emails are only logged (recipient masked).
# APP_MAIL_DEV_LOG_LINKS=true also logs reset/invitation links: local development only.
app.mail.dev-log-links=${APP_MAIL_DEV_LOG_LINKS:false}

# Oldest phone app version allowed to send records (X-Client-Version); empty allows all (mobile offline design, N14).
app.min-client-version=${APP_MIN_CLIENT_VERSION:}

# Platform administrator bootstrap: off unless explicitly enabled with an email and password.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Health only; no details for anonymous callers.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# API documentation (OpenAPI at /v3/api-docs, UI at /swagger-ui.html). Disable in production with APP_API_DOCS_ENABLED=false.
springdoc.api-docs.enabled=${APP_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_API_DOCS_ENABLED:true}
springdoc.paths-to-match=/api/v1/**

# SMTP email (O5). Without SPRING_MAIL_HOST emails are only logged (local development).
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${APP_MAIL_FROM:SmartFarm360 <no-reply@localhost>}
# Where operational alerts and test alerts go (O4).
app.ops.alert-email=${APP_OPS_ALERT_EMAIL:}
management.health.mail.enabled=false

# Two-step sign-in secrets are encrypted with this key (32 bytes, base64). Required in production.
app.mfa.encryption-key=${APP_MFA_ENCRYPTION_KEY:}

# Whole-business exports (O9) are written here and removed after 7 days.
app.export.dir=${APP_EXPORT_DIR:${java.io.tmpdir}/smartfarm360-exports}
# Farm business deletions due after their 30 days' grace run daily (O10).
app.jobs.deletion-cron=${APP_DELETION_CRON:0 30 2 * * *}
# Directory of the built web app to serve at / (empty: the API only; Vite serves the web app in development).
app.web.static-dir=${APP_WEB_STATIC_DIR:}

# Billing and payments (billing design, Phase 15). The fake gateway moves no money; prod requires razorpay.
app.billing.gateway=${APP_BILLING_GATEWAY:fake}
app.billing.razorpay.key-id=${APP_BILLING_RAZORPAY_KEY_ID:}
app.billing.razorpay.key-secret=${APP_BILLING_RAZORPAY_KEY_SECRET:}
app.billing.webhook-secret=${APP_BILLING_WEBHOOK_SECRET:}
app.billing.seller.name=${APP_BILLING_SELLER_NAME:}
app.billing.seller.gstin=${APP_BILLING_SELLER_GSTIN:}
app.billing.seller.address=${APP_BILLING_SELLER_ADDRESS:}
app.billing.seller.state=${APP_BILLING_SELLER_STATE:}
app.billing.sac=${APP_BILLING_SAC:998314}
app.billing.invoice-prefix=${APP_BILLING_INVOICE_PREFIX:SF}
app.jobs.billing-cron=${APP_BILLING_CRON:0 15 2 * * *}
app.jobs.reconciliation-cron=${APP_RECONCILIATION_CRON:0 45 2 * * *}
